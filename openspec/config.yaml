# The one workflow every change in this store records. AGENTS.md documents
# it; the planning-pm, planning-qa, planning-design and planning-dev skills
# under .claude/skills/ draft it, one per hand. Engineering reads and checks
# off the plan from grade10, which points here with `store: grade10-spec`.
schema: grade10-planning

# Project context (optional) - shown to AI when creating artifacts.
context: |
  Grade10 (grade10.com) - trading cards and collectibles: grading, vaulting,
  card-backed financing, retail with an online marketplace, live shows, and
  card-market indexes. Users are collectors who buy, sell, grade, vault and
  showcase the cards and graded collectibles in their collection.
  One implementing repo, grade10 (React 19 + TypeScript on Vite), consumes
  this repo as its OpenSpec store and as its `external/grade10-spec` submodule,
  from source: `@grade10/design-system` (tokens, primitives), `@grade10/ui`
  (the compound components a spec names), `@grade10/i18n` (message catalogs).
  A component or token change is work here, in packages/design-system/,
  packages/ui/, or apps/preview/ (page assemblies supplying their own state).
  Readers: the PM or designer writing proposal, specs, journeys and feature
  suites, then stopping; QA reviewing those and deriving the wider suites; the
  designer writing ui-design; the engineer writing tech-design and tasks; and
  the engineer in grade10 building from it all.
  openspec/specs/ is the only source of every checkable requirement and
  component export contract; a change is the delta against it. A capability
  is openspec/specs/<product>/<domain>/<capability>/, and its id is that path.
  The four products are the four applications: grade10-site (the collector
  site - shell, addressing, store, auction, loyalty), grade10-admin (auction
  listings and campaigns, close-out, stock count), zzz-site (the ZZZ site),
  zzz-admin (the ZZZ admin site, nothing specified yet). shared/ is not an
  application: a capability lives there only when two or more products are
  held to it - auth/*, ui/*, console/*, design-sync/*, and the bare platform
  formats shared/dates-and-times, money-amounts, localization,
  frontend-composition. Placement follows who is held to it, not the topic.
  Money is an integer count of minor units plus an ISO 4217 code, never a float.
  docs/prds/ is the manual: one page per capability, and that page is the
  PRD. It moves first - whoever learns a product detail writes it there,
  marked 🚧 or ❓, before the artifact that depends on it - and never restates
  a requirement. docs/governance/prd-and-openspec.md draws the boundary;
  docs/governance/writing.md is the style of every artifact here.
  Every path these instructions name is this store's. Run from grade10, the
  CLI prints `Using OpenSpec root: grade10-spec (<path>)`, and a skill or
  document named here is under that path, never the application repository's.

# Per-artifact rules (optional)
rules:
  proposal:
    - "Start with `**Author:** @handle - YYYY-MM-DD` above `## Why`. Ask for the handle. It names the creator and never changes; task-group owners in tasks.md are separate."
    - "Interview the author first with the `grilling` skill (`.claude/skills/grilling/SKILL.md`), as `.claude/skills/planning-pm/SKILL.md` says: find repository facts yourself, bring only decisions, and draft once the frontier is empty. A deferred question goes under the proposal's open questions with who settles it."
    - "Include a metric that would move if this change works."
    - "Mark the PRDs the change touches before the deltas. A change carrying a 🚧 line cannot also claim `skip_specs`, and `skip_specs: true` owes a `skip_specs_why` beside it."
  specs:
    - "Two passes over one `spec.md`, with the blind suite between them: `## Purpose` and `## Feature set` first, then the suite, then the requirements. Both are `planning-qa`'s, or `planning-dev`'s on a change the engineer authored; the PM and the designer hand over and review. `check:manual`'s `outline` rule is the machine evidence of that order."
    - "Write `## Purpose` only when the text composed from the durable Purpose and the PRD differs from the durable one. When written it replaces that Purpose whole, for an existing capability as much as a new one."
    - "Feature set root group names are machine-read anchors. Rename one deliberately and update every `**Serves:**` and `**Trace:**` naming it in the same change. Leaves carry no ids."
    - "The fold carries `## Requirements` only. Archive copies Purpose, the feature set and `user-journeys.md` into the durable capability by hand."
    - "Scenario heading: `#### Scenario: <product>-<domain>-<capability>-SC-<n> - <title>`. The prefix is the capability path with slashes as hyphens, so two capabilities of one name stay apart. Number from 01; an issued id is permanent - a removal retires it, nothing renumbers it, and a renamed or moved capability keeps issuing its first prefix."
    - "Every scenario carries `**Serves:** <anchor> - <prose>` under its heading and above GIVEN/WHEN/THEN. The anchor is a journey id or a Feature set root group, matched verbatim. Several anchors are written as code spans, because a group name may hold a comma."
    - "Every `###` under a requirements section is a `### Requirement:` - never a group heading: the fold absorbs it into the requirement above, and an ATX `## Group` ends the section and drops every requirement after it."
    - "One requirement for the flow, as numbered steps for whoever uses the surface - not a scenario per step. One requirement per entity with fields, only when this change adds or changes them, and one per entity with states; both as markdown tables. Never restate an unchanged fact."
    - "A scenario is `**WHEN**` / `**THEN**`, both required; add `**GIVEN**` only when state must be in place before the trigger. Keep scenarios to behaviour distinctive to this capability: one that restates a platform default belongs to the capability that sets it - find that yourself."
    - "Money is minor units plus an ISO 4217 code. Convert yourself: the author says HKD 10, the spec says 1000 HKD minor units."
    - "No class, function, hook, table or library names; public component exports are the one exception, kept in one requirement. Propose the export set yourself from `packages/ui` and say in the proposal which do not exist yet."
    - "Requirements live here and nowhere else; a testable statement never stays on a PRD (AGENTS.md § Sources of truth)."
    - "Prose short, tables carry detail (docs/governance/writing.md). Before coining a shape, read the capabilities beside this one and reuse their wording, table columns and state names. Before handing over, read each requirement as the engineer in the other repository will - every term defined, every value stated, every scenario decidable - and fix what fails."

  user-journeys:
    - "The schema instruction holds the rules; `pnpm check:manual` enforces the role, the `**Walked by:** nobody` routing declaration, the verbatim context copies and every anchor."
    - "Journey ids are `<capability prefix>-US-<n>`, permanent and never renumbered. There is no `**Accepted by:**` line, and no cap on the number of journeys."
  test-cases:
    - "`docs/governance/specs-to-test-cases.md` governs the shape. Draft with `spec-to-tcs` as a blind pass against the anchors, never from the scenarios. `test-cases.md` is not a suite name."
  ui-design:
    - "The schema text above and `.claude/skills/planning-design/SKILL.md` carry the rules: link the Figma frame, name exports exactly and flag what does not exist yet, and fix the spec when a state has no scenario."
  tech-design:
    - "The schema instruction above holds the section rules; `pnpm check:manual` refuses a change that owes this file and carries neither it nor `design_waived: <why>` in `.openspec.yaml`."
  tasks:
    - "The schema instruction above holds the rules; `docs/governance/task-ownership.md` is the format tooling on both sides parses, and `pnpm check:manual` verifies the PRD task."

# Per-operation guidance (optional)
operations:
  apply:
    guidance:
      - "Nothing to apply until tasks.md exists; `openspec status --change <name>` lists what is missing. Read `.claude/skills/openspec-apply-change/SKILL.md`, and run the implementing repository's `tdd` skill when it ships one (grade10: `.claude/skills/tdd`) - it governs the test-first loop."
      - "A product detail learned while implementing - an outcome the code cannot deliver, a state nobody specified - lands on the capability's PRD first, marked 🚧 or ❓, then in the delta spec; never in the code alone."
      - "Work test-first inside each task, one scenario at a time, at pre-agreed seams - the spec scenarios and public exports the task names, never internals. Expected values come from the spec or a worked example, never from what the code computes. Run the repository's typecheck and the touched tests as you go, and its full check suite at the end of each group as that group's verification."
      - "When the tasks are done, review the branch's diff on two axes and report them separately: does it follow the repository's conventions, and does it implement exactly the delta specs - missing or partial requirements, behaviour nobody asked for, requirements implemented wrong."
      - "Commit to the current branch as tasks complete, atomically, per AGENTS.md § Pull Requests and Commits."
  archive:
    guidance:
      - "Archive only after engineering confirms the change is deployed, not when the code merges. `.claude/skills/openspec-archive-change/SKILL.md` and `pnpm run archive:preflight <change>` carry the steps."
      - "Never archive with an unchecked task: finish it, or append its disposition (dropped, moved where, blocked on what) to the task text. A change that never grew a tasks.md is archived once its specs are confirmed deployed."
      - "Copy the change's `## Purpose` where it wrote one, its `## Feature set` and its `user-journeys.md` into the durable capability by hand - the fold carries `## Requirements` alone, and a written Purpose replaces the durable one whole. Leave a one-line tombstone under the durable journeys' `## Retired` for every removed journey, and never delete the journey outright: archived suites still trace its id. Carry an approved `feature-tcs.md` beside the spec and a `domain-tcs.md` into the domain directory the same way, stripping the scenario ids from its `## Reconciliation` as you go and carrying its `## Settled` across whole - that section is what stops the next blind pass raising a reading this one already refused. Re-read the folded specs and confirm they describe the shipped behaviour. `pnpm run archive:preflight` reads all six of these and refuses while any is undone."
      - "Update the capability's PRD to what shipped before archiving - take the 🚧 marks off the lines this change delivered - and run `pnpm check:manual`."
