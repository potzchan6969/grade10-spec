# Default workflow for a change that records no schema of its own. AGENTS.md
# documents both schemas and the `openspec-propose` skill chooses between them.
schema: full-planning

# This repo is an OpenSpec store, and more besides: PM and design own the
# proposals and specs under openspec/ and the PRDs under docs/prds/, engineering
# writes the delivery plan - design, ui, tasks - on top of them, and
# packages/design-system/ holds the components and tokens the applications
# consume. Engineering reads and checks off the plan from grade10, which points
# here with `store: grade10-spec`.

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Grade10 (grade10.com) - Trading-card and collectibles ecosystem,
  spanning grading, vaulting, card-backed financing, retail with an online
  marketplace, live shows, and real-time card-market indexes. The core objects
  are cards and graded collectibles in a collector's collection; users are
  collectors who buy, sell, grade, vault, and showcase them.
  This store holds planning for every Grade10 surface. Today that is one
  implementing repo, grade10 (React 19 + TypeScript on Vite),
  which consumes this repo two ways at once - as this OpenSpec store, and as its
  `external/grade10-spec` submodule, built from source with no published
  artifact: `@grade10/design-system` for the tokens and primitives,
  `@grade10/ui` for the shared compound components a capability spec names, and
  `@grade10/i18n` for the message catalogs.
  Audience for these artifacts: a PM or designer writing the proposal and the
  specs and stopping there, an engineer writing the design, ui, and tasks when
  delivery is planned, and an engineer in the application repo reading all of
  it as the only source of truth for what to build.
  openspec/specs/ is the single source of truth for every checkable requirement
  and component export contract; a change under openspec/ is the delta against
  it. Specs are grouped by product as openspec/specs/<product>/<capability>/;
  the products are grade10-store (the Grade10 trading-card store surfaces),
  zzz-store, and shared-ui (cross-product contracts for the shared component
  package packages/ui that every store application consumes). A capability's
  ID is <product>/<capability>. docs/prds/ holds only the product decision behind a requirement - problem,
  users, non-goals, measurement, rollout, rationale - and never restates one.
  docs/governance/prd-and-openspec.md explains the boundary - follow it.
  Money is always an integer count of minor units plus an ISO 4217 currency
  code, never a float - specs must state amounts that way.
  A change that alters a component or a token is work in this repo:
  packages/design-system/ holds the primitives and the Figma token pipeline,
  packages/ui/ holds the shared compound components a capability spec names,
  and apps/preview/ is the cross-package preview app where whole pages are
  assembled from both. Each package colocates its own stories; apps/preview holds
  only page assemblies, and supplies their content and state itself, the way a
  store application does.

# Per-artifact rules (optional)
rules:
  proposal:
    - "Start the file with an author line above `## Why`, in the form `**Author:** @handle - YYYY-MM-DD`, naming whoever wrote the proposal. Ask for the handle rather than guessing it. This is the change's creator and does not change when someone else edits the proposal - task group owners in tasks.md are a separate thing."
    - Open with the collector problem and the evidence for it, not the solution.
    - Include a metric that would move if this change works.
    - Always list Non-goals so engineering knows the edges.
    - "Before drafting, interview the author with the `grilling` skill: read `.cursor/skills/grilling/SKILL.md` at this store's root and run its round-based frontier interview. `.cursor/skills/` is the source of truth `pnpm run agent:check-parity` verifies; the byte-identical generated copies under `.claude/skills/` and `.codex/skills/` serve just as well."
    - "Find facts (existing specs, PRDs, change history, code) yourself before asking; bring only decisions to the author. If reading the existing material leaves nothing open, say so and proceed - the interview scales with the open questions, not the change's size."
    - "Do not write the proposal until the frontier is empty and the author confirms shared understanding. The author may accept all recommended answers to conclude in one round."
  specs:
    - Use Given/When/Then format
    - Reference existing patterns before inventing new ones
    - Write requirements an engineer in another repo can implement without asking a follow-up question.
    - "Never name a class, function, hook, table, or library in a spec - that is design's job: design.md under the full-planning schema, and the implementing repo's own change under pm-planning. Public component exports are the exception: the export name is the cross-repo contract, so name it, and keep the set in one requirement."
    - Every scenario must be checkable by a test or a manual pass.
    - Requirements live here and nowhere else. Never leave a testable statement in a PRD.
  design:
    - Record alternatives considered for each decision; engineering inherits these trade-offs.
    - Link the capability spec rather than restating requirements; screens and Figma sources belong in ui.md.
  ui:
    - Link each screen's Figma frame rather than describing it in prose - the frame is the layout's source of truth.
    - "Name design-system and packages/ui exports exactly - the export name is the cross-repo contract. A component, variant, or token that does not exist yet is work in this repo; flag it so tasks carries it."
    - A state with no spec scenario behind it means the spec is missing one - fix the spec, not the ui doc.
  tasks:
    - "Split groups by layer: shared types and interfaces first, then data migration, then backend and API, then frontend. Omit a layer the change does not touch rather than writing an empty group. When a change spans this repo and an application repo, the groups here land first - the submodule bump is the boundary."
    - "Once the shared-interface group lands, backend and frontend groups depend on it, not on each other: write each so it can be claimed in parallel and verified on its own - frontend against the contracts and fixtures, never a running backend. When a group truly needs another group's landed code, say so in a prose line under its heading; otherwise group order is convention, not a dependency."
    - Order groups so an engineer can ship and verify one group at a time, ending each group with its verification step.
    - 'Phrase an implementation task as the spec scenario(s) it makes pass, naming them, so the scenario''s test is the evidence behind the checkmark. Never split "write the tests" into its own task or group - the engineer works test-first inside each task.'
    - Keep each task to something one engineer finishes in a session.
    - "Follow docs/governance/task-ownership.md for the group, task-id, and owner format. Write groups without owner tags - engineers claim them at pickup - and never renumber a group or task that is claimed or has checkmarks."

# Per-operation guidance (optional)
operations:
  apply:
    guidance:
      - "This guidance describes implementing a change that carries a tasks.md - a full-planning change. A pm-planning change has none: it is complete at its specs, and is promoted to full-planning - design.md and tasks.md added, `schema:` changed in its .openspec.yaml - when someone is ready to build it. Until then there is nothing here to apply."
      - "Run the implementing repository's `tdd` skill when it ships one (grade10 has it at `.claude/skills/tdd`); its red-green loop and test-quality rules govern the test-first work described next."
      - "Work test-first inside each task, one scenario at a time: the seams under test are pre-agreed - they are the spec scenarios and public export contracts the task names, never internals. Write the failing test at that seam, then only enough code to make it pass."
      - "Expected values in a test come from the spec or a worked example, never from recomputing what the code does; a test that breaks under refactor without a behavior change is testing the wrong thing."
      - "Run the implementing repository's typecheck and the touched test or story files regularly as you go; run its full check suite once at the end of each group, as that group's verification step."
      - "When the change's tasks are done, review the branch's diff along two axes and report them separately, never merged: does the code follow the repository's documented conventions, and does it implement exactly the change's delta specs - flag missing or partial requirements, behavior nobody asked for, and requirements that look implemented but wrong."
      - "Commit to the current branch as tasks complete, keeping commits atomic per the repository's commit conventions."
  archive:
    guidance:
      - Archive only after engineering confirms the change is deployed, not when the code merges.
      - "Never archive a change that has a tasks.md with an unchecked task: finish it, or append its disposition (dropped, moved where, blocked on what) to the task text so the record stays honest. A pm-planning change has no tasks.md - archive it once engineering confirms the specs it carries are deployed."
      - Re-read the updated main specs afterward and confirm they describe the shipped behavior.
