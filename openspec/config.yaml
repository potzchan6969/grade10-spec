# Default workflow for a change that records no schema of its own. AGENTS.md
# documents both schemas, the `openspec-propose` skill routes between them, and
# the `pm-planning` and `full-planning` skills draft in each lane.
schema: full-planning

# This repo is an OpenSpec store, and more besides: PM and design own the
# proposals and specs under openspec/ and the PRDs under docs/prds/, engineering
# writes the delivery plan - design, ui, tasks - on top of them, and
# packages/design-system/ holds the components and tokens the applications
# consume. Engineering reads and checks off the plan from grade10, which points
# here with `store: grade10-spec`.

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Grade10 (grade10.com) - Trading-card and collectibles ecosystem,
  spanning grading, vaulting, card-backed financing, retail with an online
  marketplace, live shows, and real-time card-market indexes. The core objects
  are cards and graded collectibles in a collector's collection; users are
  collectors who buy, sell, grade, vault, and showcase them.
  This store holds planning for every Grade10 surface. Today that is one
  implementing repo, grade10 (React 19 + TypeScript on Vite),
  which consumes this repo two ways at once - as this OpenSpec store, and as its
  `external/grade10-spec` submodule, built from source with no published
  artifact: `@grade10/design-system` for the tokens and primitives,
  `@grade10/ui` for the shared compound components a capability spec names, and
  `@grade10/i18n` for the message catalogs.
  Audience for these artifacts: a PM or designer writing the proposal and the
  specs and stopping there, an engineer writing the design, ui, and tasks when
  delivery is planned, and an engineer in the application repo reading all of
  it as the only source of truth for what to build.
  openspec/specs/ is the single source of truth for every checkable requirement
  and component export contract; a change under openspec/ is the delta against
  it. Specs are grouped by product as openspec/specs/<product>/<capability>/;
  the products are grade10-store (the Grade10 trading-card store surfaces),
  zzz, grade10-site (the grade10 application's own surfaces, starting
  with the shell every page renders in), and shared-ui (cross-product contracts
  for the shared components every store application consumes: packages/ui, and
  the site chrome the design system publishes). A capability's
  ID is <product>/<capability>. docs/prds/ holds only the product decision behind a requirement - problem,
  users, non-goals, measurement, rollout, rationale - and never restates one.
  docs/governance/prd-and-openspec.md explains the boundary - follow it.
  Money is always an integer count of minor units plus an ISO 4217 currency
  code, never a float - specs must state amounts that way.
  A change that alters a component or a token is work in this repo:
  packages/design-system/ holds the primitives and the Figma token pipeline,
  packages/ui/ holds the shared compound components a capability spec names,
  and apps/preview/ is the cross-package preview app where whole pages are
  assembled from both. Each package colocates its own stories; apps/preview holds
  only page assemblies, and supplies their content and state itself, the way a
  store application does.

# Per-artifact rules (optional)
rules:
  proposal:
    - "Start the file with an author line above `## Why`, in the form `**Author:** @handle - YYYY-MM-DD`, naming whoever wrote the proposal. Ask for the handle rather than guessing it. This is the change's creator and does not change when someone else edits the proposal - task group owners in tasks.md are a separate thing."
    - Open with the collector problem and the evidence for it, not the solution.
    - Include a metric that would move if this change works.
    - Always list Non-goals so engineering knows the edges.
    - "Before drafting, interview the author with the `grilling` skill: read `.cursor/skills/grilling/SKILL.md` at this store's root and run its round-based frontier interview. `.cursor/skills/` is the source of truth `pnpm run agent:check-parity` verifies; the byte-identical generated copies under `.claude/skills/` and `.codex/skills/` serve just as well."
    - "Find facts (existing specs, PRDs, change history, code) yourself before asking; bring only decisions to the author. If reading the existing material leaves nothing open, say so and proceed - the interview scales with the open questions, not the change's size."
    - "Do not write the proposal until the frontier is empty and the author confirms shared understanding. The author may accept all recommended answers to conclude in one round."
  specs:
    - "Open with `## Purpose`, then `## Feature set`, then `## User journeys`, then `## ADDED Requirements` (or MODIFIED / REMOVED / RENAMED). The feature set is the spec's map, the journeys say who walks it, and the requirements follow both."
    - "Feature set is two-layer bullets. Each root group name is at most five words. Each child is `Name: purpose` - a short sentence for why that item exists, not only a label."
    - "Keep feature-set groups coarse. Nest related work under the job it serves (for example winner contact under payment collection). Put grants in the groups they belong to; do not make grants its own group."
    - "Name the change's major user journeys under `## User journeys` - at most five across every spec file the change touches. A journey is one actor pursuing one goal from start to finish (an operator publishes a listing; a collector bids and wins); a name that needs an `and` is two journeys. A change that wants a sixth is two changes - split it rather than shrinking the journeys to fit."
    - "Title a journey the way a test analyst titles a case: lead with the actor, then the action, in the third person - `Collector enters the catalogue through a collection`, `Operator traces who committed what`. Not a bare verb phrase (`Enter the catalogue`), not the first person (`Read the lots I watch`), and never so vague that two journeys could share the title."
    - "A capability no end user reaches on its own is exempt from `## User journeys`: a cross-cutting policy every other spec inherits (money amounts, dates and times, localization), a package or composition contract, a backend convention. It still carries `## Feature set` and id'd scenarios, because a task, a review, and a test case all name those. Never invent an actor to satisfy the rule - a spec that names nobody who walks it has no journeys section at all, rather than an empty or a fabricated one. The journeys live in the capability the reader actually reaches, which inherits the policy."
    - "Write each journey as one user story from the actor's side, never the system's: `As a <role>, I want <capability>, so that <benefit>`. The role is an end user the spec already names, and the benefit is one the requirements or the proposal already justify - a story never introduces either."
    - "Hold every story to INVEST: Independent (buildable without waiting on another story), Negotiable (states the need and leaves the implementation open), Valuable (names a benefit the actor or the business feels), Estimable (concrete enough for an engineer to size), Small (fits inside one sprint), Testable (its acceptance criteria are the scenarios beneath it, each objectively pass or fail). A story that fails one of the six is split or reworded, never widened to fit."
    - "Give every user story and every scenario an id so a task or a review comment can name one: `<capability>-US-<n>` for a story, `<capability>-SC-<n>` for a scenario, where `<capability>` is the spec directory's own name (`home`, `admin-listing`). Carry the story id in its heading - `### admin-listing-US-01: Save an unfinished listing and come back to it` - and the scenario id in its own - `#### Scenario: admin-listing-SC-01 - Operator saves an empty draft`. Format each journey for a human reader: break the story onto three labeled lines (`**As a** …`, `**I want** …`, `**so that** …`), then an `**Accepted by:**` bullet list where each line is `` `id` — Scenario title `` — never a comma-separated id dump."
    - "Number ids sequentially within a capability from 01, and treat an issued id as permanent: a delta that adds a scenario takes the next unused number, a delta that removes one retires its id rather than freeing it, and no delta renumbers an id that already exists. A task, a review, and a downstream test all point at an id, so a reused number silently rewrites every one of them."
    - "Group requirements under those same root titles in a durable spec, and only there: `### Group name`, a line of `---`, then the `### Requirement:` blocks under it. Groups are reading order for openspec/specs/ and nothing more. Never write one inside a delta's `## ADDED` / `## MODIFIED` / `## REMOVED` / `## RENAMED` section - the fold copies the heading through verbatim, so the archive either aborts or lands a stray heading between two requirements. Do not use ATX `## Group` anywhere - that ends `## ADDED Requirements` and drops every requirement."
    - "The fold carries `## Requirements` and nothing else. A delta's `## Feature set` and `## User journeys` never reach the durable spec, whether the change creates the capability or edits one. Keep writing them - they are how a change is read before it ships - and the archive workflow copies them into the durable spec by hand."
    - "Write one requirement for the flow. Numbered steps for whoever uses the surface - collector, operator, or both. Do not write a scenario per step."
    - "Write one requirement per entity that has fields, only when this change adds or changes those fields. Describe fields in a markdown table. Do not restate unchanged facts as a requirement."
    - "Write one requirement per entity that has states. Describe states in a markdown table."
    - "Drop scenarios that only restate platform defaults. Keep scenarios for distinctive behavior."
    - "Keep copy brief and simple. Tables carry the detail; prose stays short."
    - Use Given/When/Then format
    - Reference existing patterns before inventing new ones
    - Write requirements an engineer in another repo can implement without asking a follow-up question.
    - "Never name a class, function, hook, table, or library in a spec - that is design's job: design.md under the full-planning schema, and the implementing repo's own change under pm-planning. Public component exports are the exception: the export name is the cross-repo contract, so name it, and keep the set in one requirement."
    - Every scenario must be checkable by a test or a manual pass.
    - Requirements live here and nowhere else. Never leave a testable statement in a PRD.
  design:
    - "Use top-level sections for Context, Goals / Non-Goals, Decisions, each material implementation contract, Risks / Trade-offs, and Migration Plan. Database Schema and Service Interfaces are implementation contracts, not subsections of Decisions. Omit a section that does not apply."
    - Use bullets and tables for dense technical material; reserve paragraphs for short connective text.
    - Link the capability spec rather than restating requirements.
    - Screens and Figma sources belong in ui.md.
    - Record alternatives considered for each decision; engineering inherits these trade-offs.
    - "For a data-model change, add a top-level Database Schema section that names owning and affected tables, gives proposed columns with types and nullability, states keys, constraints and indexes, distinguishes authoritative from derived data, and includes an ER diagram for the relevant relationships."
    - "For each added or changed column under Database Schema section, Postgres type, nullability, and default, matching the existing schema's conventions. Reuse a table or stamp that already holds the fact; do not add a second column for the same message. Spec fields read from another row at query time are not stored."
    - "For a service change, add a top-level Service Interfaces section that models each service function as a processor with one fixed input shape and one fixed success/refusal output shape. State transaction ownership, locks, reads, writes, idempotency, faults, and the boundary between entrypoint, service, repository, and persistence."
    - "For every flow that mutates multiple tables, name the mutation order and atomic boundary, then give concrete example input and output values showing the affected rows before or after processing."
    - Show end-to-end identity and data enrichment when a request crosses browser, authenticated backend, service entrypoint, service, repository, or persistence boundaries.
    - "API contracts are optional: include them only when the wire changes in a meaningful way (breaking rename, additive authenticated field, new admin read). Do not list unchanged endpoints."
    - "Do not mitigate a risk with 'the spec says so'. Mitigation is an implementation control - a lock, a stamp, a state column."
  ui:
    - Link each screen's Figma frame rather than describing it in prose - the frame is the layout's source of truth.
    - "Name design-system and packages/ui exports exactly - the export name is the cross-repo contract. A component, variant, or token that does not exist yet is work in grade10-spec; flag it so tasks carries it."
    - A state with no spec scenario behind it means the spec is missing one - fix the spec, not the ui doc.
  tasks:
    - "Split groups by layer: shared types and interfaces first, then data migration, then backend and API, then frontend. Omit a layer the change does not touch rather than writing an empty group. When a change spans grade10-spec and an application repo, the grade10-spec groups land first - the submodule bump is the boundary."
    - "Name a group's repository by its clone name in the group title - (grade10-spec), (grade10) - never 'this repo' or 'here': tasks.md is written in this store and read from the application repo, so a deictic reference flips meaning between the two."
    - "Once the shared-interface group lands, backend and frontend groups depend on it, not on each other: write each so it can be claimed in parallel and verified on its own - frontend against the contracts and fixtures, never a running backend. When a group truly needs another group's landed code, say so in a prose line under its heading; otherwise group order is convention, not a dependency."
    - Order groups so an engineer can ship and verify one group at a time, ending each group with its verification step.
    - 'Phrase an implementation task as the spec scenario(s) it makes pass, naming them, so the scenario''s test is the evidence behind the checkmark. Never split "write the tests" into its own task or group - the engineer works test-first inside each task.'
    - Keep each task to something one engineer finishes in a session.
    - "Follow docs/governance/task-ownership.md for the group, task-id, and owner format. Write groups without owner tags - engineers claim them at pickup - and never renumber a group or task that is claimed or has checkmarks."
    - "A change whose deltas touch a capability carries a task to update that capability's manual page (manual/ in this store, a grade10-spec group): the page tells the shipped story, and `pnpm check:manual` verifies it."

# Per-operation guidance (optional)
operations:
  apply:
    guidance:
      - "This guidance describes implementing a change that carries a tasks.md - a full-planning change. A pm-planning change has none: it is complete at its specs, and is promoted to full-planning - design.md and tasks.md added, `schema:` changed in its .openspec.yaml - when someone is ready to build it. Until then there is nothing here to apply."
      - "Run the implementing repository's `tdd` skill when it ships one (grade10 has it at `.claude/skills/tdd`); its red-green loop and test-quality rules govern the test-first work described next."
      - "Work test-first inside each task, one scenario at a time: the seams under test are pre-agreed - they are the spec scenarios and public export contracts the task names, never internals. Write the failing test at that seam, then only enough code to make it pass."
      - "Expected values in a test come from the spec or a worked example, never from recomputing what the code does; a test that breaks under refactor without a behavior change is testing the wrong thing."
      - "Run the implementing repository's typecheck and the touched test or story files regularly as you go; run its full check suite once at the end of each group, as that group's verification step."
      - "When the change's tasks are done, review the branch's diff along two axes and report them separately, never merged: does the code follow the repository's documented conventions, and does it implement exactly the change's delta specs - flag missing or partial requirements, behavior nobody asked for, and requirements that look implemented but wrong."
      - "Commit to the current branch as tasks complete, keeping commits atomic per the repository's commit conventions."
  archive:
    guidance:
      - Archive only after engineering confirms the change is deployed, not when the code merges.
      - "Never archive a change that has a tasks.md with an unchecked task: finish it, or append its disposition (dropped, moved where, blocked on what) to the task text so the record stays honest. A pm-planning change has no tasks.md - archive it once engineering confirms the specs it carries are deployed."
      - "Copy the change's `## Feature set` and `## User journeys` into the durable spec by hand - the fold carries `## Requirements` alone, so those sections and every `-US-` id in them die with the change otherwise."
      - Re-read the updated main specs afterward and confirm they describe the shipped behavior.
      - "Update the capability's manual page to the shipped story before archiving and run `pnpm check:manual` - the archive folds the spec, and a page telling the pre-change story is drift the reader sees first."
