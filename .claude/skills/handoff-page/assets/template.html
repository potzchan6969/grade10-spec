<title>Handoff Page</title>
<style>
  /* Layout: one 760px reading column, with a contents rail down the left edge from 1120px wide, as the manual has.
     The page opens on its name and state, lists every change at a glance, then gives
     each change one card: what it was, what it is now, the picture, and the proof. */
  :root {
    --bg: #f5f5f4;
    --surface: #ffffff;
    --sunk: #fafaf9;
    --stage: #f2f1ef;
    --fg: #1b1918;
    --muted: #6b6866;
    --line: #e6e5e5;
    --line-strong: #d5d3d2;
    --accent: #856128;
    --accent-soft: #f8f2e8;
    --accent-line: #e6d3b1;
    --ok: #53753d;
    --ok-soft: #eff5eb;
    --warn: #776827;
    --warn-soft: #f6f3e4;
    --bad: #ae3f2d;
    --bad-soft: #fbf0ef;
    --info: #2173a6;
    --info-soft: #eaf4fb;
    --none: #6b6866;
    --none-soft: #efeeed;
    --ins: #d3e7c5;
    --del: #f4d4cc;
    --scrim: rgb(11 10 10 / 72%);
    --on-scrim: #fafaf9;
    --shadow: 0 1px 2px rgb(27 25 24 / 5%), 0 6px 18px rgb(27 25 24 / 4%);
    --lift: 0 14px 34px rgb(27 25 24 / 18%);
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --r: 14px;
    --r-sm: 9px;
    /* The product's own screen, drawn light in both page themes on purpose */
    --g-bg: #ffffff;
    --g-subtle: #fafaf9;
    --g-fg: #1b1918;
    --g-muted: #75726f;
    --g-line: #e6e5e5;
    --g-primary: #c4903d;
    --g-on-primary: #ffffff;
    --g-bezel: #2e2c2a;
    --g-info: #eaf4fb;
    --g-on-info: #19557b;
    --g-warn: #f6f3e4;
    --g-on-warn: #584d1d;
    --g-ok: #eff5eb;
    --g-on-ok: #3e572d;
    --g-bad: #fbf0ef;
    --g-on-bad: #822f21;
    --g-accent: #f8f2e8;
    --g-on-accent: #62481e;
    --g-lock: linear-gradient(160deg, #42403e, #1b1918);
    --g-font: "canada-type-gibson", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f0e0d;
      --surface: #1b1918;
      --sunk: #151413;
      --stage: #131211;
      --fg: #f5f5f4;
      --muted: #a7a4a1;
      --line: #2e2c2a;
      --line-strong: #42403e;
      --accent: #d3ac6e;
      --accent-soft: rgb(196 144 61 / 16%);
      --accent-line: rgb(211 172 110 / 40%);
      --ok: #9dc086;
      --ok-soft: rgb(102 144 75 / 20%);
      --warn: #cdb965;
      --warn-soft: rgb(177 154 58 / 18%);
      --bad: #e39d91;
      --bad-soft: rgb(207 88 68 / 20%);
      --info: #77bae4;
      --info-soft: rgb(41 141 204 / 20%);
      --none: #a7a4a1;
      --none-soft: rgb(157 154 151 / 16%);
      --ins: rgb(120 170 90 / 34%);
      --del: rgb(214 96 76 / 34%);
      --shadow: none;
      --lift: 0 14px 34px rgb(0 0 0 / 55%);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f0e0d;
    --surface: #1b1918;
    --sunk: #151413;
    --stage: #131211;
    --fg: #f5f5f4;
    --muted: #a7a4a1;
    --line: #2e2c2a;
    --line-strong: #42403e;
    --accent: #d3ac6e;
    --accent-soft: rgb(196 144 61 / 16%);
    --accent-line: rgb(211 172 110 / 40%);
    --ok: #9dc086;
    --ok-soft: rgb(102 144 75 / 20%);
    --warn: #cdb965;
    --warn-soft: rgb(177 154 58 / 18%);
    --bad: #e39d91;
    --bad-soft: rgb(207 88 68 / 20%);
    --info: #77bae4;
    --info-soft: rgb(41 141 204 / 20%);
    --none: #a7a4a1;
    --none-soft: rgb(157 154 151 / 16%);
    --ins: rgb(120 170 90 / 34%);
    --del: rgb(214 96 76 / 34%);
    --shadow: none;
    --lift: 0 14px 34px rgb(0 0 0 / 55%);
    color-scheme: dark;
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 var(--font);
    -webkit-font-smoothing: antialiased;
    overflow-wrap: break-word;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto;
    z-index: 10;
    height: env(safe-area-inset-top, 0px);
    background: var(--bg);
  }
  @media (prefers-reduced-motion: no-preference) {
    html {
      scroll-behavior: smooth;
    }
    .option {
      transition:
        border-color 0.15s,
        background-color 0.15s;
    }
  }
  h1,
  h2,
  h3,
  h4,
  p,
  dl,
  dd,
  figure {
    margin: 0;
  }
  a {
    color: var(--accent);
    text-underline-offset: 2px;
    text-decoration-thickness: 1px;
  }
  a:hover {
    text-decoration-thickness: 2px;
  }
  code {
    font-family: var(--mono);
    font-size: 0.86em;
    padding: 1px 5px;
    border-radius: 5px;
    background: var(--sunk);
    border: 1px solid var(--line);
    overflow-wrap: anywhere;
  }
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  .page {
    max-width: 1100px;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px 88px;
  }
  .main {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 32px;
    max-width: 760px;
    min-width: 0;
    margin: 0 auto;
  }
  @media (min-width: 720px) {
    .page {
      padding-left: max(32px, env(safe-area-inset-left, 0px));
      padding-right: max(32px, env(safe-area-inset-right, 0px));
      padding-block: 44px 120px;
    }
    .main {
      gap: 48px;
    }
  }
  /* The contents rail: down the left edge from 1120px wide, as the manual's nav; a drawer below that */
  :root {
    --rail-w: 288px;
  }
  .rail {
    position: fixed;
    inset: 0 auto 0 0;
    z-index: 30;
    width: min(var(--rail-w), 86vw);
    overflow-y: auto;
    overscroll-behavior: contain;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    border-right: 1px solid var(--line);
    background: var(--sunk);
    scrollbar-width: thin;
    scrollbar-color: var(--line-strong) transparent;
    transform: translateX(-100%);
    visibility: hidden;
    transition:
      transform 200ms cubic-bezier(0.32, 0.72, 0, 1),
      visibility 200ms;
  }
  .rail-open .rail {
    transform: none;
    visibility: visible;
    box-shadow: 0 0 40px rgb(0 0 0 / 18%);
  }
  .rail-scrim {
    position: fixed;
    inset: 0;
    z-index: 29;
    background: var(--scrim);
    opacity: 0;
    pointer-events: none;
    transition: opacity 200ms;
  }
  .rail-open .rail-scrim {
    opacity: 1;
    pointer-events: auto;
  }
  @media (prefers-reduced-motion: reduce) {
    .rail,
    .rail-scrim {
      transition: none;
    }
  }
  @media (min-width: 1120px) {
    body.has-rail {
      padding-left: var(--rail-w);
    }
    .rail {
      width: var(--rail-w);
      transform: none;
      visibility: visible;
      transition: none;
    }
    .rail-open .rail {
      box-shadow: none;
    }
    .rail-scrim,
    .rail-close {
      display: none;
    }
  }

  /* The masthead: what this is, its state, and what it asks */
  .top {
    display: grid;
    gap: 14px;
  }
  .flag {
    justify-self: start;
    padding: 6px 12px;
    border-radius: var(--r-sm);
    font-weight: 700;
    font-size: 14px;
    background: var(--tone-soft);
    color: var(--tone);
  }
  .run {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    row-gap: 2px;
    margin-left: -1.1em;
    clip-path: inset(-8px -8px -8px 1.1em);
  }
  .run-part::before {
    content: "\00b7";
    display: inline-block;
    width: 1.1em;
    color: var(--muted);
    text-align: center;
  }
  .eyebrow {
    color: var(--muted);
    font-size: 14px;
  }
  .kindword {
    color: var(--accent);
    font-size: 12.5px;
    font-weight: 750;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .top h1 {
    font-size: clamp(30px, 4.6vw, 40px);
    line-height: 1.1;
    font-weight: 760;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }
  .verdict {
    display: grid;
    gap: 6px;
    padding: 16px 18px;
    border-radius: var(--r);
    background: var(--tone-soft);
    border: 1px solid color-mix(in srgb, var(--tone) 24%, transparent);
  }
  .verdict-word {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--tone);
    font-size: 12.5px;
    font-weight: 780;
    letter-spacing: 0.07em;
    text-transform: uppercase;
  }
  .verdict-word::before {
    content: "";
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: currentcolor;
  }
  .verdict-reason,
  .lead {
    font-size: clamp(18px, 2.5vw, 21px);
    line-height: 1.4;
    font-weight: 640;
    text-wrap: pretty;
  }
  .verdict-ask {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 14px;
    margin-top: 4px;
    font-size: 15px;
  }
  .go {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 999px;
    background: var(--fg);
    color: var(--bg);
    font-size: 14px;
    font-weight: 650;
    text-decoration: none;
  }
  .go::after {
    content: "\2193";
  }
  .period {
    color: var(--muted);
    font-size: 15px;
  }
  .period strong {
    color: var(--fg);
    font-weight: 650;
  }
  .days {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    font-size: 14px;
  }
  .days a,
  .days .off {
    padding: 4px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--fg);
    font-weight: 600;
    text-decoration: none;
  }
  .days .off {
    color: var(--muted);
  }
  .days select {
    min-width: 0;
    max-width: 100%;
    padding: 4px 8px;
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    background: var(--bg);
    color: var(--fg);
    font: inherit;
  }
  .numbers {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px 24px;
    padding-top: 2px;
  }
  .numbers > div {
    display: grid;
  }
  .numbers dd {
    order: -1;
    font-size: 28px;
    line-height: 1.15;
    font-weight: 720;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }
  .numbers dt {
    color: var(--muted);
    font-size: 14px;
  }
  .stamp {
    color: var(--muted);
    font-size: 13.5px;
  }
  .since {
    padding: 12px 16px;
    border-radius: var(--r-sm);
    background: var(--info-soft);
    font-size: 15px;
  }

  .tone-ok {
    --tone: var(--ok);
    --tone-soft: var(--ok-soft);
  }
  .tone-accent {
    --tone: var(--accent);
    --tone-soft: var(--accent-soft);
  }
  .tone-warn {
    --tone: var(--warn);
    --tone-soft: var(--warn-soft);
  }
  .tone-bad {
    --tone: var(--bad);
    --tone-soft: var(--bad-soft);
  }
  .tone-info {
    --tone: var(--info);
    --tone-soft: var(--info-soft);
  }
  .tone-none {
    --tone: var(--none);
    --tone-soft: var(--none-soft);
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 1px 9px;
    border-radius: 999px;
    background: var(--tone-soft, var(--none-soft));
    color: var(--tone, var(--muted));
    font-size: 12.5px;
    font-weight: 700;
    line-height: 1.6;
    white-space: nowrap;
  }

  /* At a glance: every change on one line, and the proof in one bar */
  .glance {
    display: grid;
    padding-bottom: 6px;
    border: 1px solid var(--line);
    border-radius: var(--r);
    background: var(--surface);
    box-shadow: var(--shadow);
    scroll-margin-top: 72px;
  }
  .glance-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px 16px;
    padding: 14px 18px 8px;
  }
  .glance-head h2,
  .g-phase {
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 750;
    letter-spacing: 0.07em;
    text-transform: uppercase;
  }
  .g-phase {
    padding: 12px 18px 4px;
  }
  .glance.scoped .g-group + .g-group {
    margin-top: 6px;
    border-top: 1px solid var(--line-strong);
  }
  .g-scope-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 2px 8px;
    padding: 6px 18px 2px 12px;
  }
  .g-scope-title {
    color: var(--fg);
    font-weight: 720;
    text-decoration: none;
  }
  .g-scope-title:hover {
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .view-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 14px;
  }
  .view-hint {
    padding: 0 18px 6px;
    color: var(--muted);
    font-size: 13.5px;
  }
  .audience label[aria-disabled="true"] {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .g-list {
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .g-list a {
    display: grid;
    grid-template-columns: 84px minmax(0, 1fr) auto;
    align-items: baseline;
    gap: 2px 12px;
    padding: 9px 18px;
    border-top: 1px solid var(--line);
    color: var(--fg);
    text-decoration: none;
  }
  .g-group:not(:has(.g-phase)) li:first-child a,
  .g-list li:first-child a {
    border-top-color: transparent;
  }
  .g-list a:hover {
    background: var(--sunk);
  }
  .g-title {
    font-weight: 600;
    line-height: 1.45;
  }
  .g-list a:hover .g-title {
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .g-for {
    color: var(--muted);
    font-size: 13.5px;
    text-align: right;
  }
  .glance.plain .g-list a {
    grid-template-columns: minmax(0, 1fr) auto;
  }
  /* With pictures, each line leads with a thumbnail of its card's first picture */
  .glance.pictured .g-list a {
    grid-template-columns: 104px 84px minmax(0, 1fr) auto;
    align-items: center;
  }
  .glance.pictured.plain .g-list a {
    grid-template-columns: 104px minmax(0, 1fr) auto;
  }
  .g-thumb {
    position: relative;
    display: grid;
    width: 104px;
    height: 66px;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    background: var(--stage);
  }
  .g-thumb > img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
  }
  .g-thumb > img.cropped {
    position: absolute;
    max-width: none;
    height: auto;
    object-fit: fill;
  }
  .g-thumb > img.phone {
    width: 44%;
    justify-self: center;
    border-inline: 1px solid var(--line);
  }
  .g-list a:hover .g-thumb {
    border-color: var(--line-strong);
  }
  .t-more {
    position: absolute;
    right: 4px;
    bottom: 4px;
    padding: 0 5px;
    border-radius: 999px;
    background: var(--scrim);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    line-height: 1.5;
  }
  .t-draw {
    display: flex;
    align-self: center;
    gap: 4px;
    padding: 8px 9px;
  }
  .t-bars,
  .t-diff,
  .t-lanes,
  .t-mock {
    flex-direction: column;
  }
  .t-bars > span {
    width: calc(6% + 94% * var(--p));
    height: 6px;
    border-radius: 2px;
    background: var(--accent);
  }
  .t-draw.t-table {
    display: grid;
    grid-template-columns: repeat(var(--c), minmax(0, 1fr));
    gap: 3px;
  }
  .t-table > span {
    height: 6px;
    border-radius: 2px;
    background: var(--line-strong);
  }
  .t-table > .th {
    background: var(--muted);
  }
  .t-diff > span {
    display: flex;
    gap: 3px;
  }
  .t-diff i {
    flex: 1;
    height: 6px;
    border-radius: 2px;
    background: var(--del);
  }
  .t-diff i.ins {
    background: var(--ins);
  }
  .t-diff i.sw {
    flex: 0 0 18px;
    height: 12px;
    background: var(--c);
    box-shadow: inset 0 0 0 1px var(--line-strong);
  }
  .t-board {
    align-items: stretch;
  }
  .t-board > span {
    display: flex;
    flex: 1;
    flex-direction: column;
    gap: 3px;
    min-height: 46px;
    padding: 3px;
    border-radius: 3px;
    background: var(--tone-soft, var(--none-soft));
  }
  .t-board i,
  .t-mock i {
    height: 5px;
    border-radius: 2px;
    background: var(--tone, var(--muted));
  }
  .t-flow,
  .t-states {
    align-items: center;
    justify-content: center;
    gap: 0;
  }
  .t-flow > span,
  .t-states > span {
    flex: 0 0 13px;
    height: 13px;
    border: 2px solid var(--tone, var(--accent));
    border-radius: 50%;
    background: var(--tone-soft, var(--accent-soft));
  }
  .t-flow > i,
  .t-states > i {
    flex: 1;
    max-width: 14px;
    height: 2px;
    background: var(--line-strong);
  }
  .t-lanes > span {
    position: relative;
    height: 12px;
    border-bottom: 2px solid var(--line-strong);
  }
  .t-lanes i {
    position: absolute;
    bottom: -5px;
    left: var(--x);
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--tone, var(--accent));
  }
  .t-draw.t-mock {
    align-self: stretch;
    width: 46%;
    justify-self: center;
    padding: 6px 5px;
    border-inline: 1px solid var(--line);
    background: #fff;
  }
  .ico {
    display: inline-flex;
    flex: none;
    width: 16px;
    height: 16px;
  }
  .ico svg {
    width: 100%;
    height: 100%;
  }
  .outline .ico {
    color: var(--muted);
  }
  .outline a[aria-current] .ico,
  .outline a:hover .ico {
    color: inherit;
  }
  .h-ico {
    width: 20px;
    height: 20px;
    margin-right: 8px;
    vertical-align: -3px;
    color: var(--accent);
  }
  .t-icon {
    place-items: center;
    border-color: transparent;
    background: var(--tone-soft);
    color: var(--tone);
  }
  .t-icon .ico {
    width: 30px;
    height: 30px;
  }
  .g-list a:hover .t-icon {
    border-color: var(--tone);
  }
  .t-none {
    background: repeating-linear-gradient(135deg, var(--sunk) 0 6px, var(--stage) 6px 12px);
  }
  @media (max-width: 560px) {
    .g-list a {
      grid-template-columns: 76px minmax(0, 1fr);
      padding-inline: 14px;
    }
    .glance.plain .g-list a {
      grid-template-columns: minmax(0, 1fr);
    }
    .g-for {
      grid-column: -2;
      text-align: left;
    }
    .glance.pictured .g-list a,
    .glance.pictured.plain .g-list a {
      grid-template-columns: 84px minmax(0, 1fr);
      align-items: start;
    }
    .glance.pictured .g-list a > :not(.g-thumb) {
      grid-column: 2;
    }
    .glance.pictured .g-thumb {
      grid-row: 1 / span 3;
      width: 84px;
      height: 56px;
    }
    .glance-head,
    .g-phase,
    .view-hint,
    .g-proof {
      padding-inline: 14px;
    }
    .g-scope-head {
      padding-inline: 8px 14px;
    }
    .g-proof {
      grid-template-columns: 76px minmax(0, 1fr) auto;
    }
  }
  .g-proof {
    display: grid;
    grid-template-columns: 84px minmax(0, 1fr) auto;
    align-items: center;
    gap: 12px;
    margin-top: 6px;
    padding: 12px 18px 8px;
    border-top: 1px solid var(--line);
    color: var(--fg);
    font-size: 14px;
    text-decoration: none;
  }
  .g-proof-label {
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 750;
    letter-spacing: 0.07em;
    text-transform: uppercase;
  }
  .g-proof-text {
    font-weight: 650;
    font-variant-numeric: tabular-nums;
  }
  .meter {
    display: flex;
    gap: 2px;
    height: 10px;
    min-width: 72px;
    overflow: hidden;
    border-radius: 999px;
    background: var(--line);
  }
  .meter > span {
    flex: 1 1 0;
    background: var(--tone);
  }
  .audience {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .audience label {
    position: relative;
    padding: 3px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--muted);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .audience label:hover {
    border-color: var(--line-strong);
    color: var(--fg);
  }
  .audience label:has(input:checked) {
    border-color: var(--fg);
    background: var(--fg);
    color: var(--bg);
  }
  .audience label:has(input:focus-visible) {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .audience input,
  .roles input,
  .option input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }
  .filter-note {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 12px;
    padding: 10px 14px;
    border-radius: var(--r-sm);
    background: var(--sunk);
    border: 1px dashed var(--line-strong);
    color: var(--muted);
    font-size: 14.5px;
  }
  .link-btn {
    padding: 0;
    border: 0;
    background: none;
    color: var(--accent);
    font: inherit;
    font-weight: 650;
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
  }

  /* Where the reader is: pills above the content on narrow screens, an outline beside it on wide ones */
  .n {
    color: var(--muted);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .pills {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    display: flex;
    gap: 6px;
    margin-block: -14px;
    padding-block: 10px;
    overflow-x: auto;
    scrollbar-width: none;
    background: var(--bg);
  }
  .pills a {
    flex: none;
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
    padding: 6px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    color: var(--fg);
    font-size: 13.5px;
    font-weight: 600;
    text-decoration: none;
  }
  .pills a:hover {
    border-color: var(--line-strong);
  }
  .pills a[aria-current] {
    border-color: var(--fg);
    background: var(--fg);
    color: var(--bg);
  }
  .pills a[aria-current] .n {
    color: inherit;
    opacity: 0.75;
  }
  @media (min-width: 1120px) {
    .pills {
      display: none;
    }
  }
  .outline {
    display: grid;
    align-content: start;
    gap: 14px;
    padding: 18px 14px 32px;
  }
  .rail-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    padding: 0 8px 4px;
  }
  .outline .rail-home {
    display: grid;
    padding: 0;
    gap: 2px;
    min-width: 0;
    color: var(--fg);
    text-decoration: none;
  }
  .rail-kind {
    color: var(--accent);
    font-size: 11.5px;
    font-weight: 750;
    letter-spacing: 0.07em;
    text-transform: uppercase;
  }
  .rail-title {
    overflow: hidden;
    font-size: 16px;
    font-weight: 720;
    letter-spacing: -0.01em;
    line-height: 1.3;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .rail-close {
    flex: none;
    width: 32px;
    height: 32px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    color: var(--fg);
    font: inherit;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
  }
  .rail-seg {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px;
    margin: 0 4px;
    padding: 3px;
    border-radius: 10px;
    background: var(--stage);
  }
  .rail-seg label {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 30px;
    border-radius: 8px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition:
      background 150ms,
      color 150ms;
  }
  .rail-seg input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }
  .rail-seg label:has(input:checked) {
    background: var(--surface);
    color: var(--fg);
    box-shadow: 0 1px 2px rgb(0 0 0 / 8%);
  }
  .rail-seg label:has(input:disabled) {
    opacity: 0.55;
    cursor: default;
  }
  .rail-seg label:has(input:focus-visible) {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }
  .outline ul {
    display: grid;
    gap: 1px;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .outline a {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 32px;
    padding: 4px 10px;
    border-radius: 8px;
    color: var(--fg);
    font-size: 14px;
    font-weight: 560;
    line-height: 1.35;
    text-decoration: none;
  }
  .outline a > span:not(.ico, .n) {
    flex: 1;
    min-width: 0;
  }
  .outline a:hover {
    background: var(--stage);
  }
  .outline a.within {
    color: var(--accent);
  }
  .outline a[aria-current] {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 680;
  }
  .outline a[aria-current]::before {
    position: absolute;
    inset: 7px auto 7px 0;
    width: 3px;
    border-radius: 2px;
    background: var(--accent);
    content: "";
  }
  .outline .n {
    font-size: 12.5px;
  }
  .outline a:focus-visible,
  .rail-heading:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }
  .outline .rail-tree {
    gap: 6px;
    margin: 6px 0 12px 12px;
  }
  .rail-group > ul {
    gap: 1px;
  }
  .rail-heading {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    min-height: 26px;
    padding: 2px 10px;
    border: 0;
    border-radius: 6px;
    background: none;
    color: var(--muted);
    font: inherit;
    font-size: 11.5px;
    font-weight: 720;
    letter-spacing: 0.07em;
    text-align: left;
    text-transform: uppercase;
    cursor: pointer;
  }
  .rail-heading:hover {
    color: var(--fg);
  }
  .chev {
    display: inline-flex;
    opacity: 0;
    transition:
      transform 150ms,
      opacity 150ms;
  }
  .rail-heading:hover .chev,
  .rail-heading:focus-visible .chev,
  .rail-heading[aria-expanded="false"] .chev {
    opacity: 1;
  }
  .rail-heading[aria-expanded="false"] .chev {
    transform: rotate(-90deg);
  }
  .rail-row {
    display: flex;
    align-items: center;
  }
  .rail-row > a {
    flex: 1;
    min-width: 0;
  }
  .outline .rail-row a {
    font-size: 13.5px;
    font-weight: 520;
  }
  .rail-row {
    position: relative;
  }
  .rail-row.followed a > span:not(.ico, .n)::after {
    margin-left: 6px;
    color: var(--accent);
    font-size: 12px;
    content: "★";
  }

  .rail-toggle {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border: 1px solid var(--fg);
    border-radius: 999px;
    background: var(--fg);
    color: var(--bg);
    font: inherit;
    font-size: 13.5px;
    font-weight: 650;
    cursor: pointer;
  }

  /* Sections */
  .sec {
    display: grid;
    gap: 18px;
    min-width: 0;
    scroll-margin-top: 72px;
  }
  .sec-head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 12px;
  }
  .sec-head h2 {
    font-size: 25px;
    line-height: 1.2;
    font-weight: 750;
    letter-spacing: -0.015em;
  }
  .count {
    color: var(--muted);
    font-size: 14.5px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .sec-body {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 16px;
    min-width: 0;
  }
  .phase-group {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 14px;
    min-width: 0;
    scroll-margin-top: 72px;
  }
  .phase-group + .phase-group {
    margin-top: 14px;
  }
  .phase {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 10px;
    font-size: 18px;
    font-weight: 720;
  }

  /* A filtered-out card, product or group: an author display rule never wins over hidden */
  .card[hidden],
  .fu[hidden],
  .g-group[hidden],
  .g-scope[hidden],
  .g-list li[hidden],
  .phase-group[hidden],
  .scope-band[hidden],
  .scope-group[hidden],
  .rail-group[hidden],
  .filter-note[hidden],
  .rail-row[hidden],
  .outline li[hidden] {
    display: none;
  }

  /* Scopes: What changed grouped as the manual groups its pages, a band per group and a heading per product */
  .scope-band {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 16px;
    min-width: 0;
    scroll-margin-top: 72px;
  }
  .scope-band + .scope-band {
    margin-top: 26px;
  }
  .scope-title {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 10px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--line-strong);
    font-size: 20px;
    font-weight: 750;
    letter-spacing: -0.01em;
  }
  .scope-group {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 12px;
    min-width: 0;
    scroll-margin-top: 72px;
  }
  .scope-group + .scope-group {
    margin-top: 10px;
  }
  .scope-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 10px;
  }
  .scope-head h4 {
    font-size: 17px;
    font-weight: 720;
  }
  .scope-link {
    color: var(--accent);
    font-size: 13.5px;
    font-weight: 620;
    text-decoration: none;
    white-space: nowrap;
  }
  .scope-link:hover {
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .scope-head .scope-link {
    margin-left: auto;
  }
  .g-phase .count {
    margin-left: 8px;
    font-size: 12.5px;
    letter-spacing: 0;
    text-transform: none;
  }
  .g-scope-head .count {
    font-size: 13.5px;
  }
  .star {
    display: inline-grid;
    place-items: center;
    width: 30px;
    height: 30px;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 8px;
    background: none;
    color: var(--muted);
    font: inherit;
    font-size: 17px;
    line-height: 1;
    cursor: pointer;
  }
  .star:hover {
    border-color: var(--line);
    background: var(--sunk);
    color: var(--fg);
  }
  .star[aria-pressed="true"] {
    color: var(--accent);
  }
  .star:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .rail-row .star {
    position: absolute;
    top: 50%;
    right: 3px;
    width: 26px;
    height: 26px;
    font-size: 14px;
    opacity: 0;
    transform: translateY(-50%);
  }
  .rail-row:hover .star,
  .rail-row .star:focus-visible {
    opacity: 1;
  }
  .rail-row:hover .n,
  .rail-row:has(.star:focus-visible) .n {
    visibility: hidden;
  }
  .c-phase {
    padding: 0 8px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 650;
    line-height: 1.6;
    white-space: nowrap;
  }
  .fu-scope {
    color: var(--accent);
    font-weight: 650;
  }

  .card {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 14px;
    min-width: 0;
    padding: 18px;
    border: 1px solid var(--line);
    border-radius: var(--r);
    background: var(--surface);
    box-shadow: var(--shadow);
    scroll-margin-top: 72px;
  }
  @media (min-width: 720px) {
    .card {
      gap: 16px;
      padding: 22px 24px;
    }
  }
  .card:target {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  /* A change: its kind and readers, its title, Before and Now, its pictures, its proof */
  .c-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 10px;
  }
  .c-for {
    color: var(--muted);
    font-size: 14px;
  }
  .change {
    position: relative;
  }
  .change .c-head {
    padding-right: 22px;
  }
  .anchor {
    position: absolute;
    top: 14px;
    right: 14px;
    padding: 0 4px;
    color: var(--muted);
    font-weight: 650;
    text-decoration: none;
    opacity: 0;
  }
  .card:hover .anchor,
  .anchor:focus-visible {
    opacity: 1;
  }
  .c-title {
    font-size: 19px;
    line-height: 1.35;
    font-weight: 720;
    text-wrap: pretty;
  }
  .slip {
    display: grid;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
  }
  .slip > div {
    display: grid;
    grid-template-columns: 64px minmax(0, 1fr);
    gap: 12px;
    padding: 11px 14px;
  }
  .slip > div + div {
    border-top: 1px solid var(--line);
  }
  .slip dt {
    padding-top: 3px;
    font-size: 11.5px;
    font-weight: 780;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .slip-before {
    background: var(--sunk);
    color: var(--muted);
  }
  .slip-now {
    background: var(--accent-soft);
  }
  .slip-now dt {
    color: var(--accent);
  }
  @media (max-width: 480px) {
    .slip > div {
      grid-template-columns: minmax(0, 1fr);
      gap: 0;
    }
  }
  .c-links {
    display: flex;
    flex-wrap: wrap;
    gap: 2px 16px;
    color: var(--muted);
    font-size: 14px;
  }
  .c-links a {
    font-weight: 600;
  }
  .c-links a::after {
    content: " \2197";
    font-size: 0.85em;
  }
  .c-proof {
    display: grid;
    gap: 2px;
    margin: 0;
    padding: 10px 0 0;
    border-top: 1px solid var(--line);
    list-style: none;
  }
  .c-proof a {
    display: grid;
    grid-template-columns: 22px minmax(0, 1fr);
    gap: 0 8px;
    padding: 3px 0;
    color: var(--fg);
    font-size: 14px;
    line-height: 1.45;
    text-decoration: none;
  }
  .c-proof a:hover .p-claim {
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .p-icon {
    display: grid;
    place-items: center;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--tone-soft);
    color: var(--tone);
    font-size: 12px;
    font-weight: 800;
  }
  .p-partial,
  .p-not-run {
    font-size: 15px;
    line-height: 1;
  }
  .p-how {
    grid-column: 2;
    color: var(--muted);
    font-size: 13px;
  }

  /* Pictures: screens and diagrams sit on a stage; tables, diffs and charts sit on the card */
  .pics {
    display: grid;
    gap: 12px;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr));
    min-width: 0;
  }
  .pics > .wide {
    grid-column: 1 / -1;
  }
  .pic {
    container-type: inline-size;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 8px;
    align-content: start;
    min-width: 0;
  }
  .pic.staged {
    padding: 14px;
    border-radius: var(--r-sm);
    background: var(--stage);
  }
  .pic figcaption {
    color: var(--muted);
    font-size: 13.5px;
  }
  .pic.added {
    outline: 2px dashed var(--accent);
    outline-offset: 4px;
  }
  .captured {
    color: var(--muted);
    font-size: 12.5px;
    font-style: italic;
  }
  .key {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
    color: var(--muted);
    font-size: 13.5px;
  }
  .k-draft {
    text-decoration: underline dotted var(--accent) 2px;
    text-underline-offset: 3px;
  }
  .k-added {
    padding: 0 4px;
    border-radius: 3px;
    outline: 2px dashed var(--accent);
    outline-offset: 1px;
  }

  .shot {
    display: block;
    width: 100%;
    max-width: 100%;
    aspect-ratio: 16 / 10;
    padding: 0;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    background: var(--surface);
    cursor: zoom-in;
  }
  .shot img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
  }
  .shot.phone img {
    object-fit: contain;
  }
  .bn {
    --x: 50%;
    position: relative;
    max-width: 100%;
    aspect-ratio: 16 / 10;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    background: var(--surface);
  }
  .bn img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
  }
  .bn .bn-before {
    clip-path: inset(0 calc(100% - var(--x)) 0 0);
  }
  .bn::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: var(--x);
    width: 2px;
    margin-left: -1px;
    background: var(--accent);
  }
  .bn-tag {
    position: absolute;
    top: 8px;
    z-index: 1;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--scrim);
    color: var(--on-scrim);
    font-size: 11.5px;
    font-weight: 700;
  }
  .bn-tag-before {
    left: 8px;
  }
  .bn-tag-now {
    right: 8px;
  }
  .slider {
    width: 100%;
    margin: 0;
    accent-color: var(--accent);
  }

  .mock {
    justify-self: center;
    width: 100%;
    max-width: 100%;
    overflow: hidden;
    border: 1px solid var(--line-strong);
    border-radius: 12px;
    background: var(--g-bg);
    color: var(--g-fg);
    font: 13px/1.45 var(--g-font);
  }
  .mock-phone {
    max-width: 290px;
    border: 6px solid var(--g-bezel);
    border-radius: 24px;
  }
  .mock-status,
  .mock-bar,
  .mock-mailhead {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    background: var(--g-subtle);
    border-bottom: 1px solid var(--g-line);
    font-size: 11.5px;
  }
  .mock-status {
    justify-content: space-between;
    font-weight: 650;
  }
  .mock-title {
    min-width: 0;
    text-align: right;
    font-weight: 700;
  }
  .dots {
    flex: none;
    width: 34px;
    height: 8px;
    background: radial-gradient(circle at 4px 4px, var(--g-line) 3.5px, transparent 4px) 0 0 / 13px 8px repeat-x;
  }
  .mock-url {
    flex: 1;
    min-width: 0;
    padding: 2px 10px;
    border: 1px solid var(--g-line);
    border-radius: 999px;
    background: var(--g-bg);
    color: var(--g-muted);
    overflow-wrap: anywhere;
  }
  .mock-mailhead {
    display: grid;
    gap: 2px;
    font-size: 12px;
  }
  .mock-mailhead b {
    color: var(--g-muted);
    font-weight: 600;
  }
  .mock-body {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 10px;
    align-content: start;
    padding: 14px;
  }
  .m-h {
    font-size: 16px;
    font-weight: 700;
  }
  .m-muted {
    color: var(--g-muted);
  }
  .m-row,
  .m-switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .m-row {
    padding-bottom: 8px;
    border-bottom: 1px solid var(--g-line);
  }
  .m-val {
    font-weight: 700;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .m-btn {
    justify-self: start;
    padding: 8px 16px;
    border: 1px solid var(--g-line);
    border-radius: 8px;
    background: var(--g-bg);
    font-weight: 650;
  }
  .m-primary {
    justify-self: stretch;
    text-align: center;
    border-color: var(--g-primary);
    background: var(--g-primary);
    color: var(--g-on-primary);
  }
  .m-toggle {
    position: relative;
    flex: none;
    width: 34px;
    height: 20px;
    border-radius: 999px;
    background: var(--g-line);
  }
  .m-toggle::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--g-bg);
    box-shadow: 0 1px 2px rgb(0 0 0 / 25%);
  }
  .m-toggle.on {
    background: var(--g-primary);
  }
  .m-toggle.on::after {
    left: 16px;
  }
  .m-field {
    display: grid;
    gap: 4px;
  }
  .m-field-label {
    color: var(--g-muted);
    font-size: 12px;
    font-weight: 600;
  }
  .m-input {
    min-height: 36px;
    padding: 8px 10px;
    border: 1px solid var(--g-line);
    border-radius: 8px;
  }
  .m-notice {
    padding: 8px 10px;
    border-radius: 8px;
    font-weight: 600;
    background: var(--g-info);
    color: var(--g-on-info);
  }
  .m-notice.tone-warn {
    background: var(--g-warn);
    color: var(--g-on-warn);
  }
  .m-notice.tone-ok {
    background: var(--g-ok);
    color: var(--g-on-ok);
  }
  .m-notice.tone-bad {
    background: var(--g-bad);
    color: var(--g-on-bad);
  }
  .m-tip {
    justify-self: start;
    max-width: 100%;
    padding: 6px 10px;
    border-radius: 6px;
    background: var(--g-fg);
    color: var(--g-bg);
    font-size: 12px;
  }
  .m-badge {
    justify-self: start;
    padding: 1px 9px;
    border-radius: 999px;
    border: 1px solid var(--g-line);
    background: var(--g-subtle);
    font-size: 11.5px;
    font-weight: 700;
  }
  .m-badge.tone-accent {
    border-color: var(--g-primary);
    background: var(--g-accent);
    color: var(--g-on-accent);
  }
  .m-divider {
    width: 100%;
    margin: 2px 0;
    border: 0;
    border-top: 1px solid var(--g-line);
  }
  .draft {
    text-decoration: underline dotted var(--g-primary) 2px;
    text-underline-offset: 3px;
  }
  .added {
    outline: 2px dashed var(--g-primary);
    outline-offset: 3px;
    border-radius: 6px;
  }
  .mock-push {
    display: grid;
    padding: 16px 14px;
    border: 0;
    border-radius: 20px;
    background: var(--g-lock);
  }
  .push {
    display: grid;
    gap: 2px;
    padding: 10px 12px;
    border-radius: 14px;
    background: var(--g-subtle);
    color: var(--g-fg);
  }
  .push-head {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    color: var(--g-muted);
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .flow {
    display: flex;
    align-items: stretch;
    gap: 6px;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .flow-step {
    flex: 1 1 0;
    min-width: 0;
    display: grid;
    gap: 2px;
    align-content: start;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    background: var(--surface);
    font-size: 14px;
  }
  .flow-step[class*="tone-"] {
    border-color: var(--tone);
    background: var(--tone-soft);
  }
  .flow-who {
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 750;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .flow-arrow {
    flex: 0 1 auto;
    display: grid;
    place-content: center;
    justify-items: center;
    max-width: 96px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.25;
    text-align: center;
  }
  .flow-arrow::after {
    content: "\2192";
    font-size: 18px;
    line-height: 1;
    color: var(--accent);
  }
  @container (max-width: 600px) {
    .flow {
      flex-direction: column;
    }
    .flow-arrow {
      max-width: none;
      grid-auto-flow: column;
      justify-content: start;
      gap: 8px;
      padding-left: 18px;
    }
    .flow-arrow::after {
      content: "\2193";
      grid-row: 1;
    }
  }
  @container (max-width: 760px) {
    .flow.long {
      flex-direction: column;
    }
    .flow.long .flow-arrow {
      max-width: none;
      grid-auto-flow: column;
      justify-content: start;
      gap: 8px;
      padding-left: 18px;
    }
    .flow.long .flow-arrow::after {
      content: "\2193";
      grid-row: 1;
    }
  }

  .scroll-x {
    max-width: 100%;
    overflow-x: auto;
  }
  .lanes {
    display: grid;
    grid-template-columns: 44px repeat(var(--n), minmax(84px, 1fr));
    min-width: calc(44px + var(--n) * 84px);
    row-gap: 4px;
    font-size: 12.5px;
    line-height: 1.35;
  }
  .lane-head {
    grid-row: 1;
    padding: 4px 4px 8px;
    border-bottom: 2px solid var(--line-strong);
    font-size: 12.5px;
    font-weight: 750;
    text-align: center;
  }
  .lane-at {
    grid-column: 1;
    padding-top: 7px;
    color: var(--muted);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .lane-cell {
    background: linear-gradient(var(--line-strong), var(--line-strong)) center / 2px 100% no-repeat;
  }
  .lane-ev {
    position: relative;
    z-index: 1;
    margin: 2px 3px;
    padding: 5px 6px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
    text-align: center;
  }
  .lane-ev[class*="tone-"] {
    border-color: var(--tone);
    background: var(--tone-soft);
  }
  .lane-ev.msg {
    border-color: transparent;
    background: transparent;
    padding-bottom: 16px;
  }
  .lane-ev.msg::after {
    content: "";
    position: absolute;
    bottom: 7px;
    left: calc(50% / var(--span));
    right: calc(50% / var(--span));
    border-top: 2px solid var(--accent);
  }
  .lane-ev.msg::before {
    content: "";
    position: absolute;
    bottom: 3px;
    border-block: 5px solid transparent;
  }
  .lane-ev.to-right::before {
    right: calc(50% / var(--span) - 2px);
    border-left: 8px solid var(--accent);
  }
  .lane-ev.to-left::before {
    left: calc(50% / var(--span) - 2px);
    border-right: 8px solid var(--accent);
  }

  .lanes-list {
    display: none;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .lanes-list li {
    display: grid;
    grid-template-columns: 46px minmax(0, 1fr);
    gap: 1px 10px;
    padding-block: 8px;
    border-top: 1px solid var(--line-strong);
    font-size: 14px;
    line-height: 1.4;
  }
  .lanes-list li:first-child {
    padding-top: 0;
    border-top: 0;
  }
  .ll-at {
    grid-row: span 2;
    padding-top: 1px;
    color: var(--muted);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  .ll-who {
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 750;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .lanes-list li[class*="tone-"] .ll-text {
    justify-self: start;
    padding: 1px 8px;
    border-radius: 6px;
    background: var(--tone-soft);
  }
  @container (max-width: 480px) {
    .lanes-wide {
      display: none;
    }
    .lanes-list {
      display: grid;
    }
  }

  .chain {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .chain-state {
    padding: 4px 12px;
    border: 1.5px solid var(--line-strong);
    border-radius: 999px;
    background: var(--surface);
    font-size: 13.5px;
    font-weight: 650;
  }
  .chain-arrow {
    color: var(--accent);
  }
  .tbl {
    width: 100%;
    border-collapse: collapse;
    font-size: 14.5px;
  }
  .tbl th,
  .tbl td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
  }
  .tbl thead th {
    border-bottom: 2px solid var(--line-strong);
    color: var(--muted);
    font-size: 12px;
    font-weight: 750;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .tbl tbody th {
    font-weight: 650;
  }
  .tbl code {
    overflow-wrap: break-word;
  }
  .tbl tbody tr:last-child > * {
    border-bottom: 0;
  }

  .bars {
    display: grid;
    gap: 8px;
  }
  .bar-row {
    display: grid;
    grid-template-columns: minmax(90px, 32%) minmax(0, 1fr);
    align-items: center;
    gap: 12px;
    font-size: 14px;
  }
  .bar-plot {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .bar-fill {
    flex: none;
    width: calc((100% - 6.5em) * var(--p));
    min-width: 3px;
    height: 14px;
    border-radius: 0 4px 4px 0;
    background: var(--accent);
  }
  .bar-val {
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .diff {
    display: grid;
    gap: 12px;
  }
  .d-row {
    display: grid;
    gap: 3px;
    min-width: 0;
  }
  .d-name {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 8px;
    font-size: 14px;
    font-weight: 650;
  }
  .d-line {
    display: grid;
    grid-template-columns: 50px minmax(0, 1fr);
    gap: 10px;
    padding: 6px 10px;
    border-radius: 7px;
    font-size: 15px;
    line-height: 1.5;
  }
  @container (min-width: 560px) {
    .d-row {
      grid-template-columns: minmax(0, 30%) minmax(0, 1fr);
      column-gap: 14px;
    }
    .d-name {
      grid-row: span 2;
      align-content: start;
      padding-top: 6px;
    }
  }
  .d-old {
    background: var(--bad-soft);
  }
  .d-new {
    background: var(--ok-soft);
  }
  .d-tag {
    padding-top: 3px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 780;
    letter-spacing: 0.07em;
    text-transform: uppercase;
  }
  .d-old del {
    border-radius: 3px;
    background: var(--del);
    text-decoration: line-through;
    text-decoration-color: color-mix(in srgb, var(--bad) 70%, transparent);
  }
  .d-new ins {
    border-radius: 3px;
    background: var(--ins);
    text-decoration: none;
  }
  .swatch {
    display: inline-block;
    width: 15px;
    height: 15px;
    margin-right: 7px;
    vertical-align: -2px;
    border: 1px solid var(--line-strong);
    border-radius: 4px;
    background: var(--c);
  }

  .board {
    display: grid;
    gap: 12px;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 168px), 1fr));
  }
  .b-col {
    display: grid;
    gap: 8px;
    align-content: start;
    min-width: 0;
  }
  .b-head {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 750;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .b-head::before {
    content: "";
    flex: none;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--tone, var(--line-strong));
  }
  .b-n {
    margin-left: auto;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .b-items {
    display: grid;
    gap: 6px;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .b-items li {
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    font-size: 13.5px;
    line-height: 1.4;
    overflow-wrap: anywhere;
  }
  /* The item is the box already; a chip inside it would break across lines. */
  .b-items code {
    padding: 0;
    border: 0;
    background: none;
  }
  .b-empty {
    padding: 4px 2px;
    color: var(--muted);
    font-size: 13px;
    font-style: italic;
  }

  /* Decide: one card per question or blocker, answered on the page */
  .ask-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 10px;
  }
  .num {
    flex: none;
    display: grid;
    place-items: center;
    min-width: 26px;
    height: 26px;
    padding-inline: 6px;
    border-radius: 999px;
    background: var(--fg);
    color: var(--surface);
    font-size: 13px;
    font-weight: 750;
    font-variant-numeric: tabular-nums;
  }
  .num.tone-bad {
    background: var(--bad);
  }
  .ask-kind {
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 750;
    letter-spacing: 0.07em;
    text-transform: uppercase;
  }
  .state {
    margin-left: auto;
    color: var(--muted);
    font-size: 13.5px;
    font-weight: 600;
  }
  .state.is-set {
    color: var(--ok);
  }
  .ask-title {
    font-size: 19px;
    line-height: 1.35;
    font-weight: 720;
  }
  .ask-text {
    font-size: 17px;
    line-height: 1.5;
  }
  .why {
    color: var(--muted);
    font-size: 15px;
  }
  .why strong {
    color: var(--fg);
    font-weight: 650;
  }
  .card.closed {
    gap: 8px;
    background: var(--sunk);
    box-shadow: none;
  }
  .options {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr));
    gap: 12px;
    min-width: 0;
    margin: 0;
    padding: 0;
    border: 0;
  }
  .option {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 10px;
    align-content: start;
    min-width: 0;
    padding: 14px;
    border: 1.5px solid var(--line);
    border-radius: var(--r);
    background: var(--sunk);
    cursor: pointer;
  }
  .option.is-rec {
    border-color: var(--accent-line);
  }
  .option:hover {
    border-color: var(--line-strong);
  }
  .option:has(input:checked) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .option:has(input:focus-visible) {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .opt-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 8px;
    cursor: pointer;
  }
  .radio {
    flex: none;
    width: 18px;
    height: 18px;
    border: 2px solid var(--line-strong);
    border-radius: 50%;
    background: var(--surface);
  }
  .option:has(input:checked) .radio {
    border-color: var(--accent);
    background: var(--accent);
    box-shadow: inset 0 0 0 3px var(--surface);
  }
  .opt-key {
    font-weight: 800;
  }
  .opt-label {
    flex: 1 1 0;
    min-width: min(100%, 120px);
    font-weight: 650;
  }
  .rec {
    padding: 1px 8px;
    border-radius: 999px;
    background: var(--ok-soft);
    color: var(--ok);
    font-size: 11.5px;
    font-weight: 750;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .opt-text,
  .opt-cost {
    font-size: 14.5px;
  }
  .opt-cost {
    color: var(--muted);
  }
  .opt-cost strong {
    color: var(--fg);
    font-weight: 650;
  }
  .meta {
    display: grid;
    gap: 6px;
    font-size: 14.5px;
  }
  .meta > div {
    display: grid;
    grid-template-columns: 124px minmax(0, 1fr);
    gap: 12px;
  }
  .meta dt {
    color: var(--muted);
    font-weight: 600;
  }
  .reasons {
    display: grid;
    gap: 2px;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  @media (max-width: 560px) {
    .meta > div {
      grid-template-columns: minmax(0, 1fr);
      gap: 0;
    }
  }
  .answer {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 12px;
    padding-top: 12px;
    border-top: 1px dashed var(--line);
  }
  .note {
    flex: 1 1 220px;
    min-width: 0;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    background: var(--surface);
    color: var(--fg);
    font: inherit;
    font-size: 14.5px;
  }
  .done {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 650;
    cursor: pointer;
  }
  .done input,
  .fu input {
    width: 18px;
    height: 18px;
    margin: 0;
    accent-color: var(--accent);
  }
  .agent {
    display: grid;
    gap: 10px;
    padding: 16px 18px;
    border: 1px solid var(--line);
    border-radius: var(--r);
    background: var(--sunk);
  }
  .agent h3 {
    font-size: 16px;
    font-weight: 700;
  }
  .agent ul {
    display: grid;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .agent li {
    padding-block: 9px;
    border-top: 1px solid var(--line);
  }
  .agent li:first-child {
    padding-top: 0;
    border-top: 0;
  }
  .agent .why {
    display: block;
    font-size: 14px;
  }
  .hint {
    color: var(--muted);
    font-size: 14px;
  }
  .answers {
    z-index: 4;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 12px;
    padding: 12px 16px;
    border: 1px solid var(--line-strong);
    border-radius: var(--r);
    background: var(--surface);
  }
  .answers.live {
    position: sticky;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    border-color: var(--accent);
    box-shadow: var(--lift);
  }
  .answers .line {
    flex: 1 1 180px;
    min-width: 0;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
  }
  .answers .status,
  .answers .msg {
    flex-basis: 100%;
    color: var(--muted);
    font-size: 12.5px;
  }
  .answers .msg:empty {
    display: none;
  }
  .btn {
    padding: 8px 16px;
    border: 0;
    border-radius: 999px;
    background: var(--fg);
    color: var(--bg);
    font: inherit;
    font-size: 14px;
    font-weight: 650;
    cursor: pointer;
  }
  .copy-out {
    flex-basis: 100%;
    min-width: 0;
    padding: 8px;
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    background: var(--sunk);
    color: var(--fg);
    font: 13px/1.4 var(--mono);
  }

  /* Try it: a path per person, in bands of time */
  .where {
    font-size: 15.5px;
  }
  .roles {
    justify-self: start;
    display: inline-flex;
    flex-wrap: wrap;
    gap: 2px;
    padding: 3px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--sunk);
  }
  .roles label {
    position: relative;
    padding: 6px 14px;
    border-radius: 999px;
    color: var(--muted);
    font-size: 14px;
    font-weight: 650;
    cursor: pointer;
  }
  .roles label:has(input:checked) {
    background: var(--surface);
    color: var(--fg);
    box-shadow: 0 1px 3px rgb(0 0 0 / 12%);
  }
  .roles label:has(input:focus-visible) {
    outline: 2px solid var(--accent);
  }
  .path {
    display: grid;
    gap: 18px;
  }
  .band {
    display: grid;
    gap: 12px;
  }
  .band h3 {
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 750;

    gap: 4px 14px;
    padding-bottom: 20px;

  .step::before {
    content: "";
    position: absolute;
    top: 34px;
    bottom: 2px;
    left: 15px;
    width: 2px;

    display: none;

    display: grid;
    place-items: center;
    width: 32px;

    color: var(--accent);

  .step-body {
    display: grid;

    gap: 6px;

    padding-top: 3px;

  .step-title {
    font-size: 16.5px;
    font-weight: 700;
  }
  .step-where {
    color: var(--muted);
    font-size: 14px;
  }

    border-radius: var(--r-sm);
    background: var(--ok-soft);

    font-weight: 650;

    background: var(--surface);

    padding: 12px 16px;
    border-top: 1px solid var(--line);

    // A story often draws a small block on a wide canvas: zoom the thumbnail to what differs from the canvas colour.
    function crop(img) {
      const box = img.parentElement;
      const w = 160;
      const ht = Math.max(1, Math.round((w * img.naturalHeight) / img.naturalWidth));
      const cv = document.createElement("canvas");
      cv.width = w;
      cv.height = ht;
      let px;
      try {
        const cx = cv.getContext("2d", { willReadFrequently: true });
        cx.drawImage(img, 0, 0, w, ht);
        px = cx.getImageData(0, 0, w, ht).data;
      } catch {
        return;
      }
      const at = (i) => [px[i], px[i + 1], px[i + 2]];
      const bg = at(0);
      let [x0, y0, x1, y1] = [w, ht, -1, -1];
      for (let y = 0; y < ht; y++) {
        for (let x = 0; x < w; x++) {
          const c = at((y * w + x) * 4);
          if (Math.abs(c[0] - bg[0]) + Math.abs(c[1] - bg[1]) + Math.abs(c[2] - bg[2]) > 24) {
            if (x < x0) x0 = x;
            if (x > x1) x1 = x;
            if (y < y0) y0 = y;
            if (y > y1) y1 = y;
          }
        }
      }
      if (x1 < 0) return;
      const pad = 4;
      const aspect = box.clientWidth / box.clientHeight;
      let cw = Math.min(w, x1 - x0 + 1 + 2 * pad);
      let ch = Math.min(ht, y1 - y0 + 1 + 2 * pad);
      if (cw / ch > aspect) ch = Math.min(ht, cw / aspect);
      else cw = Math.min(w, ch * aspect);
      if (cw > w * 0.8) return;
      const left = Math.max(0, Math.min(w - cw, (x0 + x1) / 2 - cw / 2));
      const top = Math.max(0, Math.min(ht - ch, y0 - pad));
      // In percent of the box, so the crop holds when the box resizes at the phone breakpoint.
      img.classList.add("cropped");
      img.style.width = `${(100 * w) / cw}%`;
      img.style.left = `${(-100 * left) / cw}%`;
      img.style.top = `${(-100 * top * aspect) / cw}%`;
    }

    // [group, [[scope, cards]]] in the manual's order; the cards no scope claims close the list as one group.
    // A manual icon, as the manual's nav draws it: the duotone back at a fifth, the line over it.
    function icon(name, cls) {

    function scopeTree(items) {
      const tree = [];
      for (const g of [...new Set(SCOPES.map((sc) => sc.group))]) {

          .map((sc) => [sc, items.filter((c) => c.scope === sc.id)])
          .filter(([, cards]) => cards.length);

      const rest = items.filter((c) => !SCOPE.has(c.scope));

    function meter() {

        { class: "meter", role: "img", "aria-label": parts.map(([n, word]) => `${n} ${word.toLowerCase()}`).join(", ") },
        parts.map(([n, , tone]) => h("span", { class: `tone-${tone}`, style: `flex-grow:${n}` })),
      );
    }

    function audience() {
      return h(
        "div",
        { class: "audience", role: "radiogroup", "aria-label": "Show the changes for" },
        ["", ...AUDIENCES].map((a, i) =>
          h("label", {}, h("input", { type: "radio", name: "audience", id: `for-${i}`, value: a, onchange: () => showFor(a) }), a || "Everyone"),
        ),
      );
    }

    function viewBar() {
      if (!FILTER && !SCOPED) return null;
      return h(
        "div",
        { class: "view-bar" },
        FILTER ? audience() : null,
        SCOPED
          ? h(
              "div",

              h("label", { id: "areas-mine" }, h("input", { type: "radio", name: "areas", value: "mine", onchange: () => showOnly(true) }), "Following", h("span", { class: "n", id: "follow-n" })),
            )
          : null,

    }

    function showFor(who) {
      view.who = AUDIENCES.includes(who) ? who : "";
      writeLocal("handoff-for", view.who);
      applyView();
    }

    function showOnly(on) {
      view.only = on && view.follow.size > 0;
      view.linked = [];
      writeLocal(`${FOLLOW}-only`, view.only ? "1" : "");
      applyView();
    }

    function toggleFollow(id) {
      if (view.follow.has(id)) view.follow.delete(id);
      else view.follow.add(id);
      if (!view.follow.size) view.only = false;
      writeLocal(FOLLOW, JSON.stringify([...view.follow]));
      applyView();
    }

    function showAll() {
      view.who = "";
      view.only = false;
      view.linked = [];
      writeLocal("handoff-for", "");
      writeLocal(`${FOLLOW}-only`, "");
      applyView();
    }

    // The reader's view: a role from the audience pills, the starred products, and ?scope= on a shared link, which wins for that visit.
    function loadView() {
      const params = (() => {
        try {
          return new URLSearchParams(location.search);
        } catch {
          return new URLSearchParams();
        }
      })();
      const who = params.get("for") ?? readLocal("handoff-for") ?? "";
      view.who = AUDIENCES.includes(who) ? who : "";
      try {
        for (const id of JSON.parse(readLocal(FOLLOW) ?? "[]")) if (typeof id === "string") view.follow.add(id);
      } catch {}
      view.only = readLocal(`${FOLLOW}-only`) === "1" && view.follow.size > 0;
      view.linked = params
        .getAll("scope")
        .flatMap((v) => v.split(","))
        .filter((id) => SCOPE.has(id));
    }

    function applyView() {
      const only = view.linked.length ? new Set(view.linked) : view.only ? view.follow : null;
      const a = view.who;
      for (const r of document.querySelectorAll('input[name="audience"]')) r.checked = r.value === a;
      for (const r of document.querySelectorAll('input[name="areas"]')) {
        r.checked = (r.value === "mine") === (view.only && !view.linked.length);
        if (r.value === "mine") {
          r.disabled = !view.follow.size;
          r.parentElement.setAttribute("aria-disabled", String(!view.follow.size));
        }
      }
      for (const r of document.querySelectorAll('input[name="rail-areas"]')) {
        r.checked = (r.value === "mine") === (view.only && !view.linked.length);
        if (r.value === "mine") {
          r.disabled = !view.follow.size;
          r.parentElement.title = view.follow.size ? "" : "Star ☆ a product to follow it";
        }
      }
      const railN = document.getElementById("rail-follow-n");
      if (railN) railN.textContent = view.follow.size ? String(view.follow.size) : "";
      for (const b of document.querySelectorAll("[data-star]")) {
        const on = view.follow.has(b.dataset.star);
        b.closest(".rail-row")?.classList.toggle("followed", on);
        b.setAttribute("aria-pressed", String(on));
        b.textContent = on ? "★" : "☆";
      }
      const count = document.getElementById("follow-n");
      if (count) count.textContent = view.follow.size ? ` ${view.follow.size}` : "";
      const hint = document.getElementById("view-hint");
      if (hint) hint.hidden = view.follow.size > 0;
      for (const el of document.querySelectorAll("[data-for]")) {
        const off = (!!a && !!el.dataset.for && !el.dataset.for.split("|").includes(a)) || (!!only && !!el.dataset.scope && !only.has(el.dataset.scope));
        el.hidden = off;
      }
      for (const box of document.querySelectorAll("[data-box], [data-group]")) box.hidden = ![...box.querySelectorAll("[data-for]")].some((el) => !el.hidden);
      for (const n of document.querySelectorAll(".rail [data-count]")) n.textContent = n.closest("li").querySelectorAll("i[data-for]:not([hidden])").length;
      for (const n of document.querySelectorAll("[data-tally]")) n.textContent = plural(n.parentElement.parentElement.querySelectorAll("li[data-for]:not([hidden])").length, "change");
      for (const link of document.querySelectorAll(".rail-secs [data-spy]")) {
        const target = document.getElementById(link.dataset.spy);
        if (target?.matches(".scope-band, .scope-group, .phase-group")) link.parentElement.hidden = target.hidden;
      }
      const note = document.getElementById("filter-note");
      if (note) {
        const shown = CH.filter((c) => !document.getElementById(c.id)?.hidden).length;
        const parts = [
          a ? `for ${a}` : null,
          view.linked.length ? `in ${plural(view.linked.length, "product")} from the link` : only ? `in the ${plural(only.size, "product")} you follow` : null,
        ].filter(Boolean);
        note.hidden = !parts.length;
        note.firstChild.textContent = `Showing ${shown} of ${CH.length} changes, ${parts.join(" and ")}.`;
      }
      spy();
    }

    function decideSection() {
      if (!QUESTIONS.length && !BLOCKERS.length && !AD.length) return null;
      const closed = QUESTIONS.length + BLOCKERS.length - Q.length - B.length;
      const counts = [Q.length ? plural(Q.length, "question") : null, B.length ? plural(B.length, "blocker") : null, closed ? `${closed} answered` : null]
        .filter(Boolean)
        .join(" · ");
      const sec = section("decide", "Decide", counts);
      for (const q of QUESTIONS) sec.body.append(q.answered ? closedCard(q, q.answered, `q${q.n}`) : questionCard(q));
      for (const b of BLOCKERS) sec.body.append(b.done ? closedCard(b, b.done, `b${b.n}`) : blockerCard(b));
      if (AD.length) sec.body.append(agentCard());
      if (drafted(Q)) sec.body.append(key());
      if (Q.length || B.length) sec.body.append(answerBar());
      return sec;
    }

    function blockerCard(b) {

    function closedCard(item, s, id) {

    function changedSection() {
      if (!CH.length) return null;
      const sec = section("changed", DECISION ? "What is settled" : "What changed", kinds(CH));
      if (FILTER || SCOPED) sec.body.append(h("p", { class: "filter-note", id: "filter-note", hidden: true }, h("span", {}), h("button", { type: "button", class: "link-btn", onclick: showAll }, "Show every change")));
      if (SCOPED) {
        for (const [g, scopes] of scopeTree(CH)) {
          const all = scopes.flatMap(([, cards]) => cards);
          sec.body.append(
            h(
              "div",
              { class: "scope-band", id: groupId(g), "data-group": g },
              h("h3", { class: "scope-title" }, g, h("span", { class: "count" }, kinds(all) || plural(all.length, "change"))),
              scopes.map(([sc, cards]) =>
                h(
                  "div",
                  { class: "scope-group", id: sc ? scopeId(sc.id) : null, "data-box": "" },
                  sc
                    ? h(
                        "div",
                        { class: "scope-head" },

                        h("span", { class: "count" }, kinds(cards) || plural(cards.length, "change")),
                        sc.href ? h("a", { class: "scope-link", href: sc.href, target: "_blank", rel: "noopener" }, "Manual page ↗") : null,
                        star(sc),
                      )
                    : null,
                  cards.map((c) => changeCard(c, sc ? "h5" : "h4")),
                ),
              ),
            ),
          );
        }
      } else if (PHASES.length) {
        for (const [phase, items] of groups()) {
          sec.body.append(
            h(
              "div",

              items.map((c) => changeCard(c, "h4")),

        }
      } else {
        for (const c of CH) sec.body.append(changeCard(c, "h3"));
      }
      if (drafted(CH)) sec.body.append(key());
      return sec;

    function kinds(items) {
      const n = (k) => items.filter((c) => c.kind === k).length;
      return ["new", "changed", "removed", "settled"]
        .map((k) => (n(k) ? `${n(k)} ${k}` : null))
        .filter(Boolean)
        .join(" · ");
    }

    function extraSection() {
      const fragment = document.getElementById("handoff-extra");

    function trySection() {
      if (!STEPS.length && !TRY.where) return null;
      const sec = section("try", "Try it", STEPS.length ? plural(STEPS.length, "step") : null);
      if (TRY.where) sec.body.append(h("p", { class: "where", html: md(TRY.where) }));
      const roles = [...new Set(STEPS.map((s) => s.role).filter(Boolean))];
      const paths = roles.length ? roles : [null];
      const views = paths.map((role) => {
        const steps = STEPS.filter((s) => !s.role || !role || s.role === role);
        const el = h("div", { class: "path", "data-role": role ?? "" });
        let n = 0;
        for (const when of [...new Set(steps.map((s) => s.when ?? ""))]) {
          const band = h("div", { class: "band" }, when ? h("h3", {}, when) : null);
          band.append(h("ol", { class: "steps" }, steps.filter((s) => (s.when ?? "") === when).map((s) => stepItem(s, ++n))));
          el.append(band);
        }
        return el;
      });
      if (roles.length > 1) {
        const remembered = readLocal("handoff-role");
        const first = roles.includes(remembered) ? remembered : roles[0];
        const show = (role) => {
          for (const v of views) v.hidden = v.dataset.role !== role;
          for (const r of sec.body.querySelectorAll(".roles input")) r.checked = r.value === role;
          writeLocal("handoff-role", role);
        };
        sec.body.append(
          h(
            "div",
            { class: "roles", role: "radiogroup", "aria-label": "Whose path" },
            roles.map((r, i) => h("label", {}, h("input", { type: "radio", name: "try-role", id: `try-role-${i}`, value: r, onchange: () => show(r) }), r)),
          ),
        );
        sec.body.append(...views);
        show(first);
        window.handoffViews = roles.map((r) => [r, () => show(r)]);
      } else {
        sec.body.append(...views);
      }
      return sec;
    }
