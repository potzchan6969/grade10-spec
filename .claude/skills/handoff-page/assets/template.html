<title>Handoff Page</title>
<style>
  /* Layout: one 760px reading column, with an outline beside it from 1120px wide.
     The page opens on its name and state, lists every change at a glance, then gives
     each change one card: what it was, what it is now, the picture, and the proof. */
  :root {
    --bg: #f5f5f4;
    --surface: #ffffff;
    --sunk: #fafaf9;
    --stage: #f2f1ef;
    --fg: #1b1918;
    --muted: #6b6866;
    --line: #e6e5e5;
    --line-strong: #d5d3d2;
    --accent: #856128;
    --accent-soft: #f8f2e8;
    --accent-line: #e6d3b1;
    --ok: #53753d;
    --ok-soft: #eff5eb;
    --warn: #776827;
    --warn-soft: #f6f3e4;
    --bad: #ae3f2d;
    --bad-soft: #fbf0ef;
    --info: #2173a6;
    --info-soft: #eaf4fb;
    --none: #6b6866;
    --none-soft: #efeeed;
    --ins: #d3e7c5;
    --del: #f4d4cc;
    --scrim: rgb(11 10 10 / 72%);
    --on-scrim: #fafaf9;
    --shadow: 0 1px 2px rgb(27 25 24 / 5%), 0 6px 18px rgb(27 25 24 / 4%);
    --lift: 0 14px 34px rgb(27 25 24 / 18%);
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --r: 14px;
    --r-sm: 9px;
    /* The product's own screen, drawn light in both page themes on purpose */
    --g-bg: #ffffff;
    --g-subtle: #fafaf9;
    --g-fg: #1b1918;
    --g-muted: #75726f;
    --g-line: #e6e5e5;
    --g-primary: #c4903d;
    --g-on-primary: #ffffff;
    --g-bezel: #2e2c2a;
    --g-info: #eaf4fb;
    --g-on-info: #19557b;
    --g-warn: #f6f3e4;
    --g-on-warn: #584d1d;
    --g-ok: #eff5eb;
    --g-on-ok: #3e572d;
    --g-bad: #fbf0ef;
    --g-on-bad: #822f21;
    --g-accent: #f8f2e8;
    --g-on-accent: #62481e;
    --g-lock: linear-gradient(160deg, #42403e, #1b1918);
    --g-font: "canada-type-gibson", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f0e0d;
      --surface: #1b1918;
      --sunk: #151413;
      --stage: #131211;
      --fg: #f5f5f4;
      --muted: #a7a4a1;
      --line: #2e2c2a;
      --line-strong: #42403e;
      --accent: #d3ac6e;
      --accent-soft: rgb(196 144 61 / 16%);
      --accent-line: rgb(211 172 110 / 40%);
      --ok: #9dc086;
      --ok-soft: rgb(102 144 75 / 20%);
      --warn: #cdb965;
      --warn-soft: rgb(177 154 58 / 18%);
      --bad: #e39d91;
      --bad-soft: rgb(207 88 68 / 20%);
      --info: #77bae4;
      --info-soft: rgb(41 141 204 / 20%);
      --none: #a7a4a1;
      --none-soft: rgb(157 154 151 / 16%);
      --ins: rgb(120 170 90 / 34%);
      --del: rgb(214 96 76 / 34%);
      --shadow: none;
      --lift: 0 14px 34px rgb(0 0 0 / 55%);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f0e0d;
    --surface: #1b1918;
    --sunk: #151413;
    --stage: #131211;
    --fg: #f5f5f4;
    --muted: #a7a4a1;
    --line: #2e2c2a;
    --line-strong: #42403e;
    --accent: #d3ac6e;
    --accent-soft: rgb(196 144 61 / 16%);
    --accent-line: rgb(211 172 110 / 40%);
    --ok: #9dc086;
    --ok-soft: rgb(102 144 75 / 20%);
    --warn: #cdb965;
    --warn-soft: rgb(177 154 58 / 18%);
    --bad: #e39d91;
    --bad-soft: rgb(207 88 68 / 20%);
    --info: #77bae4;
    --info-soft: rgb(41 141 204 / 20%);
    --none: #a7a4a1;
    --none-soft: rgb(157 154 151 / 16%);
    --ins: rgb(120 170 90 / 34%);
    --del: rgb(214 96 76 / 34%);
    --shadow: none;
    --lift: 0 14px 34px rgb(0 0 0 / 55%);
    color-scheme: dark;
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 var(--font);
    -webkit-font-smoothing: antialiased;
    overflow-wrap: break-word;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto;
    z-index: 10;
    height: env(safe-area-inset-top, 0px);
    background: var(--bg);
  }
  @media (prefers-reduced-motion: no-preference) {
    html {
      scroll-behavior: smooth;
    }
    .option {
      transition:
        border-color 0.15s,
        background-color 0.15s;
    }
  }
  h1,
  h2,
  h3,
  h4,
  p,
  dl,
  dd,
  figure {
    margin: 0;
  }
  a {
    color: var(--accent);
    text-underline-offset: 2px;
    text-decoration-thickness: 1px;
  }
  a:hover {
    text-decoration-thickness: 2px;
  }
  code {
    font-family: var(--mono);
    font-size: 0.86em;
    padding: 1px 5px;
    border-radius: 5px;
    background: var(--sunk);
    border: 1px solid var(--line);
    overflow-wrap: anywhere;
  }
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  .page {
    max-width: 1100px;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px 88px;
  }
  .main {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 32px;
    max-width: 760px;
    min-width: 0;
    margin: 0 auto;
  }
  @media (min-width: 720px) {
    .page {
      padding-left: max(32px, env(safe-area-inset-left, 0px));
      padding-right: max(32px, env(safe-area-inset-right, 0px));
      padding-block: 44px 120px;
    }
    .main {
      gap: 48px;
    }
  }
  .rail {
    display: none;
  }
  @media (min-width: 1120px) {
    .page {
      display: grid;
      grid-template-columns: minmax(0, 760px) 212px;
      justify-content: center;
      gap: 56px;
    }
    .main {
      margin: 0;
    }
    .rail {
      display: block;
    }
  }

  /* The masthead: what this is, its state, and what it asks */
  .top {
    display: grid;
    gap: 14px;
  }
  .flag {
    justify-self: start;
    padding: 6px 12px;
    border-radius: var(--r-sm);
    font-weight: 700;
    font-size: 14px;
    background: var(--tone-soft);
    color: var(--tone);
  }
  .run {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    row-gap: 2px;
    margin-left: -1.1em;
    clip-path: inset(-8px -8px -8px 1.1em);
  }
  .run-part::before {
    content: "\00b7";
    display: inline-block;
    width: 1.1em;
    color: var(--muted);
    text-align: center;
  }
  .eyebrow {
    color: var(--muted);
    font-size: 14px;
  }
  .kindword {
    color: var(--accent);
    font-size: 12.5px;
    font-weight: 750;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .top h1 {
    font-size: clamp(30px, 4.6vw, 40px);
    line-height: 1.1;
    font-weight: 760;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }
  .verdict {
    display: grid;
    gap: 6px;
    padding: 16px 18px;
    border-radius: var(--r);
    background: var(--tone-soft);
    border: 1px solid color-mix(in srgb, var(--tone) 24%, transparent);
  }
  .verdict-word {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--tone);
    font-size: 12.5px;
    font-weight: 780;
    letter-spacing: 0.07em;
    text-transform: uppercase;
  }
  .verdict-word::before {
    content: "";
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: currentcolor;
  }
  .verdict-reason,
  .lead {
    font-size: clamp(18px, 2.5vw, 21px);
    line-height: 1.4;
    font-weight: 640;
    text-wrap: pretty;
  }
  .verdict-ask {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 14px;
    margin-top: 4px;
    font-size: 15px;
  }
  .go {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 999px;
    background: var(--fg);
    color: var(--bg);
    font-size: 14px;
    font-weight: 650;
    text-decoration: none;
  }
  .go::after {
    content: "\2193";
  }
  .period {
    color: var(--muted);
    font-size: 15px;
  }
  .period strong {
    color: var(--fg);
    font-weight: 650;
  }
  .numbers {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px 24px;
    padding-top: 2px;
  }
  .numbers > div {
    display: grid;
  }
  .numbers dd {
    order: -1;
    font-size: 28px;
    line-height: 1.15;
    font-weight: 720;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }
  .numbers dt {
    color: var(--muted);
    font-size: 14px;
  }
  .stamp {
    color: var(--muted);
    font-size: 13.5px;
  }
  .since {
    padding: 12px 16px;
    border-radius: var(--r-sm);
    background: var(--info-soft);
    font-size: 15px;
  }

  .tone-ok {
    --tone: var(--ok);
    --tone-soft: var(--ok-soft);
  }
  .tone-accent {
    --tone: var(--accent);
    --tone-soft: var(--accent-soft);
  }
  .tone-warn {
    --tone: var(--warn);
    --tone-soft: var(--warn-soft);
  }
  .tone-bad {
    --tone: var(--bad);
    --tone-soft: var(--bad-soft);
  }
  .tone-info {
    --tone: var(--info);
    --tone-soft: var(--info-soft);
  }
  .tone-none {
    --tone: var(--none);
    --tone-soft: var(--none-soft);
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 1px 9px;
    border-radius: 999px;
    background: var(--tone-soft, var(--none-soft));
    color: var(--tone, var(--muted));
    font-size: 12.5px;
    font-weight: 700;
    line-height: 1.6;
    white-space: nowrap;
  }

  /* At a glance: every change on one line, and the proof in one bar */
  .glance {
    display: grid;
    padding-bottom: 6px;
    border: 1px solid var(--line);
    border-radius: var(--r);
    background: var(--surface);
    box-shadow: var(--shadow);
    scroll-margin-top: 72px;
  }
  .glance-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px 16px;
    padding: 14px 18px 8px;
  }
  .glance-head h2,
  .g-phase,
  .outline-head {
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 750;
    letter-spacing: 0.07em;
    text-transform: uppercase;
  }
  .g-phase {
    padding: 12px 18px 4px;
  }
  .g-list {
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .g-list a {
    display: grid;
    grid-template-columns: 84px minmax(0, 1fr) auto;
    align-items: baseline;
    gap: 2px 12px;
    padding: 9px 18px;
    border-top: 1px solid var(--line);
    color: var(--fg);
    text-decoration: none;
  }
  .g-group:not(:has(.g-phase)) li:first-child a,
  .g-list li:first-child a {
    border-top-color: transparent;
  }
  .g-list a:hover {
    background: var(--sunk);
  }
  .g-title {
    font-weight: 600;
    line-height: 1.45;
  }
  .g-list a:hover .g-title {
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .g-for {
    color: var(--muted);
    font-size: 13.5px;
    text-align: right;
  }
  .glance.plain .g-list a {
    grid-template-columns: minmax(0, 1fr) auto;
  }
  @media (max-width: 560px) {
    .g-list a {
      grid-template-columns: 76px minmax(0, 1fr);
      padding-inline: 14px;
    }
    .glance.plain .g-list a {
      grid-template-columns: minmax(0, 1fr);
    }
    .g-for {
      grid-column: -2;
      text-align: left;
    }
    .glance-head,
    .g-phase,
    .g-proof {
      padding-inline: 14px;
    }
    .g-proof {
      grid-template-columns: 76px minmax(0, 1fr) auto;
    }
  }
  .g-proof {
    display: grid;
    grid-template-columns: 84px minmax(0, 1fr) auto;
    align-items: center;
    gap: 12px;
    margin-top: 6px;
    padding: 12px 18px 8px;
    border-top: 1px solid var(--line);
    color: var(--fg);
    font-size: 14px;
    text-decoration: none;
  }
  .g-proof-label {
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 750;
    letter-spacing: 0.07em;
    text-transform: uppercase;
  }
  .g-proof-text {
    font-weight: 650;
    font-variant-numeric: tabular-nums;
  }
  .meter {
    display: flex;
    gap: 2px;
    height: 10px;
    min-width: 72px;
    overflow: hidden;
    border-radius: 999px;
    background: var(--line);
  }
  .meter > span {
    flex: 1 1 0;
    background: var(--tone);
  }
  .audience {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .audience label {
    position: relative;
    padding: 3px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--muted);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .audience label:hover {
    border-color: var(--line-strong);
    color: var(--fg);
  }
  .audience label:has(input:checked) {
    border-color: var(--fg);
    background: var(--fg);
    color: var(--bg);
  }
  .audience label:has(input:focus-visible) {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .audience input,
  .roles input,
  .option input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }
  .filter-note {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 12px;
    padding: 10px 14px;
    border-radius: var(--r-sm);
    background: var(--sunk);
    border: 1px dashed var(--line-strong);
    color: var(--muted);
    font-size: 14.5px;
  }
  .link-btn {
    padding: 0;
    border: 0;
    background: none;
    color: var(--accent);
    font: inherit;
    font-weight: 650;
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
  }

  /* Where the reader is: pills above the content on narrow screens, an outline beside it on wide ones */
  .n {
    color: var(--muted);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .pills {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    display: flex;
    gap: 6px;
    margin-block: -14px;
    padding-block: 10px;
    overflow-x: auto;
    scrollbar-width: none;
    background: var(--bg);
  }
  .pills a {
    flex: none;
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
    padding: 6px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    color: var(--fg);
    font-size: 13.5px;
    font-weight: 600;
    text-decoration: none;
  }
  .pills a:hover {
    border-color: var(--line-strong);
  }
  .pills a[aria-current] {
    border-color: var(--fg);
    background: var(--fg);
    color: var(--bg);
  }
  .pills a[aria-current] .n {
    color: inherit;
    opacity: 0.75;
  }
  @media (min-width: 1120px) {
    .pills {
      display: none;
    }
  }
  .outline {
    position: sticky;
    top: calc(env(safe-area-inset-top, 0px) + 40px);
    display: grid;
    gap: 10px;
    max-height: calc(100vh - 80px);
    overflow-y: auto;
    padding-top: 6px;
    scrollbar-width: thin;
  }
  .outline ul {
    display: grid;
    gap: 1px;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .outline a {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 5px 10px;
    border-left: 2px solid var(--line);
    color: var(--muted);
    font-size: 14px;
    font-weight: 560;
    line-height: 1.4;
    text-decoration: none;
  }
  .outline a:hover {
    color: var(--fg);
    border-left-color: var(--line-strong);
  }
  .outline a[aria-current] {
    border-left-color: var(--accent);
    color: var(--fg);
    font-weight: 680;
  }
  .outline .sub a {
    padding-left: 22px;
    font-size: 13.5px;
    font-weight: 500;
  }
  .outline .to-top {
    border-left-color: transparent;
    font-size: 13px;
  }

  /* Sections */
  .sec {
    display: grid;
    gap: 18px;
    min-width: 0;
    scroll-margin-top: 72px;
  }
  .sec-head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 12px;
  }
  .sec-head h2 {
    font-size: 25px;
    line-height: 1.2;
    font-weight: 750;
    letter-spacing: -0.015em;
  }
  .count {
    color: var(--muted);
    font-size: 14.5px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .sec-body {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 16px;
    min-width: 0;
  }
  .phase-group {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 14px;
    min-width: 0;
    scroll-margin-top: 72px;
  }
  .phase-group + .phase-group {
    margin-top: 14px;
  }
  .phase {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 10px;
    font-size: 18px;
    font-weight: 720;
  }

  .card {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 14px;
    min-width: 0;
    padding: 18px;
    border: 1px solid var(--line);
    border-radius: var(--r);
    background: var(--surface);
    box-shadow: var(--shadow);
    scroll-margin-top: 72px;
  }
  @media (min-width: 720px) {
    .card {
      gap: 16px;
      padding: 22px 24px;
    }
  }
  .card:target {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  /* A change: its kind and readers, its title, Before and Now, its pictures, its proof */
  .c-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 10px;
  }
  .c-for {
    color: var(--muted);
    font-size: 14px;
  }
  .change {
    position: relative;
  }
  .change .c-head {
    padding-right: 22px;
  }
  .anchor {
    position: absolute;
    top: 14px;
    right: 14px;
    padding: 0 4px;
    color: var(--muted);
    font-weight: 650;
    text-decoration: none;
    opacity: 0;
  }
  .card:hover .anchor,
  .anchor:focus-visible {
    opacity: 1;
  }
  .c-title {
    font-size: 19px;
    line-height: 1.35;
    font-weight: 720;
    text-wrap: pretty;
  }
  .slip {
    display: grid;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
  }
  .slip > div {
    display: grid;
    grid-template-columns: 64px minmax(0, 1fr);
    gap: 12px;
    padding: 11px 14px;
  }
  .slip > div + div {
    border-top: 1px solid var(--line);
  }
  .slip dt {
    padding-top: 3px;
    font-size: 11.5px;
    font-weight: 780;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .slip-before {
    background: var(--sunk);
    color: var(--muted);
  }
  .slip-now {
    background: var(--accent-soft);
  }
  .slip-now dt {
    color: var(--accent);
  }
  @media (max-width: 480px) {
    .slip > div {
      grid-template-columns: minmax(0, 1fr);
      gap: 0;
    }
  }
  .c-links {
    display: flex;
    flex-wrap: wrap;
    gap: 2px 16px;
    color: var(--muted);
    font-size: 14px;
  }
  .c-links a {
    font-weight: 600;
  }
  .c-links a::after {
    content: " \2197";
    font-size: 0.85em;
  }
  .c-proof {
    display: grid;
    gap: 2px;
    margin: 0;
    padding: 10px 0 0;
    border-top: 1px solid var(--line);
    list-style: none;
  }
  .c-proof a {
    display: grid;
    grid-template-columns: 22px minmax(0, 1fr);
    gap: 0 8px;
    padding: 3px 0;
    color: var(--fg);
    font-size: 14px;
    line-height: 1.45;
    text-decoration: none;
  }
  .c-proof a:hover .p-claim {
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .p-icon {
    display: grid;
    place-items: center;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--tone-soft);
    color: var(--tone);
    font-size: 12px;
    font-weight: 800;
  }
  .p-partial,
  .p-not-run {
    font-size: 15px;
    line-height: 1;
  }
  .p-how {
    grid-column: 2;
    color: var(--muted);
    font-size: 13px;
  }

  /* Pictures: screens and diagrams sit on a stage; tables, diffs and charts sit on the card */
  .pics {
    display: grid;
    gap: 12px;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr));
    min-width: 0;
  }
  .pics > .wide {
    grid-column: 1 / -1;
  }
  .pic {
    container-type: inline-size;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 8px;
    align-content: start;
    min-width: 0;
  }
  .pic.staged {
    padding: 14px;
    border-radius: var(--r-sm);
    background: var(--stage);
  }
  .pic figcaption {
    color: var(--muted);
    font-size: 13.5px;
  }
  .pic.added {
    outline: 2px dashed var(--accent);
    outline-offset: 4px;
  }
  .rendered {
    color: var(--muted);
    font-size: 12.5px;
    font-style: italic;
  }
  .key {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
    color: var(--muted);
    font-size: 13.5px;
  }
  .k-draft {
    text-decoration: underline dotted var(--accent) 2px;
    text-underline-offset: 3px;
  }
  .k-added {
    padding: 0 4px;
    border-radius: 3px;
    outline: 2px dashed var(--accent);
    outline-offset: 1px;
  }

  .shot {
    display: block;
    width: 100%;
    max-width: 100%;
    aspect-ratio: 16 / 10;
    padding: 0;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    background: var(--surface);
    cursor: zoom-in;
  }
  .shot img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
  }
  .shot.phone img {
    object-fit: contain;
  }
  .bn {
    --x: 50%;
    position: relative;
    max-width: 100%;
    aspect-ratio: 16 / 10;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    background: var(--surface);
  }
  .bn img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
  }
  .bn .bn-before {
    clip-path: inset(0 calc(100% - var(--x)) 0 0);
  }
  .bn::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: var(--x);
    width: 2px;
    margin-left: -1px;
    background: var(--accent);
  }
  .bn-tag {
    position: absolute;
    top: 8px;
    z-index: 1;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--scrim);
    color: var(--on-scrim);
    font-size: 11.5px;
    font-weight: 700;
  }
  .bn-tag-before {
    left: 8px;
  }
  .bn-tag-now {
    right: 8px;
  }
  .slider {
    width: 100%;
    margin: 0;
    accent-color: var(--accent);
  }

  .mock {
    justify-self: center;
    width: 100%;
    max-width: 100%;
    overflow: hidden;
    border: 1px solid var(--line-strong);
    border-radius: 12px;
    background: var(--g-bg);
    color: var(--g-fg);
    font: 13px/1.45 var(--g-font);
  }
  .mock-phone {
    max-width: 290px;
    border: 6px solid var(--g-bezel);
    border-radius: 24px;
  }
  .mock-status,
  .mock-bar,
  .mock-mailhead {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    background: var(--g-subtle);
    border-bottom: 1px solid var(--g-line);
    font-size: 11.5px;
  }
  .mock-status {
    justify-content: space-between;
    font-weight: 650;
  }
  .mock-title {
    min-width: 0;
    text-align: right;
    font-weight: 700;
  }
  .dots {
    flex: none;
    width: 34px;
    height: 8px;
    background: radial-gradient(circle at 4px 4px, var(--g-line) 3.5px, transparent 4px) 0 0 / 13px 8px repeat-x;
  }
  .mock-url {
    flex: 1;
    min-width: 0;
    padding: 2px 10px;
    border: 1px solid var(--g-line);
    border-radius: 999px;
    background: var(--g-bg);
    color: var(--g-muted);
    overflow-wrap: anywhere;
  }
  .mock-mailhead {
    display: grid;
    gap: 2px;
    font-size: 12px;
  }
  .mock-mailhead b {
    color: var(--g-muted);
    font-weight: 600;
  }
  .mock-body {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 10px;
    align-content: start;
    padding: 14px;
  }
  .m-h {
    font-size: 16px;
    font-weight: 700;
  }
  .m-muted {
    color: var(--g-muted);
  }
  .m-row,
  .m-switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .m-row {
    padding-bottom: 8px;
    border-bottom: 1px solid var(--g-line);
  }
  .m-val {
    font-weight: 700;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .m-btn {
    justify-self: start;
    padding: 8px 16px;
    border: 1px solid var(--g-line);
    border-radius: 8px;
    background: var(--g-bg);
    font-weight: 650;
  }
  .m-primary {
    justify-self: stretch;
    text-align: center;
    border-color: var(--g-primary);
    background: var(--g-primary);
    color: var(--g-on-primary);
  }
  .m-toggle {
    position: relative;
    flex: none;
    width: 34px;
    height: 20px;
    border-radius: 999px;
    background: var(--g-line);
  }
  .m-toggle::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--g-bg);
    box-shadow: 0 1px 2px rgb(0 0 0 / 25%);
  }
  .m-toggle.on {
    background: var(--g-primary);
  }
  .m-toggle.on::after {
    left: 16px;
  }
  .m-field {
    display: grid;
    gap: 4px;
  }
  .m-field-label {
    color: var(--g-muted);
    font-size: 12px;
    font-weight: 600;
  }
  .m-input {
    min-height: 36px;
    padding: 8px 10px;
    border: 1px solid var(--g-line);
    border-radius: 8px;
  }
  .m-notice {
    padding: 8px 10px;
    border-radius: 8px;
    font-weight: 600;
    background: var(--g-info);
    color: var(--g-on-info);
  }
  .m-notice.tone-warn {
    background: var(--g-warn);
    color: var(--g-on-warn);
  }
  .m-notice.tone-ok {
    background: var(--g-ok);
    color: var(--g-on-ok);
  }
  .m-notice.tone-bad {
    background: var(--g-bad);
    color: var(--g-on-bad);
  }
  .m-tip {
    justify-self: start;
    max-width: 100%;
    padding: 6px 10px;
    border-radius: 6px;
    background: var(--g-fg);
    color: var(--g-bg);
    font-size: 12px;
  }
  .m-badge {
    justify-self: start;
    padding: 1px 9px;
    border-radius: 999px;
    border: 1px solid var(--g-line);
    background: var(--g-subtle);
    font-size: 11.5px;
    font-weight: 700;
  }
  .m-badge.tone-accent {
    border-color: var(--g-primary);
    background: var(--g-accent);
    color: var(--g-on-accent);
  }
  .m-divider {
    width: 100%;
    margin: 2px 0;
    border: 0;
    border-top: 1px solid var(--g-line);
  }
  .draft {
    text-decoration: underline dotted var(--g-primary) 2px;
    text-underline-offset: 3px;
  }
  .added {
    outline: 2px dashed var(--g-primary);
    outline-offset: 3px;
    border-radius: 6px;
  }
  .mock-push {
    display: grid;
    padding: 16px 14px;
    border: 0;
    border-radius: 20px;
    background: var(--g-lock);
  }
  .push {
    display: grid;
    gap: 2px;
    padding: 10px 12px;
    border-radius: 14px;
    background: var(--g-subtle);
    color: var(--g-fg);
  }
  .push-head {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    color: var(--g-muted);
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .flow {
    display: flex;
    align-items: stretch;
    gap: 6px;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .flow-step {
    flex: 1 1 0;
    min-width: 0;
    display: grid;
    gap: 2px;
    align-content: start;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    background: var(--surface);
    font-size: 14px;
  }
  .flow-step[class*="tone-"] {
    border-color: var(--tone);
    background: var(--tone-soft);
  }
  .flow-who {
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 750;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .flow-arrow {
    flex: 0 1 auto;
    display: grid;
    place-content: center;
    justify-items: center;
    max-width: 96px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.25;
    text-align: center;
  }
  .flow-arrow::after {
    content: "\2192";
    font-size: 18px;
    line-height: 1;
    color: var(--accent);
  }
  @container (max-width: 600px) {
    .flow {
      flex-direction: column;
    }
    .flow-arrow {
      max-width: none;
      grid-auto-flow: column;
      justify-content: start;
      gap: 8px;
      padding-left: 18px;
    }
    .flow-arrow::after {
      content: "\2193";
      grid-row: 1;
    }
  }
  @container (max-width: 760px) {
    .flow.long {
      flex-direction: column;
    }
    .flow.long .flow-arrow {
      max-width: none;
      grid-auto-flow: column;
      justify-content: start;
      gap: 8px;
      padding-left: 18px;
    }
    .flow.long .flow-arrow::after {
      content: "\2193";
      grid-row: 1;
    }
  }

  .scroll-x {
    max-width: 100%;
    overflow-x: auto;
  }
  .lanes {
    display: grid;
    grid-template-columns: 44px repeat(var(--n), minmax(84px, 1fr));
    min-width: calc(44px + var(--n) * 84px);
    row-gap: 4px;
    font-size: 12.5px;
    line-height: 1.35;
  }
  .lane-head {
    grid-row: 1;
    padding: 4px 4px 8px;
    border-bottom: 2px solid var(--line-strong);
    font-size: 12.5px;
    font-weight: 750;
    text-align: center;
  }
  .lane-at {
    grid-column: 1;
    padding-top: 7px;
    color: var(--muted);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .lane-cell {
    background: linear-gradient(var(--line-strong), var(--line-strong)) center / 2px 100% no-repeat;
  }
  .lane-ev {
    position: relative;
    z-index: 1;
    margin: 2px 3px;
    padding: 5px 6px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
    text-align: center;
  }
  .lane-ev[class*="tone-"] {
    border-color: var(--tone);
    background: var(--tone-soft);
  }
  .lane-ev.msg {
    border-color: transparent;
    background: transparent;
    padding-bottom: 16px;
  }
  .lane-ev.msg::after {
    content: "";
    position: absolute;
    bottom: 7px;
    left: calc(50% / var(--span));
    right: calc(50% / var(--span));
    border-top: 2px solid var(--accent);
  }
  .lane-ev.msg::before {
    content: "";
    position: absolute;
    bottom: 3px;
    border-block: 5px solid transparent;
  }
  .lane-ev.to-right::before {
    right: calc(50% / var(--span) - 2px);
    border-left: 8px solid var(--accent);
  }
  .lane-ev.to-left::before {
    left: calc(50% / var(--span) - 2px);
    border-right: 8px solid var(--accent);
  }

  .lanes-list {
    display: none;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .lanes-list li {
    display: grid;
    grid-template-columns: 46px minmax(0, 1fr);
    gap: 1px 10px;
    padding-block: 8px;
    border-top: 1px solid var(--line-strong);
    font-size: 14px;
    line-height: 1.4;
  }
  .lanes-list li:first-child {
    padding-top: 0;
    border-top: 0;
  }
  .ll-at {
    grid-row: span 2;
    padding-top: 1px;
    color: var(--muted);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  .ll-who {
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 750;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .lanes-list li[class*="tone-"] .ll-text {
    justify-self: start;
    padding: 1px 8px;
    border-radius: 6px;
    background: var(--tone-soft);
  }
  @container (max-width: 480px) {
    .lanes-wide {
      display: none;
    }
    .lanes-list {
      display: grid;
    }
  }

  .chain {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .chain-state {
    padding: 4px 12px;
    border: 1.5px solid var(--line-strong);
    border-radius: 999px;
    background: var(--surface);
    font-size: 13.5px;
    font-weight: 650;
  }
  .chain-arrow {
    color: var(--accent);
  }
  .tbl {
    width: 100%;
    border-collapse: collapse;
    font-size: 14.5px;
  }
  .tbl th,
  .tbl td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
  }
  .tbl thead th {
    border-bottom: 2px solid var(--line-strong);
    color: var(--muted);
    font-size: 12px;
    font-weight: 750;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .tbl tbody th {
    font-weight: 650;
  }
  .tbl code {
    overflow-wrap: break-word;
  }
  .tbl tbody tr:last-child > * {
    border-bottom: 0;
  }

  .bars {
    display: grid;
    gap: 8px;
  }
  .bar-row {
    display: grid;
    grid-template-columns: minmax(90px, 32%) minmax(0, 1fr);
    align-items: center;
    gap: 12px;
    font-size: 14px;
  }
  .bar-plot {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .bar-fill {
    flex: none;
    width: calc((100% - 6.5em) * var(--p));
    min-width: 3px;
    height: 14px;
    border-radius: 0 4px 4px 0;
    background: var(--accent);
  }
  .bar-val {
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .diff {
    display: grid;
    gap: 12px;
  }
  .d-row {
    display: grid;
    gap: 3px;
    min-width: 0;
  }
  .d-name {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 8px;
    font-size: 14px;
    font-weight: 650;
  }
  .d-line {
    display: grid;
    grid-template-columns: 50px minmax(0, 1fr);
    gap: 10px;
    padding: 6px 10px;
    border-radius: 7px;
    font-size: 15px;
    line-height: 1.5;
  }
  @container (min-width: 560px) {
    .d-row {
      grid-template-columns: minmax(0, 30%) minmax(0, 1fr);
      column-gap: 14px;
    }
    .d-name {
      grid-row: span 2;
      align-content: start;
      padding-top: 6px;
    }
  }
  .d-old {
    background: var(--bad-soft);
  }
  .d-new {
    background: var(--ok-soft);
  }
  .d-tag {
    padding-top: 3px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 780;
    letter-spacing: 0.07em;
    text-transform: uppercase;
  }
  .d-old del {
    border-radius: 3px;
    background: var(--del);
    text-decoration: line-through;
    text-decoration-color: color-mix(in srgb, var(--bad) 70%, transparent);
  }
  .d-new ins {
    border-radius: 3px;
    background: var(--ins);
    text-decoration: none;
  }
  .swatch {
    display: inline-block;
    width: 15px;
    height: 15px;
    margin-right: 7px;
    vertical-align: -2px;
    border: 1px solid var(--line-strong);
    border-radius: 4px;
    background: var(--c);
  }

  .board {
    display: grid;
    gap: 12px;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 168px), 1fr));
  }
  .b-col {
    display: grid;
    gap: 8px;
    align-content: start;
    min-width: 0;
  }
  .b-head {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 750;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .b-head::before {
    content: "";
    flex: none;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--tone, var(--line-strong));
  }
  .b-n {
    margin-left: auto;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .b-items {
    display: grid;
    gap: 6px;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .b-items li {
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    font-size: 13.5px;
    line-height: 1.4;
    overflow-wrap: anywhere;
  }
  /* The item is the box already; a chip inside it would break across lines. */
  .b-items code {
    padding: 0;
    border: 0;
    background: none;
  }
  .b-empty {
    padding: 4px 2px;
    color: var(--muted);
    font-size: 13px;
    font-style: italic;
  }

  /* Decide: one card per question or blocker, answered on the page */
  .ask-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 10px;
  }
  .num {
    flex: none;
    display: grid;
    place-items: center;
    min-width: 26px;
    height: 26px;
    padding-inline: 6px;
    border-radius: 999px;
    background: var(--fg);
    color: var(--surface);
    font-size: 13px;
    font-weight: 750;
    font-variant-numeric: tabular-nums;
  }
  .num.tone-bad {
    background: var(--bad);
  }
  .ask-kind {
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 750;
    letter-spacing: 0.07em;
    text-transform: uppercase;
  }
  .state {
    margin-left: auto;
    color: var(--muted);
    font-size: 13.5px;
    font-weight: 600;
  }
  .state.is-set {
    color: var(--ok);
  }
  .ask-title {
    font-size: 19px;
    line-height: 1.35;
    font-weight: 720;
  }
  .ask-text {
    font-size: 17px;
    line-height: 1.5;
  }
  .why {
    color: var(--muted);
    font-size: 15px;
  }
  .why strong {
    color: var(--fg);
    font-weight: 650;
  }
  .card.closed {
    gap: 8px;
    background: var(--sunk);
    box-shadow: none;
  }
  .options {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr));
    gap: 12px;
    min-width: 0;
    margin: 0;
    padding: 0;
    border: 0;
  }
  .option {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 10px;
    align-content: start;
    min-width: 0;

<script>
  (() => {
    const DATA = (() => {
      try {
        return JSON.parse(document.getElementById("handoff-data").textContent);
      } catch (e) {
        return { title: "Handoff", verdict: "not-ready", reason: `The page data did not load: ${e.message}` };
      }
    })();
    const PAGE = DATA.page ?? "feature";
    const DIGEST = PAGE === "digest";
    const DECISION = PAGE === "decision";
    const QUESTIONS = DATA.decide?.questions ?? [];
    const BLOCKERS = DATA.decide?.blockers ?? [];
    const Q = QUESTIONS.filter((q) => !q.answered);
    const B = BLOCKERS.filter((b) => !b.done);
    const AD = DATA.decide?.agentDecisions ?? [];
    const CH = DATA.changes ?? [];
    const PR = DATA.proof ?? [];
    const TRY = DATA.try ?? {};
    const STEPS = TRY.steps ?? [];
    const FU = DATA.followups ?? [];
    const ENG = DATA.engineers ?? {};
    const NUMBERS = DATA.numbers ?? [];
    const KINDWORD = { feature: "Handoff", decision: "Decision", digest: "Digest" };
    const VERDICT = {
      ready: ["Ready", "ok"],
      decide: ["Ready once you decide", "accent"],
      "not-ready": ["Not ready", "warn"],
      blocked: ["Blocked", "bad"],
    };
    const KIND = { new: ["New", "info"], changed: ["Changed", "accent"], removed: ["Removed", "none"], settled: ["Settled", "ok"] };
    const STATUS = {
      verified: ["Verified", "ok", "✓"],
      partial: ["Partial", "warn", "◐"],
      "not-run": ["Not run", "none", "○"],
      failed: ["Failed", "bad", "✕"],
    };
    const STAGED = new Set(["shot", "beforeNow", "mock", "flow", "lanes", "states", "board"]);
    const WIDE = new Set(["beforeNow", "table", "diff", "board", "lanes", "flow", "states", "bars"]);
    const KEPT = "Picks stay in this browser; copy them into a PR comment or the chat.";
    const LOCAL = "handoff-answers";
    const state = { picks: {}, notes: {}, done: {}, ticks: {} };

    const esc = (s) =>
      String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    const md = (s) =>
      esc(s)
        .replace(/`([^`]+)`/g, (_, code) => `<code>${code.replace(/([./_])(?=[^./_])/g, "$1<wbr>")}</code>`)
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/\[([^\]]+)\]\(((?:https?:\/\/|#)[^)\s]+)\)/g, (_, text, href) =>
          href.startsWith("#") ? `<a href="${href}">${text}</a>` : `<a href="${href}" target="_blank" rel="noopener">${text}</a>`,
        );
    // Inside a link, a nested link is invalid: keep its words only.
    const mdText = (s) => md(s).replace(/<a [^>]*>([\s\S]*?)<\/a>/g, "$1");
    const plain = (s) =>
      String(s ?? "")
        .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
        .replace(/\*\*|`/g, "");
    const list = (v) => (v == null ? [] : Array.isArray(v) ? v : [v]);
    const plural = (n, one, many = `${one}s`) => `${n} ${n === 1 ? one : many}`;
    const figure = (v) => (typeof v === "number" ? new Intl.NumberFormat("en-US").format(v) : String(v ?? ""));
    const slug = (s) =>
      String(s)
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "");
    const phaseId = (p) => `area-${slug(p) || "other"}`;
    const status = (p) => STATUS[p.status] ?? STATUS["not-run"];
    const statusIcon = (k) => {
      const [, tone, icon] = STATUS[k] ?? STATUS["not-run"];
      return h("span", { class: `p-icon p-${STATUS[k] ? k : "not-run"} tone-${tone}`, "aria-hidden": "true" }, icon);
    };
    const tally = (k) => PR.filter((p) => p.status === k).length;
    const PHASES = [...new Set(CH.map((c) => c.phase).filter(Boolean))];
    const AUDIENCES = [...new Set(CH.flatMap((c) => list(c.who)))];
    const FILTER = CH.length >= 4 && AUDIENCES.length >= 2;

    function h(tag, props, ...kids) {
      const el = document.createElement(tag);
      for (const [k, v] of Object.entries(props ?? {})) {
        if (v == null || v === false) continue;
        if (k === "class") el.className = v;
        else if (k === "html") el.innerHTML = v;
        else if (k === "style") el.style.cssText = v;
        else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v === true ? "" : v);
      }
      for (const kid of kids.flat(Infinity)) {
        if (kid == null || kid === false) continue;
        el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
      }
      return el;
    }

    // Each part carries its own dot; the strip clipped off the left hides the dot that starts a line.
    function dotted(items) {
      return items.filter(Boolean).map((b) => h("span", { class: "run-part" }, b));
    }

    function section(id, title, count) {
      const body = h("div", { class: "sec-body" });
      const el = h(
        "section",
        { class: "sec", id, "aria-labelledby": `${id}-h` },
        h("div", { class: "sec-head" }, h("h2", { id: `${id}-h` }, title), count ? h("span", { class: "count" }, count) : null),
        body,
      );
      return { el, body };
    }

    function meta(rows) {
      const kept = rows.filter(([, v]) => v && (!(v instanceof Node) || v.childNodes.length));
      if (!kept.length) return null;
      return h(
        "dl",
        { class: "meta" },
        kept.map(([k, v]) => h("div", {}, h("dt", {}, k), v instanceof Node ? h("dd", {}, v) : h("dd", { html: md(v) }))),
      );
    }

    // One source per line: a source's own words often hold a dot or a comma.
    function reasons(items) {
      const all = list(items);
      if (!all.length) return null;
      const one = (r) => (r.href ? h("a", { href: r.href, target: "_blank", rel: "noopener" }, r.text ?? r.href) : h("span", { html: md(r.text) }));
      return all.length === 1 ? h("span", {}, one(all[0])) : h("ul", { class: "reasons" }, all.map((r) => h("li", {}, one(r))));
    }

    // Days are calendar days as the data writes them, so they never shift with the reader's clock.
    function toDay(v) {
      const m = String(v ?? "").match(/^(\d{4})-(\d{2})-(\d{2})/);
      return m ? new Date(Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3]))) : null;
    }
    function dayText(d, year) {
      return new Intl.DateTimeFormat("en-GB", { weekday: "short", day: "numeric", month: "short", year: year ? "numeric" : undefined, timeZone: "UTC" }).format(d);
    }

    // Word by word, what a value lost and what it gained.
    function wordDiff(a, b) {
      const split = (s) => String(s).match(/\s+|[\p{L}\p{N}_'’]+|[^\s\p{L}\p{N}_'’]/gu) ?? [];
      const x = split(a);
      const y = split(b);
      // Only letters and digits count as kept: two values that share a # or a dot share nothing.
      const words = (t) => t.filter((w) => /[\p{L}\p{N}]/u.test(w)).length;
      if (x.length * y.length > 60000) return [[String(a)], [String(b)]];
      const table = Array.from({ length: x.length + 1 }, () => new Uint16Array(y.length + 1));
      for (let i = x.length - 1; i >= 0; i--)
        for (let j = y.length - 1; j >= 0; j--) table[i][j] = x[i] === y[j] ? table[i + 1][j + 1] + 1 : Math.max(table[i + 1][j], table[i][j + 1]);
      const ox = [];
      const oy = [];
      let i = 0;
      let j = 0;
      while (i < x.length && j < y.length) {
        if (x[i] === y[j]) {
          ox.push([x[i++], false]);
          oy.push([y[j++], false]);
        } else if (table[i + 1][j] >= table[i][j + 1]) ox.push([x[i++], true]);
        else oy.push([y[j++], true]);
      }
      while (i < x.length) ox.push([x[i++], true]);
      while (j < y.length) oy.push([y[j++], true]);
      const kept = words(ox.filter(([, m]) => !m).map(([t]) => t));
      // When almost every word changed, marking them all says nothing.
      if (kept < Math.max(words(x), words(y)) / 3) return [[String(a)], [String(b)]];
      return [marks(ox, "del"), marks(oy, "ins")];
    }
    function marks(tokens, tag) {
      const out = [];
      let run = null;
      tokens.forEach(([t, marked], k) => {
        const bridge = !marked && run && /^\s+$/.test(t) && tokens[k + 1]?.[1];
        if (marked || bridge) {
          run ??= [];
          run.push(t);
        } else {
          if (run) out.push(h(tag, {}, run.join("")));
          run = null;
          out.push(t);
        }
      });
      if (run) out.push(h(tag, {}, run.join("")));
      return out;
    }
    function swatch(v) {
      const s = String(v ?? "").trim();
      if (!/^(#[0-9a-f]{3,8}|(rgba?|hsla?|oklch|oklab|lab|lch)\([^()]*\))$/i.test(s) || !CSS.supports("color", s)) return null;
      const el = h("span", { class: "swatch", "aria-hidden": "true" });
      el.style.setProperty("--c", s);
      return el;
    }

    const PICTURES = {
      shot: (p) =>
        h(
          "button",
          {
            type: "button",
            class: `shot${p.phone ? " phone" : ""}`,
            "data-full": p.src,
            "data-caption": p.caption ?? "",

    function picture(p, alone = false) {

      return h(

      if (DIGEST) {
        const from = toDay(s.fromDate);
        const to = toDay(s.date);
        const range = s.from && s.commit ? h("code", {}, `${s.from}..${s.commit}`) : null;
        const days =

    function verdict() {

        word = `Ready, ${verified} of ${PR.length} claims verified`;

    function groups() {
      if (!PHASES.length) return [["", CH]];
      return [...PHASES.map((p) => [p, CH.filter((c) => c.phase === p)]), ["", CH.filter((c) => !c.phase)]].filter(([, items]) => items.length);

    function decideSection() {
      if (!QUESTIONS.length && !BLOCKERS.length && !AD.length) return null;
      const closed = QUESTIONS.length + BLOCKERS.length - Q.length - B.length;
      const counts = [Q.length ? plural(Q.length, "question") : null, B.length ? plural(B.length, "blocker") : null, closed ? `${closed} answered` : null]
        .filter(Boolean)
        .join(" · ");
      const sec = section("decide", "Decide", counts);
      for (const q of QUESTIONS) sec.body.append(q.answered ? closedCard(q, q.answered, `q${q.n}`) : questionCard(q));
      for (const b of BLOCKERS) sec.body.append(b.done ? closedCard(b, b.done, `b${b.n}`) : blockerCard(b));
      if (AD.length) sec.body.append(agentCard());
      if (drafted(Q)) sec.body.append(key());
      if (Q.length || B.length) sec.body.append(answerBar());
      return sec;

        { class: "agent", id: "agent-decisions" },
        h("h3", {}, "Decisions made by Agents"),
        h("p", { class: "hint" }, "Each was decided without asking. Overrule one in a PR comment."),
        h(
          "ul",
          {},
          AD.map((d) =>
            h(
              "li",
              {},
              h("strong", { html: md(d.decision) }),
              ": ",
              h("span", { html: md(d.taken) }),
              d.why ? h("span", { class: "why", html: md(d.why) }) : null,
            ),
          ),
        ),
      );
    }

    function answerBar() {
      return h(
        "div",
        { class: "answers", id: "answers" },
        h("p", { class: "line", id: "answer-line" }),
        h("button", { type: "button", class: "btn", id: "copy-answers", onclick: copyAnswers }, "Copy answers"),
        h("textarea", { class: "copy-out", id: "answer-copy", rows: "2", readonly: true, hidden: true, "aria-label": "Answers to copy" }),
        h("p", { class: "msg", id: "answer-msg", role: "status" }),
        h("p", { class: "status", id: "answer-status" }),
      );
    }

    function changedSection() {
      if (!CH.length) return null;
      const sec = section("changed", DECISION ? "What is settled" : "What changed", kinds(CH));
      if (FILTER) sec.body.append(h("p", { class: "filter-note", id: "filter-note", hidden: true }, h("span", {}), h("button", { type: "button", class: "link-btn", onclick: () => showFor("") }, "Show every change")));
      if (PHASES.length) {
        for (const [phase, items] of groups()) {
          sec.body.append(
            h(
              "div",
              { class: "phase-group", id: phase ? phaseId(phase) : null, "data-group": phase },
              phase ? h("h3", { class: "phase" }, phase, h("span", { class: "count" }, kinds(items))) : null,
              items.map((c) => changeCard(c, "h4")),
            ),
          );
        }
      } else {
        for (const c of CH) sec.body.append(changeCard(c, "h3"));
      }
      if (drafted(CH)) sec.body.append(key());
      return sec;
    }

    function kinds(items) {
      const n = (k) => items.filter((c) => c.kind === k).length;
      return ["new", "changed", "removed", "settled"]
        .map((k) => (n(k) ? `${n(k)} ${k}` : null))
        .filter(Boolean)
        .join(" · ");
    }

    function changeCard(c, level) {
      const [word, tone] = KIND[c.kind] ?? [];
      const who = list(c.who);
      const proofs = PR.map((p, i) => [p, i]).filter(([p]) => p.change === c.id);
      return h(
        "article",
        { class: "card change", id: c.id, "data-for": who.join("|") },
        h(
          "div",
          { class: "c-head" },
          word ? h("span", { class: `chip tone-${tone}` }, word) : null,
          who.length ? h("span", { class: "c-for" }, `For ${who.join(", ")}`) : null,
          h("a", { class: "anchor", href: `#${c.id}`, "aria-label": `Link to ${plain(c.title)}` }, "#"),
        ),
        h(level, { class: "c-title", html: md(c.title) }),
        c.before || c.now
          ? h(
              "dl",
              { class: "slip" },
              c.before ? h("div", { class: "slip-before" }, h("dt", {}, "Before"), h("dd", { html: md(c.before) })) : null,
              c.now ? h("div", { class: "slip-now" }, h("dt", {}, DECISION ? "Settled" : "Now"), h("dd", { html: md(c.now) })) : null,
            )
          : null,
        picture(c.picture),
        list(c.links).length
          ? h(
              "p",
              { class: "c-links" },
              list(c.links).map((l) => h("a", { href: l.href, target: "_blank", rel: "noopener" }, l.text ?? l.href)),
            )
          : null,
        proofs.length
          ? h(
              "ul",
              { class: "c-proof", "aria-label": "Proof" },
              proofs.map(([p, i]) => {
                const [word] = status(p);
                return h(
                  "li",
                  {},
                  h(
                    "a",
                    { href: `#proof-${i + 1}` },
                    statusIcon(p.status),
                    h("span", { class: "p-claim" }, h("span", { class: "sr-only" }, `${word}: `), h("span", { html: mdText(p.claim) })),
                    h("span", { class: "p-how", html: mdText(p.status === "verified" ? p.how : (p.why ?? p.how)) }),
                  ),
                );
              }),
            )
          : null,
      );
    }

    function extraSection() {
      const fragment = document.getElementById("handoff-extra");
      if (!DATA.extra?.title || !fragment?.content.childNodes.length) return null;
      const sec = section("extra", DATA.extra.title, null);
      sec.body.append(document.importNode(fragment.content, true));
      return sec;
    }

    function trySection() {
      if (!STEPS.length && !TRY.where) return null;
      const sec = section("try", "Try it", STEPS.length ? plural(STEPS.length, "step") : null);
      if (TRY.where) sec.body.append(h("p", { class: "where", html: md(TRY.where) }));
      const roles = [...new Set(STEPS.map((s) => s.role).filter(Boolean))];
      const paths = roles.length ? roles : [null];
      const views = paths.map((role) => {
        const steps = STEPS.filter((s) => !s.role || !role || s.role === role);
        const el = h("div", { class: "path", "data-role": role ?? "" });
        let n = 0;
        for (const when of [...new Set(steps.map((s) => s.when ?? ""))]) {
          const band = h("div", { class: "band" }, when ? h("h3", {}, when) : null);
          band.append(h("ol", { class: "steps" }, steps.filter((s) => (s.when ?? "") === when).map((s) => stepItem(s, ++n))));
          el.append(band);
        }
        return el;
      });
      if (roles.length > 1) {
        const remembered = readLocal("handoff-role");
        const first = roles.includes(remembered) ? remembered : roles[0];
        const show = (role) => {
          for (const v of views) v.hidden = v.dataset.role !== role;
          for (const r of sec.body.querySelectorAll(".roles input")) r.checked = r.value === role;
          writeLocal("handoff-role", role);
        };
        sec.body.append(
          h(
            "div",
            { class: "roles", role: "radiogroup", "aria-label": "Whose path" },
            roles.map((r, i) => h("label", {}, h("input", { type: "radio", name: "try-role", id: `try-role-${i}`, value: r, onchange: () => show(r) }), r)),
          ),
        );
        sec.body.append(...views);
        show(first);
        window.handoffViews = roles.map((r) => [r, () => show(r)]);
      } else {
        sec.body.append(...views);
      }
      return sec;
    }

    function stepItem(s, n) {
      return h(
        "li",
        { class: "step" },
        h("span", { class: "step-n" }, n),
        h(
          "div",
          { class: "step-body" },
          h("p", { class: "step-title", html: md(s.title) }),
          s.where ? h("p", { class: "step-where", html: md(s.where) }) : null,
          s.do ? h("p", { html: md(s.do) }) : null,
          s.success ? h("p", { class: "success", html: `✓ “${md(s.success)}”` }) : null,
          picture(s.picture),
        ),
      );
    }

    function proofSection() {
      if (!PR.length) return null;
      const sec = section("proof", "Proof", `${tally("verified")} of ${PR.length} verified`);
      sec.body.append(
        h(
          "div",
          { class: "tally" },
          meter(),
          h(
            "p",
            { class: "tally-key" },
            Object.entries(STATUS).map(([k, [word]]) =>
              tally(k) ? h("span", {}, statusIcon(k), `${tally(k)} ${word.toLowerCase()}`) : null,
            ),
          ),
        ),
        h(
          "div",
          { class: "ledger" },
          h("div", { class: "ledger-row ledger-head" }, h("span", {}, "Status"), h("span", {}, "Claim"), h("span", {}, "How"), h("span", {}, "Revision")),
          PR.map((p, i) => {
            const [word, tone] = status(p);
            return h(
              "div",
              { class: "ledger-row", id: `proof-${i + 1}` },
              h("span", { class: `chip tone-${tone}` }, word),
              h("span", {}, h("span", { html: md(p.claim) }), p.why ? h("span", { class: "claim-why", html: md(p.why) }) : null),
              h("span", {}, h("span", { class: "lbl" }, "How: "), h("span", { html: md(p.how) })),
              h(
                "span",
                {},
                h("span", { class: "lbl" }, "Revision: "),
                p.revision ? (p.href ? h("a", { href: p.href, target: "_blank", rel: "noopener" }, h("code", {}, p.revision)) : h("code", {}, p.revision)) : "—",
              ),
            );
          }),
        ),
      );
      return sec;
    }

    function shipSection() {
      const s = DATA.ship;
      if (!s) return null;
      const sec = section("ship", "Ship it", null);
      const rows = [
        ["Needs", list(s.needs).length ? h("ul", {}, list(s.needs).map((n) => h("li", { html: md(n) }))) : null],
        ["Risk", s.risk ? h("span", { html: md(s.risk) }) : null],
        ["Undo", s.undo ? h("span", { html: md(s.undo) }) : null],
      ].filter(([, v]) => v);
      sec.body.append(h("dl", { class: "rows" }, rows.map(([k, v]) => h("div", {}, h("dt", {}, k), h("dd", {}, v)))));
      return sec;
    }

    function followupsSection() {
      if (!FU.length) return null;
      const sec = section("followups", "Follow-ups", `${FU.length} left`);
      sec.body.append(
        h(
          "div",
          { class: "list" },
          FU.map((f) =>
            h(
              "div",
              { class: "fu", id: `fu-${f.id}` },
              h("input", { type: "checkbox", id: `fu-${f.id}-done`, "aria-label": `Done: ${plain(f.title)}`, onchange: (e) => tick(f.id, e.target.checked) }),
              h("span", { class: "fu-title", html: md(f.title) }),
              f.why ? h("span", { class: "fu-why", html: md(f.why) }) : null,
              h("span", { class: "fu-owner" }, [f.owner, f.due].filter(Boolean).join(" · ")),
            ),
          ),
        ),
      );
      return sec;
    }

    function engineersSection() {
      const commits = list(ENG.commits);
      const files = list(ENG.files);
      const notes = list(ENG.notes);
      const links = list(ENG.links);
      if (!commits.length && !files.length && !notes.length && !links.length) return null;
      const part = (title, items) => (items.length ? [h("h3", {}, title), h("ul", {}, items)] : null);
      const counts = [commits.length ? plural(commits.length, "commit") : null, files.length ? plural(files.length, "file") : null].filter(Boolean).join(" · ");
      const el = h(
        "section",
        { class: "sec", id: "engineers", "aria-label": "For engineers" },
        h(
          "details",
          { class: "eng" },
          h("summary", {}, "For engineers", counts ? h("span", { class: "count" }, counts) : null),
          h(
            "div",
            { class: "eng-body" },
            part(
              "Commits",
              commits.map((c) =>
                h("li", {}, c.href ? h("a", { href: c.href, target: "_blank", rel: "noopener" }, h("code", {}, c.sha)) : h("code", {}, c.sha), " ", h("span", { html: md(c.subject) })),
              ),
            ),
            part(
              "Files",
              files.map((f) => h("li", {}, h("code", {}, f))),
            ),
            part(
              "Notes",
              notes.map((n) => h("li", { html: md(n) })),
            ),
            part(
              "Links",
              links.map((l) => h("li", {}, h("a", { href: l.href, target: "_blank", rel: "noopener" }, l.text ?? l.href))),
            ),
          ),
        ),
      );
      return { el, body: el, label: "For engineers" };
    }

    function readLocal(k) {
      try {
        return localStorage.getItem(k);
      } catch {
        return null;
      }
    }
    function writeLocal(k, v) {
      try {
        localStorage.setItem(k, v);
      } catch {}
    }
    function loadLocal() {
      try {
        const s = JSON.parse(readLocal(LOCAL) ?? "{}");
        for (const part of ["picks", "notes", "done", "ticks"]) Object.assign(state[part], s[part]);
      } catch {}
    }
    function saveLocal() {
      writeLocal(LOCAL, JSON.stringify({ picks: state.picks, notes: state.notes, done: state.done, ticks: state.ticks }));
    }

    function answerLine() {
      const picked = Q.filter((q) => state.picks[`q${q.n}`]).map((q) => `${q.n}${state.picks[`q${q.n}`]}`);
      const done = B.filter((b) => state.done[`b${b.n}`]).map((b) => b.n);
      const notes = [...Q.map((q) => [`${q.n}`, state.notes[`q${q.n}`]]), ...B.map((b) => [`blocker ${b.n}`, state.notes[`b${b.n}`]])]
        .filter(([, t]) => t?.trim())
        .map(([k, t]) => `${k}: ${t.trim()}`);
      let line = `Answers: ${picked.join(", ") || "none yet"}`;
      if (done.length) line += `; blockers done: ${done.join(", ")}`;
      if (notes.length) line += ` - ${notes.join("; ")}`;
      return line;
    }

    function pick(id, option) {
      state.picks[id] = option;
      saveLocal();
      refresh();
    }
    function markDone(id, done) {
      state.done[id] = done;
      saveLocal();
      refresh();
    }
    function setNote(id, text) {
      state.notes[id] = text.slice(0, 500);
      saveLocal();
      refresh();
    }
    function tick(id, done) {
      state.ticks[id] = done;
      saveLocal();
      refresh();
    }

    function say(text) {
      const msg = document.getElementById("answer-msg");
      if (msg) msg.textContent = text;
    }

    async function copyAnswers() {
      const text = answerLine();
      const out = document.getElementById("answer-copy");
      try {
        await navigator.clipboard.writeText(text);
        out.hidden = true;
        say(`Copied: ${text}`);
      } catch {
        out.hidden = false;
        out.value = text;
        out.focus();
        out.select();
        say("Copy the selected line with your keyboard.");
      }
    }

    function stateText(id) {
      if (id.startsWith("q")) return state.picks[id] ? `Picked ${state.picks[id]}` : "No answer yet";
      return state.done[id] ? "Done" : "Not done yet";
    }

    function refresh() {
      for (const q of Q) {
        const id = `q${q.n}`;
        for (const r of document.querySelectorAll(`input[name="${id}"]`)) r.checked = r.value === state.picks[id];
      }
      for (const b of B) {
        const box = document.getElementById(`b${b.n}-done`);
        if (box) box.checked = !!state.done[`b${b.n}`];
      }
      for (const id of [...Q.map((q) => `q${q.n}`), ...B.map((b) => `b${b.n}`)]) {
        const input = document.getElementById(`${id}-note`);
        if (input && document.activeElement !== input) input.value = state.notes[id] ?? "";
      }
      for (const f of FU) {
        const box = document.getElementById(`fu-${f.id}-done`);
        if (!box) continue;
        box.checked = !!state.ticks[f.id];
        box.closest(".fu")?.classList.toggle("is-done", box.checked);
      }
      const line = document.getElementById("answer-line");
      if (line) line.textContent = answerLine();
      document.getElementById("answers")?.classList.toggle("live", Object.values(state.picks).some(Boolean) || Object.values(state.done).some(Boolean));
      const kept = document.getElementById("answer-status");
      if (kept) kept.textContent = KEPT;
      for (const el of document.querySelectorAll("[data-state]")) {
        el.textContent = stateText(el.dataset.state);
        el.classList.toggle("is-set", !/^(No answer|Not done)/.test(el.textContent));
      }
    }

    function lightbox() {
      const dialog = document.getElementById("lightbox");
      document.addEventListener("click", (e) => {
        const shot = e.target.closest(".shot");
        if (!shot || typeof dialog.showModal !== "function") return;
        document.getElementById("lightbox-img").src = shot.dataset.full;
        document.getElementById("lightbox-img").alt = shot.dataset.caption;
        document.getElementById("lightbox-caption").textContent = shot.dataset.caption;
        dialog.showModal();
      });
      document.getElementById("lightbox-close").addEventListener("click", () => dialog.close());
      dialog.addEventListener("click", (e) => {
        if (e.target === dialog) dialog.close();
      });
    }

    // The section the reader is in lights up in the pills and the outline.
    let current = null;
    function spy() {
      const marks = [...document.querySelectorAll(".main .sec[id], .main .phase-group[id]")].filter((el) => !el.hidden && document.querySelector(`[data-spy="${el.id}"]`));
      let here = null;
      for (const el of marks) if (el.getBoundingClientRect().top < 120) here = el.id;
      if (here === current) return;
      current = here;
      const section = here?.startsWith("area-") ? "changed" : here;
      for (const a of document.querySelectorAll("[data-spy]")) {
        if (a.dataset.spy === here || a.dataset.spy === section) a.setAttribute("aria-current", "true");
        else a.removeAttribute("aria-current");
      }
      const pills = document.querySelector(".pills");
      const pill = pills?.querySelector(`[data-spy="${section}"]`);
      if (pill && pills.scrollWidth > pills.clientWidth) pills.scrollLeft = pill.offsetLeft - (pills.clientWidth - pill.offsetWidth) / 2;
    }

    function navLink(sec, counts) {
      const id = sec.el.id;
      return h("a", { href: `#${id}`, "data-spy": id }, h("span", {}, sec.label ?? sec.el.querySelector("h2")?.textContent), counts[id] ? h("span", { class: "n" }, counts[id]) : null);
    }

    function reveal() {
      const id = decodeURIComponent(location.hash.slice(1));
      const target = id && document.getElementById(id);
      if (!target) return;
      if (target.closest("[hidden]")) showFor("");
      target.scrollIntoView({ block: "start" });
    }

    function init() {
      const page = document.getElementById("page");
      const waits = (DATA.verdict === "decide" || DATA.verdict === "blocked") && DATA.lead !== "changes";
      const base = waits
        ? [decideSection, changedSection, trySection, extraSection, proofSection, shipSection, followupsSection, engineersSection]
        : [changedSection, trySection, extraSection, proofSection, decideSection, shipSection, followupsSection, engineersSection];
      const order = DATA.lead === "extra" ? [extraSection, ...base.filter((s) => s !== extraSection)] : base;
      const sections = order.map((build) => build()).filter(Boolean);
      const counts = {
        decide: Q.length + B.length || null,
        changed: CH.length || null,
        proof: PR.length ? `${tally("verified")}/${PR.length}` : null,
        followups: FU.length || null,
      };
      const nav = sections.length > 1;
      page.append(
        h(
          "div",
          { class: "main" },
          header(),
          glance(),
          nav ? h("nav", { class: "pills", "aria-label": "Sections" }, sections.map((sec) => navLink(sec, counts))) : null,
          sections.map((sec) => sec.el),
        ),
        nav
          ? h(
              "aside",
              { class: "rail" },
              h(
                "nav",
                { class: "outline", "aria-label": "On this page" },
                h("p", { class: "outline-head" }, "On this page"),
                h(
                  "ul",
                  {},
                  sections.map((sec) =>
                    h(
                      "li",
                      {},
                      navLink(sec, counts),
                      sec.el.id === "changed" && PHASES.length > 1
                        ? h(
                            "ul",
                            { class: "sub" },
                            PHASES.map((p) => h("li", {}, h("a", { href: `#${phaseId(p)}`, "data-spy": phaseId(p) }, p))),
                          )
                        : null,
                    ),
                  ),
                  h("li", {}, h("a", { class: "to-top", href: "#top" }, "Back to top")),
                ),
              ),
            )
          : null,
      );
      loadLocal();
      lightbox();
      refresh();
      if (FILTER) showFor(readLocal("handoff-for") ?? "");
      reveal();
      spy();
      let ticking = false;
      window.addEventListener(
        "scroll",
        () => {
          if (ticking) return;
          ticking = true;
          requestAnimationFrame(() => {
            ticking = false;
            spy();
          });
        },
        { passive: true },
      );
      window.addEventListener("hashchange", reveal);
    }

    init();
  })();
</script>
