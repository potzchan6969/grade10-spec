    function engineersSection() {
      const commits = list(ENG.commits);
      const files = list(ENG.files);
      const notes = list(ENG.notes);
      const links = list(ENG.links);
      if (!commits.length && !files.length && !notes.length && !links.length) return null;
      const part = (title, items) => (items.length ? [h("h3", {}, title), h("ul", {}, items)] : null);
      const counts = [commits.length ? plural(commits.length, "commit") : null, files.length ? plural(files.length, "file") : null].filter(Boolean).join(" · ");
      const el = h(
        "section",
        { class: "sec", id: "engineers", "aria-label": "For engineers" },
        h(
          "details",
          { class: "eng" },
          h("summary", {}, "For engineers", counts ? h("span", { class: "count" }, counts) : null),
          h(
            "div",
            { class: "eng-body" },
            part(
              "Commits",
              commits.map((c) =>
                h("li", {}, c.href ? h("a", { href: c.href, target: "_blank", rel: "noopener" }, h("code", {}, c.sha)) : h("code", {}, c.sha), " ", h("span", { html: md(c.subject) })),
              ),
            ),
            part(
              "Files",
              files.map((f) => h("li", {}, h("code", {}, f))),
            ),
            part(
              "Notes",
              notes.map((n) => h("li", { html: md(n) })),
            ),
            part(
              "Links",
              links.map((l) => h("li", {}, h("a", { href: l.href, target: "_blank", rel: "noopener" }, l.text ?? l.href))),
            ),
          ),
        ),
      );
      return { el, body: el, label: "For engineers" };
    }

    function readLocal(k) {
      try {
        return localStorage.getItem(k);
      } catch {
        return null;
      }
    }
    function writeLocal(k, v) {
      try {
        localStorage.setItem(k, v);
      } catch {}
    }
    function loadLocal() {
      try {
        const s = JSON.parse(readLocal(LOCAL) ?? "{}");
        for (const part of ["picks", "notes", "done", "ticks"]) Object.assign(state[part], s[part]);
      } catch {}
    }
    function saveLocal() {
      writeLocal(LOCAL, JSON.stringify({ picks: state.picks, notes: state.notes, done: state.done, ticks: state.ticks }));
    }

    function answerLine() {
      const picked = Q.filter((q) => state.picks[`q${q.n}`]).map((q) => `${q.n}${state.picks[`q${q.n}`]}`);
      const done = B.filter((b) => state.done[`b${b.n}`]).map((b) => b.n);
      const notes = [...Q.map((q) => [`${q.n}`, state.notes[`q${q.n}`]]), ...B.map((b) => [`blocker ${b.n}`, state.notes[`b${b.n}`]])]
        .filter(([, t]) => t?.trim())
        .map(([k, t]) => `${k}: ${t.trim()}`);
      let line = `Answers: ${picked.join(", ") || "none yet"}`;
      if (done.length) line += `; blockers done: ${done.join(", ")}`;
      if (notes.length) line += ` - ${notes.join("; ")}`;
      return line;
    }

    function pick(id, option) {
      state.picks[id] = option;
      saveLocal();
      refresh();
    }
    function markDone(id, done) {
      state.done[id] = done;
      saveLocal();
      refresh();
    }
    function setNote(id, text) {
      state.notes[id] = text.slice(0, 500);
      saveLocal();
      refresh();
    }
    function tick(id, done) {
      state.ticks[id] = done;
      saveLocal();
      refresh();
    }

    function say(text) {
      const msg = document.getElementById("answer-msg");
      if (msg) msg.textContent = text;
    }

    async function copyAnswers() {
      const text = answerLine();
      const out = document.getElementById("answer-copy");
      try {
        await navigator.clipboard.writeText(text);
        out.hidden = true;
        say(`Copied: ${text}`);
      } catch {
        out.hidden = false;
        out.value = text;
        out.focus();
        out.select();
        say("Copy the selected line with your keyboard.");
      }
    }

    function stateText(id) {
      if (id.startsWith("q")) return state.picks[id] ? `Picked ${state.picks[id]}` : "No answer yet";
      return state.done[id] ? "Done" : "Not done yet";
    }

    function refresh() {
      for (const q of Q) {
        const id = `q${q.n}`;
        for (const r of document.querySelectorAll(`input[name="${id}"]`)) r.checked = r.value === state.picks[id];
      }
      for (const b of B) {
        const box = document.getElementById(`b${b.n}-done`);
        if (box) box.checked = !!state.done[`b${b.n}`];
      }
      for (const id of [...Q.map((q) => `q${q.n}`), ...B.map((b) => `b${b.n}`)]) {
        const input = document.getElementById(`${id}-note`);
        if (input && document.activeElement !== input) input.value = state.notes[id] ?? "";
      }
      for (const f of FU) {
        const box = document.getElementById(`fu-${f.id}-done`);
        if (!box) continue;
        box.checked = !!state.ticks[f.id];
        box.closest(".fu")?.classList.toggle("is-done", box.checked);
      }
      const line = document.getElementById("answer-line");
      if (line) line.textContent = answerLine();
      document.getElementById("answers")?.classList.toggle("live", Object.values(state.picks).some(Boolean) || Object.values(state.done).some(Boolean));
      const kept = document.getElementById("answer-status");
      if (kept) kept.textContent = KEPT;
      for (const el of document.querySelectorAll("[data-state]")) {
        el.textContent = stateText(el.dataset.state);
        el.classList.toggle("is-set", !/^(No answer|Not done)/.test(el.textContent));
      }
    }

    function lightbox() {
      const dialog = document.getElementById("lightbox");
      document.addEventListener("click", (e) => {
        const shot = e.target.closest(".shot");
        if (!shot || typeof dialog.showModal !== "function") return;
        document.getElementById("lightbox-img").src = shot.dataset.full;
        document.getElementById("lightbox-img").alt = shot.dataset.caption;
        document.getElementById("lightbox-caption").textContent = shot.dataset.caption;
        dialog.showModal();
      });
      document.getElementById("lightbox-close").addEventListener("click", () => dialog.close());
      dialog.addEventListener("click", (e) => {
        if (e.target === dialog) dialog.close();
      });
    }

    // The section the reader is in lights up in the pills and the outline.
    let current = null;
    function spy() {
      const marks = [...document.querySelectorAll(".main .sec[id], .main .phase-group[id], .main .scope-band[id], .main .scope-group[id]")].filter(
        (el) => !el.hidden && document.querySelector(`[data-spy="${el.id}"]`),
      );
      let here = null;
      for (const el of marks) if (el.getBoundingClientRect().top < 120) here = el.id;
      if (here === current) return;
      current = here;
      const section = /^(area|group|scope)-/.test(here ?? "") ? "changed" : here;
      const band = here?.startsWith("scope-") ? document.getElementById(here)?.closest(".scope-band")?.id : null;
      const box = document.querySelector(".rail");
      const row = box?.querySelector(`.rail-row [data-spy="${here}"]`) ?? box?.querySelector(`.rail-secs [data-spy="${section}"]`);
      for (const a of document.querySelectorAll("[data-spy]")) {
        const inRail = !!a.closest(".rail");
        const on = inRail ? a === row : a.dataset.spy === here || a.dataset.spy === section || a.dataset.spy === band;
        if (on) a.setAttribute("aria-current", "true");
        else a.removeAttribute("aria-current");
        a.classList.toggle("within", inRail && a !== row && a.dataset.spy === section);
      }
      if (row) {
        const r = row.getBoundingClientRect();
        if (r.top < 0 || r.bottom > box.clientHeight) box.scrollTop += r.top - box.clientHeight / 3;
      }
      const pills = document.querySelector(".pills");
      const pill = pills?.querySelector(`[data-spy="${section}"]`);
      if (pill && pills.scrollWidth > pills.clientWidth) pills.scrollLeft = pill.offsetLeft - (pills.clientWidth - pill.offsetWidth) / 2;
    }

    function navLink(sec, counts) {
      const id = sec.el.id;
      return h("a", { href: `#${id}`, "data-spy": id }, h("span", {}, sec.label ?? sec.el.querySelector("h2")?.textContent), counts[id] ? h("span", { class: "n" }, counts[id]) : null);
    }

    // The contents rail, as the manual's nav: the page's sections, with What changed opening onto the manual's groups,
    // each a heading that folds, and their products under them. What the reader folded is kept for the next day's page.
    const NAV = "handoff-nav";
    const shut = (() => {
      try {
        const m = JSON.parse(readLocal(NAV) ?? "{}");
        return new Set(Array.isArray(m.shut) ? m.shut : []);
      } catch {
        return new Set();
      }
    })();
    const chevron = () => h("span", { class: "chev", "aria-hidden": "true", html: '<svg viewBox="0 0 16 16" width="12" height="12"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>' });

    function productRow(sc, cards) {
      return h(
        "li",
        { "data-box": "" },
        cards.map((c) => h("i", { hidden: true, "data-for": list(c.who).join("|"), "data-scope": c.scope ?? "" })),
        h(
          "div",
          { class: "rail-row" },
          h("a", { href: `#${scopeId(sc.id)}`, "data-spy": scopeId(sc.id) }, icon(sc.icon), h("span", {}, sc.title), h("span", { class: "n", "data-count": "" }, cards.length)),
          star(sc),
        ),
      );
    }

    function groupNav(g, scopes) {
      const cards = scopes.flatMap(([, c]) => c);
      if (g === ACROSS)
        return h(
          "li",
          { class: "rail-group", "data-group": g },
          cards.map((c) => h("i", { hidden: true, "data-for": list(c.who).join("|"), "data-scope": "" })),
          h("div", { class: "rail-row" }, h("a", { href: `#${groupId(g)}`, "data-spy": groupId(g) }, icon(ACROSS_ICON), h("span", {}, g), h("span", { class: "n", "data-count": "" }, cards.length))),
        );
      const panel = h("ul", { id: `rail-${groupId(g)}` }, scopes.map(([sc, c]) => productRow(sc, c)));
      const heading = h("button", { type: "button", class: "rail-heading", "aria-controls": panel.id }, h("span", {}, g), chevron());
      heading.onclick = () => {
        const open = heading.getAttribute("aria-expanded") !== "true";
        heading.setAttribute("aria-expanded", String(open));
        panel.hidden = !open;
        if (open) shut.delete(g);
        else shut.add(g);
        writeLocal(NAV, JSON.stringify({ shut: [...shut] }));
      };
      heading.setAttribute("aria-expanded", String(!shut.has(g)));
      panel.hidden = shut.has(g);
      return h("li", { class: "rail-group", "data-group": g }, heading, panel);
    }

    function railView() {
      if (!SCOPED) return null;
      return h(
        "div",
        { class: "rail-seg", role: "radiogroup", "aria-label": "Show the products" },
        h("label", {}, h("input", { type: "radio", name: "rail-areas", value: "all", onchange: () => showOnly(false) }), "All products"),
        h("label", {}, h("input", { type: "radio", name: "rail-areas", value: "mine", onchange: () => showOnly(true) }), "Following", h("span", { class: "n", id: "rail-follow-n" })),
      );
    }

    function rail(sections, counts) {
      const s = DATA.stamp ?? {};
      const when = DIGEST ? toDay(s.date) : null;
      return h(
        "aside",
        { class: "rail", id: "rail", "aria-label": "Contents" },
        h(
          "nav",
          {
            class: "outline",
            "aria-label": "On this page",
            onclick: (e) => {
              if (e.target.closest("a")) openRail(false);
            },
          },
          h(
            "div",
            { class: "rail-head" },
            h(
              "a",
              { class: "rail-home", href: "#top" },
              h("span", { class: "rail-kind" }, [KINDWORD[PAGE] ?? "Handoff", DIGEST ? s.branch : null].filter(Boolean).join(" · ")),
              h("span", { class: "rail-title" }, when ? dayText(when, true) : (DATA.title ?? "")),
            ),
            h("button", { type: "button", class: "rail-close", "aria-label": "Close the contents", onclick: () => openRail(false) }, "×"),
          ),
          railView(),
          h(
            "ul",
            { class: "rail-secs" },
            sections.map((sec) =>
              h(
                "li",
                {},
                navLink(sec, counts),
                sec.el.id === "changed" && SCOPED
                  ? h("ul", { class: "rail-tree" }, scopeTree(CH).map(([g, scopes]) => groupNav(g, scopes)))
                  : sec.el.id === "changed" && PHASES.length > 1
                    ? h("ul", { class: "rail-tree" }, PHASES.map((p) => h("li", {}, h("div", { class: "rail-row" }, h("a", { href: `#${phaseId(p)}`, "data-spy": phaseId(p) }, h("span", {}, p))))))
                    : null,
              ),
            ),
          ),
        ),
      );
    }

    function openRail(open) {
      document.body.classList.toggle("rail-open", open);
      for (const b of document.querySelectorAll(".rail-toggle")) b.setAttribute("aria-expanded", String(open));
      if (open) document.querySelector(".rail-close")?.focus();
      else if (document.activeElement?.closest(".rail")) document.querySelector(".rail-toggle")?.focus();
    }

    function reveal() {
      const id = decodeURIComponent(location.hash.slice(1));
      const target = id && document.getElementById(id);
      if (!target) return;
      if (target.closest("[hidden]")) showAll();
      target.scrollIntoView({ block: "start" });
    }

    function init() {
      const page = document.getElementById("page");
      const waits = (DATA.verdict === "decide" || DATA.verdict === "blocked") && DATA.lead !== "changes";
      const base = waits
        ? [decideSection, changedSection, trySection, extraSection, proofSection, shipSection, followupsSection, engineersSection]
        : [changedSection, trySection, extraSection, proofSection, decideSection, shipSection, followupsSection, engineersSection];
      const order = DATA.lead === "extra" ? [extraSection, ...base.filter((s) => s !== extraSection)] : base;
      const sections = order.map((build) => build()).filter(Boolean);
      const counts = {
        decide: Q.length + B.length || null,
        changed: CH.length || null,
        proof: PR.length ? `${tally("verified")}/${PR.length}` : null,
        followups: FU.length || null,
      };
      const nav = sections.length > 1;
      page.append(
        h(
          "div",
          { class: "main" },
          header(),
          glance(),
          nav
            ? h(
                "nav",
                { class: "pills", "aria-label": "Sections" },
                h("button", { type: "button", class: "rail-toggle", "aria-controls": "rail", "aria-expanded": "false", onclick: () => openRail(true) }, h("span", { "aria-hidden": "true" }, "☰"), "Contents"),
                sections.map((sec) => navLink(sec, counts)),
              )
            : null,
          sections.map((sec) => sec.el),
        ),
        nav ? rail(sections, counts) : null,
        nav ? h("div", { class: "rail-scrim", onclick: () => openRail(false) }) : null,
      );
      if (nav) document.body.classList.add("has-rail");
      loadLocal();
      lightbox();
      refresh();
      if (FILTER || SCOPED) {
        loadView();
        applyView();
      }
      reveal();
      spy();
      let ticking = false;
      window.addEventListener(
        "scroll",
        () => {
          if (ticking) return;
          ticking = true;
          requestAnimationFrame(() => {
            ticking = false;
            spy();
          });
        },
        { passive: true },
      );
      window.addEventListener("hashchange", reveal);
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && document.body.classList.contains("rail-open")) openRail(false);
      });
    }

    init();
  })();
</script>
