packages:
  - "apps/*"
  - "packages/*"
  # Exactly `tools/manual`, not `tools/*`: `tools/openspec-viewer` is a
  # submodule with its own pnpm workspace and must not join this one.
  - "tools/manual"
  # The OpenSpec store's readers, which `scripts/openspec` runs on.
  - "tools/openspec-store"
  # The relay: a Cloudflare Worker, deployed with wrangler as the manual is.
  - "tools/relay"
allowBuilds:
  esbuild: true
enableGlobalVirtualStore: true
# pnpm 11 installs before every `pnpm run` by default. Inside grade10, where
# the root install already populates this checkout's packages, that install
# brings in a second React and breaks grade10's tests. Install explicitly.
verifyDepsBeforeRun: false
# next-themes ships types that reference the React namespace without depending on
# @types/react. Under the global virtual store its package directory sits outside
# this workspace, so TypeScript cannot find those types by directory walk.
packageExtensions:
  next-themes:
    dependencies:
      "@types/react": "^19.2.17"
