name: full-planning
version: 1
description: Full planning workflow - proposal → specs → design → ui → tasks
artifacts:
  - id: proposal
    generates: proposal.md
    instruction: |
      Why, what changes, and what does not.
  - id: specs
    generates: specs/**/*.md
    instruction: |
      One delta per capability.
  - id: design
    generates: design.md
    instruction: |
      The technical design.
  - id: ui
    generates: ui.md
    instruction: |
      The visual plan.
  - id: tasks
    generates: tasks.md
    instruction: |
      The plan, group by group.
apply:
  instruction: Work the tasks.
