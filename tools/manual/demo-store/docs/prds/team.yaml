# Who the fixture store knows, and where a role is posted to.
#
# Shaped exactly as `docs/prds/team.yaml`: one entry per handle, one channel
# per role. Read by the manual's own snapshot as its `team` field — My turn
# reports `tester`'s hands and reads any other handle as unknown — and by the
# Node scripts under `scripts/openspec/` (the notify script, the digest, and a
# landing resolving `git config user.email`).
handles:
  tester:
    email: tester@example.com
    slack: U0TESTER
    roles: [pm, design, tech, qa, dev, release]
  other:
    email: other@example.com
    roles: [dev]
channels:
  pm: C0PLANNING
  design: C0DESIGN
  tech: C0TECH
  qa: C0QA
  dev: C0DEV
  release: C0RELEASE
