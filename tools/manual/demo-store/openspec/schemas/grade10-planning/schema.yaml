name: grade10-planning
version: 1
description: Grade10 planning workflow - proposal → specs → user journeys → test cases → ui design → tech design → tasks
artifacts:
  - id: proposal
    hand: product-manager
    required: true
    generates: proposal.md
    requires: []
    instruction: |
      Why, what changes, and what does not.
  - id: specs
    hand: product-manager
    required: true
    generates: specs/**/spec.md
    requires:
      - proposal
    instruction: |
      One delta per capability.
  - id: user-journeys
    hand: product-manager
    required: true
    generates: specs/**/user-journeys.md
    requires:
      - specs
    instruction: |
      Who walks the requirements.
  - id: test-cases
    hand: product-manager
    required: true
    generates: specs/**/feature-tcs.md
    requires:
      - user-journeys
    instruction: |
      QA's suite, derived from the journeys.
  - id: ui-design
    hand: designer
    required: false
    generates: ui-design.md
    requires:
      - specs
    instruction: |
      The visual plan.
  - id: tech-design
    hand: engineer
    required: false
    generates: tech-design.md
    requires:
      - specs
    instruction: |
      The technical design.
  - id: tasks
    hand: engineer
    required: true
    generates: tasks.md
    requires:
      - specs
    instruction: |
      The plan, group by group.
apply:
  instruction: Work the tasks.
