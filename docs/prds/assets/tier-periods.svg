<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" role="img" aria-labelledby="tier-periods-title tier-periods-description" data-diagram="tier-periods">
<title id="tier-periods-title">A member's three years of tier periods</title>
<desc id="tier-periods-description">Tier progress against time from January 2025 to April 2029. The Silver period from 2025/01/15 ends on 450 and progress returns to zero. 100 and then 400 reach 500 on 2026/03/01: the member is Gold and progress starts again at zero. 600 keeps Gold and the next Gold period renews at zero on 2027/03/01. That period ends at the close of 2028/03/01 on 480, short of 500, and the member drops to Silver from midnight on 2028/03/02, where 100 starts the climb again.</desc>
<style>
svg[data-diagram="tier-periods"]{--text:var(--foreground, light-dark(#242018, #f4eddf));--text-muted:var(--muted-foreground, light-dark(#6f6658, #b9ae9b));--grid:var(--border-subtle, light-dark(#d8d0c2, #39342a));--threshold:var(--primary, light-dark(#bb4c23, #dd6b3d));--silver-fill:light-dark(rgba(101, 91, 75, 0.09), rgba(126, 115, 96, 0.18));--silver-stroke:light-dark(#746b5e, #b8ad99);--gold-fill:light-dark(rgba(157, 103, 31, 0.14), rgba(170, 119, 49, 0.22));--gold-stroke:light-dark(#9a671f, #d8ad68);font-family:inherit}
svg[data-diagram="tier-periods"] text{font-size:12px;fill:var(--text)}
svg[data-diagram="tier-periods"] .muted{fill:var(--text-muted)}
svg[data-diagram="tier-periods"] .band-label{font-weight:600}
svg[data-diagram="tier-periods"] .silver{fill:var(--silver-fill);stroke:var(--silver-stroke)}
svg[data-diagram="tier-periods"] .gold{fill:var(--gold-fill);stroke:var(--gold-stroke)}
svg[data-diagram="tier-periods"] .grid{stroke:var(--grid);fill:none}
svg[data-diagram="tier-periods"] .end{stroke:var(--grid);stroke-dasharray:3 3}
svg[data-diagram="tier-periods"] .threshold{stroke:var(--threshold);stroke-dasharray:6 4;fill:none}
svg[data-diagram="tier-periods"] .threshold-label{fill:var(--threshold);font-weight:600}
svg[data-diagram="tier-periods"] .progress{stroke:var(--text);stroke-width:2;fill:none;stroke-linejoin:round}
svg[data-diagram="tier-periods"] .dot{fill:var(--text)}
svg[data-diagram="tier-periods"] .reset{fill:var(--mask, light-dark(#fbf8f1, #231f18));stroke:var(--text);stroke-width:2}
</style>
<!-- x = 60 + 20 per month from 2025/01/01; y = 230 - progress × 0.2333 -->
<rect class="silver" x="69.3" y="20" width="240" height="32" rx="4"/>
<text class="band-label" x="79" y="41">Silver · ends on 450</text>
<rect class="silver" x="309.3" y="20" width="30.7" height="32" rx="4"/>
<rect class="gold" x="340" y="20" width="240" height="32" rx="4"/>
<text class="band-label" x="350" y="41">Gold · kept on 600</text>
<rect class="gold" x="580" y="20" width="240" height="32" rx="4"/>
<text class="band-label" x="590" y="41">Gold · ends on 480</text>
<rect class="silver" x="820" y="20" width="240" height="32" rx="4"/>
<text class="band-label" x="830" y="41">Silver</text>

<line class="end" x1="309.3" y1="52" x2="309.3" y2="230"/>
<line class="end" x1="340" y1="52" x2="340" y2="230"/>
<line class="end" x1="580" y1="52" x2="580" y2="230"/>
<line class="end" x1="820" y1="52" x2="820" y2="230"/>
<line class="end" x1="1060" y1="52" x2="1060" y2="230"/>

<line class="threshold" x1="60" y1="113.3" x2="1080" y2="113.3"/>
<text class="threshold-label" x="54" y="117.3" text-anchor="end">500</text>
<line class="grid" x1="60" y1="230" x2="1080" y2="230"/>
<text class="muted" x="54" y="234" text-anchor="end">0</text>

<path class="progress" d="M69.3 230 H86 V171.7 H260 V125 H309.3 V230 H328.7 V206.7 H340 V113.3 V230 H472.7 V90 H580 V230 H800 V118 H820 V230 H821.3 V206.7 H1060"/>

<circle class="dot" cx="86" cy="171.7" r="3.5"/><text x="90" y="164">+250</text>
<circle class="dot" cx="260" cy="125" r="3.5"/><text x="256" y="142" text-anchor="end">+200 · 450, fifty short</text>
<circle class="dot" cx="328.7" cy="206.7" r="3.5"/><text x="324" y="200" text-anchor="end">+100</text>
<circle class="dot" cx="340" cy="113.3" r="3.5"/><text x="346" y="104">+400 · 500 → Gold</text>
<circle class="dot" cx="472.7" cy="90" r="3.5"/><text x="478" y="84">+600 · Gold is kept</text>
<circle class="dot" cx="800" cy="118" r="3.5"/><text x="794" y="110" text-anchor="end">+480 · twenty short</text>
<circle class="dot" cx="821.3" cy="206.7" r="3.5"/><text x="828" y="203">+100 at 1× again</text>

<circle class="reset" cx="309.3" cy="230" r="3.5"/><text class="muted" x="303" y="248" text-anchor="end">new Silver period · 0</text>
<circle class="reset" cx="340" cy="230" r="3.5"/><text class="muted" x="346" y="248">Gold from 0</text>
<circle class="reset" cx="580" cy="230" r="3.5"/><text class="muted" x="586" y="248">renews · 0</text>
<circle class="reset" cx="820" cy="230" r="3.5"/><text class="muted" x="826" y="248">drops to Silver · 0</text>

<g class="muted">
<line class="grid" x1="60" y1="262" x2="1080" y2="262"/>
<line class="grid" x1="60" y1="258" x2="60" y2="266"/><text class="muted" x="60" y="284">2025</text>
<line class="grid" x1="300" y1="258" x2="300" y2="266"/><text class="muted" x="300" y="284">2026</text>
<line class="grid" x1="540" y1="258" x2="540" y2="266"/><text class="muted" x="540" y="284">2027</text>
<line class="grid" x1="780" y1="258" x2="780" y2="266"/><text class="muted" x="780" y="284">2028</text>
<line class="grid" x1="1020" y1="258" x2="1020" y2="266"/><text class="muted" x="1020" y="284">2029</text>
</g>
</svg>
