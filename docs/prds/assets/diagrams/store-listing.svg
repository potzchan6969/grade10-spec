svg[data-diagram="store-listing"] .a-security{stroke: var(--security-stroke); fill: none; stroke-dasharray: 5,5;}
svg[data-diagram="store-listing"] .a-dashed{stroke: var(--database-stroke); fill: none; stroke-dasharray: 4,4;}
svg[data-diagram="store-listing"] .m-default{fill: var(--arrow);}
