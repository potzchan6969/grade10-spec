svg[data-diagram="shopify-order-pipeline"] .a-dashed{stroke: var(--database-stroke); fill: none; stroke-dasharray: 4,4;}
svg[data-diagram="shopify-order-pipeline"] .m-default{fill: var(--arrow);}
svg[data-diagram="shopify-order-pipeline"] .m-emphasis{fill: var(--arrow-emphasis);}
svg[data-diagram="shopify-order-pipeline"] .m-security{fill: var(--security-stroke);}
svg[data-diagram="shopify-order-pipeline"] .m-dashed{fill: var(--database-stroke);}
svg[data-diagram="shopify-order-pipeline"] .c-grid{stroke-dasharray: 1 4; opacity: 0.48;}
svg[data-diagram="shopify-order-pipeline"] .c-lane{fill: var(--lane-fill); stroke: var(--lane-stroke); stroke-dasharray: 6,6;}
</style>
