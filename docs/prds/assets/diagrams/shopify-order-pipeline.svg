svg[data-diagram="shopify-order-pipeline"] .t-messagebus{fill: var(--messagebus-stroke);}
svg[data-diagram="shopify-order-pipeline"] .semantic-sigil{fill: none; stroke: currentColor; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; opacity: 0.76; pointer-events: none;}
