name: Pages

# A pull request that adds or changes an HTML page under openspec/changes
# uploads each one to the CI artifacts bucket, served behind the company's
# Cloudflare login, and keeps one comment with the links.
# `gh workflow run pages -f pr=<n>` publishes on demand.

on:
  pull_request:
    paths:
      - "openspec/changes/**/*.html"
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number whose pages to publish
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  BUCKET: 9gag-ci-artifacts
  HOST: https://ci-artifacts.9gaginc.com/s3
  ACCESS_LOGIN: https://9gaginc.cloudflareaccess.com/cdn-cgi/access/login/ci-artifacts.9gaginc.com

jobs:
  publish:
    name: Publish review pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      # The pull request's files are data: they sit in pr/ with no credentials.
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number || inputs.pr }}/head
          path: pr
          persist-credentials: false

      - name: Require AWS keys
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::The AWS keys are empty here. A pull request from a fork gets no secrets; publish it with workflow_dispatch from a branch of this repository."
            exit 1
          fi

      # A page is private to the company. Uploading to a host that Access does
      # not guard would publish it to anyone with the link.
      - name: Require Cloudflare Access on the host
        run: |
          location=$(curl -sS -o /dev/null -w '%{redirect_url}' "$HOST/grade10-spec/pr-$PR/")
          case "$location" in
            "$ACCESS_LOGIN"*) ;;
            *) echo "::error::$HOST answered without the company's Cloudflare Access login."; exit 1 ;;
          esac

      # Only a regular file the pull request commits is a page: a symlink would
      # upload whatever it points at.
      - name: Upload
        run: |
          set -o pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | select(.status != "removed") | .filename' \
            | { grep -E '^openspec/changes/.+\.html$' || true; } > pages.txt
          : > links.md
          while read -r path; do
            [ "$(git -C pr ls-files -s -- "$path" | cut -d' ' -f1)" = 100644 ] || { echo "::warning::$path is not a regular file; skipped."; continue; }
            key="grade10-spec/pr-$PR/$path"
            aws s3 cp "pr/$path" "s3://$BUCKET/$key" --content-type "text/html; charset=utf-8" --cache-control "no-store" --only-show-errors
            echo "- [\`$path\`]($HOST/$(jq -rn --arg k "$key" '$k | split("/") | map(@uri) | join("/")'))" >> links.md
          done < pages.txt
          if [ ! -s links.md ]; then echo "No HTML page under openspec/changes in #$PR."; exit 0; fi
          cat links.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the links
        run: |
          [ -s links.md ] || exit 0
          marker='<!-- pages-workflow -->'
          {
            echo "$marker"
            echo "**Review pages** - behind the company's Cloudflare login, uploaded from \`$(git -C pr rev-parse --short=9 HEAD)\`:"
            echo
            cat links.md
          } > comment.md
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md >/dev/null
          else
            gh pr comment "$PR" --body-file comment.md
          fi
