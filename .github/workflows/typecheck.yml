name: Typecheck

# The push that ticks a task group carries a change's plan alone, and nothing
# here reads one; the template of the same name is code the tests read, so
# the filter names the changes' tree. `scripts/openspec/workflows.test.mjs`
# holds it there.
on:
  push:
    branches: [main]
    paths-ignore:
      - "openspec/changes/**/tasks.md"
  pull_request:
    paths-ignore:
      - "openspec/changes/**/tasks.md"

permissions:
  contents: read

concurrency:
  group: ci-typecheck-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.14.1

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript compiler
        run: pnpm run typecheck
