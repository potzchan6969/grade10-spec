name: Run sheet

# Dispatch only, and deliberately.
#
# The job writes a tab into a spreadsheet people mark by hand, so a person
# decides when it moves. There is no push or schedule trigger: a run tab is
# made for a pass somebody is about to walk, and a run nobody asked for is a
# tab nobody marks.
#
# A fork cannot reach this: `workflow_dispatch` needs write access on the
# repository itself, and the OIDC provider behind the token is bound to
# `9gag/grade10-spec`.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Print a trial, finalize it, cancel finalization, or copy a merged run"
        type: choice
        default: print
        options: [print, finalize, reopen, copy]
      run_id:
        description: "Run id for finalize, reopen or copy"
        type: string
      confirmed:
        description: "Printed fingerprint confirmed by a human"
        type: string
      exclusions:
        description: 'Intentional exclusions as JSON [{"id":"...","reason":"..."}]'
        type: string
      name:
        description: "Run name — the tab becomes <id>-<slug of this>"
        required: false
        type: string
      selection:
        description: "What was asked for, recorded on the Summary row"
        required: false
        type: string
      cases:
        description: "Case ids, comma or newline separated (wins over the filters)"
        required: false
        type: string
      suites:
        description: "Suites filter — smoke, regression, release, exploratory"
        required: false
        type: string
      priority:
        description: "Priority filter — high, medium, low"
        required: false
        type: string
      level:
        description: "Level filter — feature, domain, product, platform"
        required: false
        type: string
      changed_since:
        description: "Select whole suites affected since this source commit"
        type: string
      scope:
        description: "Only read suites whose path contains this"
        required: false
        type: string
      env:
        description: "Tester target environment: staging-1, staging-2, uat, preview or prod; independent of print target"
        required: false
        default: "staging-1"
        type: string
      include_draft:
        description: "Also take draft cases (stone-grey in the tab)"
        required: false
        default: false
        type: boolean
      include_automated:
        description: "Take cases an automated test already covers (default yes)"
        required: false
        default: true
        type: boolean
      sandbox:
        description: "Print target: Sandbox Sheet when true, PROD Sheet when false"
        required: false
        default: false
        type: boolean
      source_ref:
        description: "Sandbox-only TC source branch or SHA; production always uses latest main"
        required: false
        type: string
      overwrite:
        description: "Rewrite this run id's tab and Summary block (same id)"
        required: false
        type: string
      dry_run:
        description: "Print the selection and write nothing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  statuses: write
  id-token: write

# Run ids come from the Summary tab, so two runs may not interleave.
concurrency:
  group: tcs-run-sheet
  cancel-in-progress: false

env:
  NODE_VERSION: 24.14.1

jobs:
  run-sheet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Say which piece of setup is missing, rather than failing later inside
      # Google's auth with a message about an audience nobody configured.
      - name: Check the repository is configured
        if: ${{ !inputs.dry_run }}
        env:
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          SHEET: ${{ vars.TCS_SHEET_ID }}
          SANDBOX_SHEET: ${{ vars.TCS_SHEET_SANDBOX_ID }}
          SANDBOX: ${{ inputs.sandbox }}
        run: |
          missing=""
          [ -n "$PROVIDER" ] || missing="$missing GCP_WORKLOAD_IDENTITY_PROVIDER"
          [ -n "$ACCOUNT" ] || missing="$missing GCP_SERVICE_ACCOUNT"
          if [ "$SANDBOX" = "true" ]; then
            [ -n "$SANDBOX_SHEET" ] || missing="$missing TCS_SHEET_SANDBOX_ID"
          else
            [ -n "$SHEET" ] || missing="$missing TCS_SHEET_ID"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Repository variables not set:$missing"
            echo "Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi

      # The selection reaches the script through a file, so a long id list is
      # not a shell argument and nothing in it is interpolated.
      - name: Collect the selection
        env:
          CASES: ${{ inputs.cases }}
          EXCLUSIONS: ${{ inputs.exclusions }}
        run: |
          printf '%s' "$CASES" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
            | grep -v '^$' > /tmp/cases.txt || true
          echo "picked $(wc -l < /tmp/cases.txt) explicit ids"
          printf '%s' "$EXCLUSIONS" > /tmp/exclusions.json

      - name: Authenticate to Google
        if: ${{ !inputs.dry_run }}
        uses: google-github-actions/auth@v2
        id: auth
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets

      - name: Write the run tab
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          TCS_SHEET_ID: ${{ vars.TCS_SHEET_ID }}
          TCS_SHEET_SANDBOX_ID: ${{ vars.TCS_SHEET_SANDBOX_ID }}
          RUN_NAME: ${{ inputs.name }}
          ACTION: ${{ inputs.action }}
          RUN_ID: ${{ inputs.run_id }}
          CONFIRMED: ${{ inputs.confirmed }}
          SELECTION: ${{ inputs.selection }}
          RUN_ENV: ${{ inputs.env }}
          SUITES: ${{ inputs.suites }}
          PRIORITY: ${{ inputs.priority }}
          LEVEL: ${{ inputs.level }}
          SCOPE: ${{ inputs.scope }}
          CHANGED_SINCE: ${{ inputs.changed_since }}
          SOURCE_REF: ${{ inputs.source_ref }}
          INCLUDE_DRAFT: ${{ inputs.include_draft }}
          INCLUDE_AUTOMATED: ${{ inputs.include_automated }}
          SANDBOX: ${{ inputs.sandbox }}
          OVERWRITE: ${{ inputs.overwrite }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # `if` rather than `&&`: the default shell is `bash -e`, and a false
          # test on an empty input would end the step rather than skip a flag.
          set -- --env "${RUN_ENV:-staging-1}" --record-output .run-sheet-output/run-record.json
          if [ -s /tmp/exclusions.json ]; then set -- "$@" --exclusions-file /tmp/exclusions.json; fi
          if [ -n "$SOURCE_REF" ]; then set -- "$@" --source-ref "$SOURCE_REF"; fi
          if [ -n "$CHANGED_SINCE" ]; then set -- "$@" --changed-since "$CHANGED_SINCE"; fi
          if [ -n "$RUN_NAME" ]; then set -- "$@" --name "$RUN_NAME"; fi
          if [ -n "$CONFIRMED" ]; then set -- "$@" --confirmed "$CONFIRMED"; fi
          case "${ACTION:-print}" in
            print) ;;
            finalize) set -- "$@" --finalize "$RUN_ID" ;;
            reopen) set -- "$@" --reopen "$RUN_ID" ;;
            copy) set -- "$@" --copy-run "$RUN_ID" ;;
          esac
          if [ -n "$SELECTION" ]; then set -- "$@" --selection "$SELECTION"; fi
          if [ -s /tmp/cases.txt ]; then set -- "$@" --cases-file /tmp/cases.txt; fi
          if [ -n "$SUITES" ]; then set -- "$@" --suites "$SUITES"; fi
          if [ -n "$PRIORITY" ]; then set -- "$@" --priority "$PRIORITY"; fi
          if [ -n "$LEVEL" ]; then set -- "$@" --level "$LEVEL"; fi
          if [ -n "$SCOPE" ]; then set -- "$@" --scope "$SCOPE"; fi
          if [ "$INCLUDE_DRAFT" = "true" ]; then set -- "$@" --include-draft; fi
          if [ "$INCLUDE_AUTOMATED" = "true" ]; then set -- "$@" --include-automated; fi
          if [ "$INCLUDE_AUTOMATED" = "false" ]; then set -- "$@" --exclude-automated; fi
          if [ "$SANDBOX" = "true" ]; then set -- "$@" --sandbox; fi
          if [ -n "$OVERWRITE" ]; then set -- "$@" --overwrite "$OVERWRITE"; fi
          if [ "$DRY_RUN" = "true" ]; then set -- "$@" --dry-run; fi
          set -o pipefail
          node scripts/openspec/run-sheet.mjs "$@" | tee /tmp/run-sheet.out

      - name: Upload the run record
        if: ${{ success() && !inputs.sandbox && !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: run-record
          path: .run-sheet-output/run-record.json
          if-no-files-found: error

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Run sheet"
            echo
            echo '```'
            tail -n 40 /tmp/run-sheet.out 2>/dev/null || echo "no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
