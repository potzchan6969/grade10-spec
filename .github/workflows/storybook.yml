name: Storybook

# Publishes the workbench Storybook (apps/preview/.storybook-workbench) to
# the staging Cloudflare account. That config is the combined view: preview
# page assemblies + @grade10/ui + @grade10/design-system.
# Local equivalent: pnpm run storybook:workbench
#
# URL:
#   https://storybook.grade10-stg.com
#
# One-time ops:
# - Repo secret CLOUDFLARE_API_TOKEN_QA must be available here (same staging
#   token grade10 uses). Org secrets may need this repo added to their allowlist.
# - Confirm Cloudflare Access covers this custom domain if you gate it.

on:
  push:
    branches: [main]
    paths:
      - "apps/preview/**"
      - "packages/design-system/**"
      - "packages/ui/**"
      - ".github/workflows/storybook.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: storybook-staging
  cancel-in-progress: true

env:
  NODE_VERSION: 24.14.1
  # Pin so CI does not need a lockfile entry for wrangler.
  WRANGLER_VERSION: 4.120.0

jobs:
  deploy:
    name: Deploy workbench Storybook → staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_QA }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require Cloudflare token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN_QA is empty. Grant this repository the staging Cloudflare token (same secret grade10 uses)."
            exit 1
          fi

      - name: Build workbench Storybook
        run: pnpm run storybook:build:workbench

      - name: Deploy Storybook
        working-directory: apps/preview
        run: pnpm dlx wrangler@${{ env.WRANGLER_VERSION }} deploy -c wrangler.storybook.jsonc

      - name: Find merged pull request
        id: merged-pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pullRequests } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            const pullRequest = pullRequests.find(({ merged_at }) => merged_at);
            if (!pullRequest) return;

            core.setOutput("title", pullRequest.title);
            core.setOutput("url", pullRequest.html_url);

      - name: Find changed stories
        id: changed-pages
        run: |
          node scripts/storybook/changed-page-links.mjs \
            --base "${{ github.event.before }}" \
            --head "${{ github.sha }}" \
            --commit-url "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}" \
            --merged-pr-title "${{ steps.merged-pr.outputs.title }}" \
            --merged-pr-url "${{ steps.merged-pr.outputs.url }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Notify Slack about changed pages
        if: steps.changed-pages.outputs.has-pages == 'true'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: ${{ vars.SLACK_CHANNEL_ID }}
          payload: ${{ steps.changed-pages.outputs.payload }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      - name: Summary
        run: |
          {
            echo "## Storybook workbench → staging"
            echo
            echo "https://storybook.grade10-stg.com"
            echo
            echo "Combined view: preview pages + UI + design-system (\`pnpm storybook:workbench\`)."
            echo
            echo "Ref: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
