name: Checkpoint digest

# The checkpoint-digest skill's publish.mjs force-pushes the day pages a run
# drew, their shots and the run's range to digest/<branch>, under .digest/ on
# top of main, and that push starts this run, so a session needs no gh and no
# token. It uploads each day to the e2e reports bucket, posts each day's new
# changes to the digest channel, and only then moves refs/checkpoints/<branch>
# to the commit the run covers, with a lease on the value the run read. A run
# that fails before the move leaves the checkpoint where it was, so the next
# run redraws the same days and posts the same changes.

on:
  push:
    branches: ["digest/**"]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch whose digest/<branch> page to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: checkpoint-digest-${{ inputs.branch && format('digest/{0}', inputs.branch) || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.14.1
  BUCKET: ${{ vars.E2E_REPORTS_R2_BUCKET || 'acetrader-e2e-reports' }}
  HOST: ${{ vars.E2E_REPORTS_BASE_URL || 'https://e2e-reports.memeland-qa.9gaginc.com' }}
  ACCESS_LOGIN: https://memeland-qa.cloudflareaccess.com/cdn-cgi/access/login/e2e-reports.memeland-qa.9gaginc.com

jobs:
  publish:
    name: Publish, post and move the checkpoint
    # A deleted digest branch is a push too, with nothing to publish.
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.E2E_REPORTS_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.E2E_REPORTS_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ secrets.E2E_REPORTS_R2_ACCOUNT_ID }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL: ${{ vars.SLACK_CHANNEL_ID }}
      GH_TOKEN: ${{ github.token }}
      DIGEST_REF: ${{ inputs.branch || github.ref_name }}
    steps:
      # Full history: the move pushes the covered commit, which must be here.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || format('digest/{0}', inputs.branch) }}
          path: page
          sparse-checkout: .digest
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Require the keys and the channel
        run: |
          missing=""
          [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ] && [ -n "$R2_ACCOUNT_ID" ] || missing="$missing E2E_REPORTS_R2_*"
          [ -n "$SLACK_BOT_TOKEN" ] || missing="$missing SLACK_BOT_TOKEN"
          [ -n "$SLACK_CHANNEL" ] || missing="$missing vars.SLACK_CHANNEL_ID"
          if [ -n "$missing" ]; then
            echo "::error::Not configured:$missing"
            exit 1
          fi

      - name: Read the range
        run: |
          BRANCH="${DIGEST_REF#digest/}"
          export BRANCH
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          node -e '
            const range = require("./page/.digest/range.json");
            if (range.branch !== process.env.BRANCH) throw new Error(`the pages cover ${range.branch}, not ${process.env.BRANCH}`);
            const env = [`SAVED=${range.saved}`, `TO=${range.to}`];
            require("fs").appendFileSync(process.env.GITHUB_ENV, env.join("\n") + "\n");
          '
          echo "PREFIX=reports/grade10-spec/digest/${BRANCH//\//-}" >> "$GITHUB_ENV"
          echo "ENDPOINT=https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" >> "$GITHUB_ENV"

      # A page is the team's. Uploading to a host that Access does not guard
      # would publish it to anyone with the link.
      - name: Require Cloudflare Access on the host
        run: |
          location=$(curl -sS -o /dev/null -w '%{redirect_url}' "$HOST/$PREFIX/index.html")
          case "$location" in
            "$ACCESS_LOGIN"*) ;;
            *) echo "::error::$HOST answered without the team's Cloudflare Access login."; exit 1 ;;
          esac

      # A day's folder is replaced whole, so a redrawn day keeps no shot it
      # dropped.
      - name: Upload each day
        run: |
          for day in page/.digest/*/; do
            date=$(basename "$day")
            aws s3 sync "$day" "s3://$BUCKET/$PREFIX/$date" --endpoint-url "$ENDPOINT" \
              --exclude "digest.json" --delete --no-follow-symlinks \
              --cache-control "no-store" --only-show-errors
          done

      # One link per branch: its index.html opens the newest day, and every
      # day's bar reads days.json to reach the days before and after it. A list
      # that cannot be read for any reason but its absence stops the run, so a
      # failed read never starts the days over.
      - name: Put the days in the branch's list
        run: |
          if found=$(aws s3api head-object --bucket "$BUCKET" --key "$PREFIX/days.json" --endpoint-url "$ENDPOINT" 2>&1); then
            aws s3 cp "s3://$BUCKET/$PREFIX/days.json" days.json --endpoint-url "$ENDPOINT" --only-show-errors
          elif grep -q -E '\(404\)|Not Found' <<<"$found"; then
            echo '{"days":[]}' > days.json
          else
            echo "$found"
            exit 1
          fi
          node .claude/skills/checkpoint-digest/scripts/days.mjs days.json page/.digest/*/digest.json --out days
          aws s3 cp days/days.json "s3://$BUCKET/$PREFIX/days.json" --endpoint-url "$ENDPOINT" \
            --content-type application/json --cache-control "no-store" --only-show-errors
          aws s3 cp days/index.html "s3://$BUCKET/$PREFIX/index.html" --endpoint-url "$ENDPOINT" \
            --content-type "text/html; charset=utf-8" --cache-control "no-store" --only-show-errors
          echo "LATEST=$HOST/$PREFIX/index.html" >> "$GITHUB_ENV"

      # One post per day the run brought a change to; a day with none posts
      # nothing.
      - name: Post what the run brought
        run: |
          printf 'Every day: %s\n' "$LATEST" >> "$GITHUB_STEP_SUMMARY"
          for day in page/.digest/*/; do
            date=$(basename "$day")
            url="$HOST/$PREFIX/$date/index.html"
            node .claude/skills/checkpoint-digest/scripts/slack.mjs "$day/digest.json" --url "$url" --latest "$LATEST" --send
            printf '\n%s: %s\n' "$date" "$url" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Move the checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node .claude/skills/checkpoint-digest/scripts/checkpoint.mjs advance \
            --branch "$BRANCH" --to "$TO" --from "$SAVED"

      - name: Delete the page branch
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/digest/$BRANCH"
