name: Manual

# Publishes the Grade10 Manual (apps/manual) to workers.dev on the staging
# Cloudflare account. Every push to main rebuilds the snapshot from the store
# and redeploys, so the hosted manual is exactly as fresh as the data — all
# state lives in commits.
# Local equivalent: pnpm manual:build && wrangler deploy -c apps/manual/wrangler.jsonc
#
# One-time ops:
# - Repo secret CLOUDFLARE_API_TOKEN_QA (same staging token Storybook uses).
# - Confirm Cloudflare Access covers this workers.dev host if you gate
#   *.memeland-qa.workers.dev.

on:
  push:
    branches: [main]
    paths:
      - "apps/manual/**"
      - "manual/**"
      - "openspec/**"
      - "packages/design-system/**"
      - "packages/ui/**"
      - ".design-sync/**"
      - ".github/workflows/manual.yml"
      - "package.json"
  # Design sync dispatches this after committing a changed report. A push made
  # with the default GITHUB_TOKEN triggers no workflow, so the paths entry above
  # cannot carry the nightly's verdict on its own — that is what left a
  # designer-side rename waiting for the next unrelated engineer push.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-staging
  cancel-in-progress: true

env:
  NODE_VERSION: 24.14.1
  WRANGLER_VERSION: 4.120.0
  SLACK_NOTI_CHANNEL: C045K1QJVQT # web3-github
  SLACK_NOTI_FOOTER: ${{ github.repository }} | ${{ github.head_ref || github.ref_name }} | <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|view logs>
  SLACK_NOTI_FOOTER_ICON: https://slack-imgs.com/?c=1&o1=wi32.he32.si&url=https%3A%2F%2Fslack.github.com%2Fstatic%2Fimg%2Ffavicon-neutral.png

jobs:
  deploy:
    name: Deploy manual → staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_QA }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require Cloudflare token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN_QA is empty. Grant this repository the staging Cloudflare token (same secret Storybook uses)."
            exit 1
          fi

      - name: Check the manual
        run: pnpm run check:manual

      - name: Build
        run: pnpm run manual:build

      - name: Deploy
        working-directory: apps/manual
        run: pnpm dlx wrangler@${{ env.WRANGLER_VERSION }} deploy -c wrangler.jsonc

      - name: Summary
        run: |
          {
            echo "## Grade10 Manual → staging (workers.dev)"
            echo
            echo "https://grade10-manual.memeland-qa.workers.dev"
            echo
            echo "Snapshot baked from this commit's store state."
            echo
            echo "Ref: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Last, so it speaks for every step above it. Pages are edited straight
      # to main, so a failed deploy freezes the site while the store moves on
      # — and nobody watches the Actions tab for that.
      - name: Notify Slack about a failed deploy
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: ${{ env.SLACK_NOTI_CHANNEL }}
          payload: |
            {
              "attachments": [
                {
                  "mrkdwn_in": ["text"],
                  "color": "#d73a49",
                  "fallback": "The Grade10 Manual deploy failed.",
                  "pretext": ":rotating_light: The Grade10 Manual deploy failed — the hosted manual is frozen until it is green",
                  "text": "Branch: *`${{ github.ref_name }}`*\nCommit: *`${{ github.sha }}`*",
                  "footer": "${{ env.SLACK_NOTI_FOOTER }}",
                  "footer_icon": "${{ env.SLACK_NOTI_FOOTER_ICON }}"
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
