name: Manual

# Publishes the Grade10 Manual (tools/manual) to https://spec.grade10-stg.com
# on the staging Cloudflare account. Every push to main rebuilds the snapshot
# from the store and redeploys, so the hosted manual is exactly as fresh as
# the data — all state lives in commits.
#
# The OpenSpec viewer rides along under /openspec/: the same page `pnpm spec:view`
# serves, written by the pinned submodule as files into dist/openspec with every
# answer it would give filed as JSON beside it. It needs the openspec CLI, which
# the viewer resolves the store through, and the store's full history, which
# dates every document and every claim on the page.
# Local equivalent: pnpm manual:build && wrangler deploy -c tools/manual/wrangler.jsonc
#
# One-time ops:
# - Repo secret CLOUDFLARE_API_TOKEN_QA (same staging token Storybook uses).
# - Confirm Cloudflare Access covers spec.grade10-stg.com if you gate
#   the staging zone.
#
# The hosted site is static assets only, always read-only — editing happens
# against a local dev server, never here.

on:
  push:
    branches: [main]
    paths:
      - "tools/manual/**"
      - "tools/openspec-viewer"
      - "scripts/openspec-viewer/**"
      - "docs/prds/**"
      - "docs/references/**"
      - "openspec/**"
      - "packages/design-system/**"
      - "packages/ui/**"
      - ".design-sync/**"
      - ".github/workflows/manual.yml"
      - "package.json"
  # Design sync dispatches this after committing a changed report. A push made
  # with the default GITHUB_TOKEN triggers no workflow, so the paths entry above
  # cannot carry the nightly's verdict on its own — that is what left a
  # designer-side rename waiting for the next unrelated engineer push.
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: manual-staging
  cancel-in-progress: true

env:
  NODE_VERSION: 24.14.1
  WRANGLER_VERSION: 4.120.0
  # Must match the `openspec` script in package.json;
  # scripts/openspec/openspec-version.test.mjs holds the three together.
  OPENSPEC_VERSION: 1.8.0

jobs:
  deploy:
    name: Deploy manual → staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_QA }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The snapshot reads how long each claim has sat still out of the
          # viewer's published entry, which lives in tools/openspec-viewer.
          # Without it the build succeeds and quietly ships no ages at all,
          # which is the one failure nothing downstream would report.
          submodules: true
          # The viewer's snapshot dates every document by its last commit and
          # every claim by the history of its tasks.md. A shallow clone dates
          # all of it today and shows no claim as idle, silently.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The viewer never resolves a store path of its own: it asks the openspec
      # CLI, and it runs `validate --strict` through it for every change in
      # development. Pinned to the version engineers run against this store.
      - name: Install the OpenSpec CLI
        run: npm install -g @fission-ai/openspec@${{ env.OPENSPEC_VERSION }}

      - name: Require Cloudflare token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN_QA is empty. Grant this repository the staging Cloudflare token (same secret Storybook uses)."
            exit 1
          fi

      # Page rules only. A store file two changes both fold, an id issued
      # twice, a suite that traces nothing — those are breaks in files the
      # manual mirrors, and the site's job is to stay up and point at them.
      # Lint runs the whole check on this same push, so a store family still
      # fails the pull request that wrote it rather than the deploy that came
      # after it.
      - name: Check the manual
        run: pnpm run check:manual:pages

      - name: Build
        run: pnpm run manual:build

      - name: Deploy
        working-directory: tools/manual
        run: pnpm dlx wrangler@${{ env.WRANGLER_VERSION }} deploy -c wrangler.jsonc

      - name: Summary
        run: |
          {
            echo "## Grade10 Manual → staging"
            echo
            echo "https://spec.grade10-stg.com"
            echo "https://spec.grade10-stg.com/openspec/"
            echo
            echo "Snapshot baked from this commit's store state; the viewer under /openspec/ from the same read."
            echo
            echo "Ref: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  notify-openspec-changes:
    name: Report deployed OpenSpec changes
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # This runs after the deploy, rather than on every push. Manual's
      # concurrency cancels intermediate batch commits, so this one comparison
      # reports the complete deployed change once.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find the previous successful manual deployment
        id: previous-deployment
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          previous_sha="$(gh api \
            "/repos/${{ github.repository }}/actions/workflows/manual.yml/runs?status=success&per_page=100" \
            --jq "first(.workflow_runs[] | select(.id != ${RUN_ID} and .head_branch == \"${{ github.ref_name }}\")) | .head_sha // empty")"

          if [ -z "$previous_sha" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=OpenSpec report deferred::No earlier successful Manual deployment is available to compare with this first deployment."
            exit 0
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "sha=$previous_sha" >> "$GITHUB_OUTPUT"

      - name: Find OpenSpec changes since the previous manual deployment
        id: changes
        if: steps.previous-deployment.outputs.available == 'true'
        env:
          BASE: ${{ steps.previous-deployment.outputs.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          node scripts/openspec/changed-changes.mjs \
            --base "$BASE" \
            --head "$HEAD_SHA" \
            --manual-url "https://spec.grade10-stg.com/planning" \
            --openspec-url "https://spec.grade10-stg.com/openspec/" \
            --commit-url "${{ github.server_url }}/${{ github.repository }}/commit/${HEAD_SHA}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Notify Slack about deployed OpenSpec changes
        if: steps.changes.outputs.has-changes == 'true'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: ${{ vars.SLACK_CHANNEL_ID }}
          payload: ${{ steps.changes.outputs.payload }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  notify-deploy-failure:
    name: Report failed manual deployment
    needs: deploy
    if: always() && needs.deploy.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack about failed manual deployment
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: ${{ vars.SLACK_CHANNEL_ID }}
          payload: |
            {
              "attachments": [
                {
                  "color": "#dc3545",
                  "fallback": "Manual deployment failed.",
                  "pretext": ":x: Manual deployment failed",
                  "text": "Ref: *`${{ github.sha }}`*\\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>",
                  "footer": "${{ github.repository }} | ${{ github.ref_name }}"
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
