name: Manual

# Publishes the Grade10 Manual (tools/manual) to https://spec.grade10-stg.com
# on the staging Cloudflare account. Every push to main rebuilds the snapshot
# from the store and redeploys, so the hosted manual is exactly as fresh as
# the data — all state lives in commits.
#
# Local equivalent: pnpm manual:build && wrangler deploy -c tools/manual/wrangler.jsonc
#
# One-time ops:
# - Repo secret CLOUDFLARE_API_TOKEN_QA (same staging token Storybook uses).
# - Confirm Cloudflare Access covers spec.grade10-stg.com if you gate
#   the staging zone.
#
# The hosted site is static assets only, always read-only — editing happens
# against a local dev server, never here.

on:
  # Every push, unfiltered: the open page's banner promises the site rebuilds
  # on its own, and a path filter made that false on every push touching none
  # of the watched paths.
  push:
    branches: [main]
  # Lint's fix commit and Design sync's report commit are pushed with the
  # default GITHUB_TOKEN, which starts no workflow; each dispatches this.
  workflow_dispatch:
  repository_dispatch:
    types: [deployment-evidence-updated]

permissions:
  actions: read
  contents: read
  deployments: read

concurrency:
  group: manual-staging
  cancel-in-progress: true

env:
  NODE_VERSION: 24.14.1
  WRANGLER_VERSION: 4.120.0
  # Must match the `openspec` script in package.json;
  # scripts/openspec/openspec-version.test.mjs holds the three together.
  OPENSPEC_VERSION: 1.8.0

jobs:
  deploy:
    name: Deploy manual → staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_QA }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The snapshot dates every page by its last commit. A shallow clone
          # dates all of it today, silently.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Client payload fields only request a refresh. The manual reads the
      # deployment back from the configured app repository's Deployments API.
      - name: Fetch deployment receipts
        env:
          APP_DEPLOYMENTS_READ_TOKEN: ${{ secrets.APP_DEPLOYMENTS_READ_TOKEN }}
          APP_DEPLOYMENTS_REPOSITORY: ${{ vars.APP_DEPLOYMENTS_REPOSITORY || '9gag/grade10' }}
        run: node scripts/openspec/fetch-deployment-evidence.mjs

      # The viewer never resolves a store path of its own: it asks the openspec
      # CLI, and it runs `validate --strict` through it for every change in
      # development. Pinned to the version engineers run against this store.
      - name: Install the OpenSpec CLI
        run: npm install -g @fission-ai/openspec@${{ env.OPENSPEC_VERSION }}

      - name: Require Cloudflare token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN_QA is empty. Grant this repository the staging Cloudflare token (same secret Storybook uses)."
            exit 1
          fi

      # The manual's own page rules: grammar, references and config. Lint runs
      # the same check on the pull request that wrote the page.
      - name: Check the manual
        run: pnpm run check:manual

      # The banner on an open page listens to the relay this names; with the
      # variable unset the build writes no relay and the banner stays dark.
      - name: Build
        env:
          RELAY_URL: ${{ vars.RELAY_URL }}
        run: pnpm run manual:build

      - name: Deploy
        working-directory: tools/manual
        run: pnpm dlx wrangler@${{ env.WRANGLER_VERSION }} deploy -c wrangler.jsonc

      - name: Summary
        run: |
          {
            echo "## Grade10 Manual → staging"
            echo
            echo "https://spec.grade10-stg.com"
            echo
            echo "Snapshot baked from this commit's store state."
            echo
            echo "Ref: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  notify-deploy-failure:
    name: Report failed manual deployment
    needs: deploy
    if: always() && needs.deploy.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Build failure message
        id: failure-message
        env:
          HEAD_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(jq -nc \
            --arg sha "$HEAD_SHA" \
            --arg run_url "$RUN_URL" \
            '{
              "text": "Manual failed to deploy",
              "blocks": [
                {
                  "type": "section",
                  "text": {"type": "mrkdwn", "text": ":x: *Manual failed to deploy*"}
                },
                {
                  "type": "section",
                  "fields": [
                    {"type": "mrkdwn", "text": ("*Ref*\n`" + $sha + "`")},
                    {"type": "mrkdwn", "text": ("*Logs*\n<" + $run_url + "|View logs>")}
                  ]
                }
              ]
            }')
          echo "payload=$payload" >> "$GITHUB_OUTPUT"

      - name: Notify Slack about failed manual deployment
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: ${{ vars.SLACK_CHANNEL_ID }}
          payload: ${{ steps.failure-message.outputs.payload }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
