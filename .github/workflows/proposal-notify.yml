name: OpenSpec changes

# What reached the hosted manual, and who it moved it to.
#
# One post to the planning channel naming each change that crossed one of five
# milestones — proposed, accepted, implementation claimed, implementation
# complete, archived — and one direct message per hand a change has reached:
# the same derivation the board reads, run over the last deployed head and this
# one. A push that crosses no milestone posts nothing in the channel.
#
# It runs when the Manual workflow finishes on `main`, and only when it
# succeeded: that one job deploys the manual and the OpenSpec viewer under
# /openspec/, so every link a message carries opens on a page that already
# shows what it says. A deploy that failed, or was cancelled by a newer push,
# tells nobody; the next deploy that succeeds reads from the last one that did,
# so nothing it carried is lost.
#
# The job commits nothing: `contents: read` and `actions: read` — the second
# to find the last deployed head — are the whole of it, and the only token it
# holds beyond the workflow's own is the Slack bot's. `thread:` and `reviewed:`
# are written by the round, not here.

on:
  workflow_run:
    workflows: [Manual]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  # One at a time, oldest first: each run reads from the head the last
  # successful deploy carried, so two side by side would tell one range twice.
  group: openspec-notify
  cancel-in-progress: false

env:
  NODE_VERSION: 24.14.1
  MANUAL_URL: https://spec.grade10-stg.com/planning
  OPENSPEC_VIEWER_URL: https://spec.grade10-stg.com/openspec/
  # One file per run, restored and saved by exact key: it makes a re-run of
  # this push send nothing twice, and says nothing about the push before it.
  SENT_KEYS: notify-sent.txt

jobs:
  notify:
    # Both deployed, or nothing is told.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # The `reread` job's matrix, computed here from the same reading the
      # messages are — never a second diff of the same push.
      matrix: ${{ steps.changes.outputs.matrix }}
    steps:
      # The deployed head, with full history: a deploy can carry more than one
      # push, so the diff starts at the head the last successful deploy
      # carried rather than HEAD's parent.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # The script reads the store through the manual's own readers, which
      # need the workspace's dependencies.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Say which piece of setup is missing, rather than failing later inside
      # a Slack call about a token nobody set. A channel the bot is not a
      # member of cannot be checked without a call, so the send reports it
      # and names the channel it was refused.
      - name: Check the repository is configured
        env:
          BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CHANNEL: ${{ vars.SLACK_PLANNING_CHANNEL_ID || vars.SLACK_CHANNEL_ID }}
          WORKSPACE_URL: ${{ vars.SLACK_WORKSPACE_URL }}
          NOTIFY_DMS: ${{ vars.NOTIFY_DMS }}
        run: |
          missing=""
          [ -n "$BOT_TOKEN" ] || missing="$missing SLACK_BOT_TOKEN"
          [ -n "$CHANNEL" ] || missing="$missing SLACK_PLANNING_CHANNEL_ID"
          if [ "$NOTIFY_DMS" = "true" ] && [ -z "$WORKSPACE_URL" ]; then
            missing="$missing SLACK_WORKSPACE_URL"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Not configured:$missing"
            echo "Settings → Secrets and variables → Actions."
            exit 1
          fi

      # The same courtesy over the two things a wake needs, said once per push
      # rather than once per change: the `reread` job runs on a matrix, so a
      # preflight inside it repeats itself as many times as the push moved
      # changes — and says it only after the matrix was computed. Behind the
      # same variable that job is, so a store that never turned the cascade on
      # is not told what it did not set for it.
      - name: Check the wake is configured
        if: vars.AGENT_REREAD == 'true'
        env:
          AGENT_WAKE_URL: ${{ vars.AGENT_WAKE_URL }}
          AGENT_WAKE_TOKEN: ${{ secrets.AGENT_WAKE_TOKEN }}
        run: |
          missing=""
          [ -n "$AGENT_WAKE_URL" ] || missing="$missing AGENT_WAKE_URL"
          [ -n "$AGENT_WAKE_TOKEN" ] || missing="$missing AGENT_WAKE_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Not configured:$missing"
            echo "Settings → Secrets and variables → Actions."
            exit 1
          fi

      # The head the Manual workflow last deployed before this one: the newest
      # successful run on `main` older than the run that woke this one. The
      # newest 100 runs are read unfiltered and the conclusion is checked
      # here: the API's own `status=success` filter answered a run two weeks
      # old while a successful one an hour old sat beside it. A head that is
      # not an ancestor, or no success among the 100, reads from the head's
      # parent rather than from somewhere nobody chose.
      - name: Find the last deployed head
        id: range
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # GitHub can return an old workflow-run listing. Accept its base
          # only when the listing includes the deploy that woke this job.
          # Retry a fresh URL before failing; the next deploy can still catch
          # up from the last successful one.
          base=""
          for attempt in 1 2 3; do
            runs="$(gh api \
              "repos/$REPOSITORY/actions/workflows/$WORKFLOW_ID/runs?branch=main&per_page=100&seen=$RUN_ID-$attempt")"
            if base="$(printf '%s' "$runs" | node scripts/openspec/select-deployed-base.mjs \
              "$RUN_ID" "$RUN_NUMBER" "$HEAD_SHA")"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Manual run listing did not include this deploy after 3 attempts."
              exit 1
            fi
            sleep 3
          done
          if [ -z "$base" ] || ! git merge-base --is-ancestor "$base" "$HEAD_SHA"; then
            base="$(git rev-parse "$HEAD_SHA^")"
            echo "::notice::No earlier successful deploy on this history; reading from $base."
          fi
          echo "Reading $base..$HEAD_SHA ($(git rev-list --count "$base..$HEAD_SHA") commits)."
          echo "base=$base" >> "$GITHUB_OUTPUT"

      # No `restore-keys`: a prefix fallback would drag the previous push's
      # keys in and silence a stage re-entered after a revert (decisions Q26).
      - name: Restore the keys this run has sent
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SENT_KEYS }}
          key: notify-sent-${{ github.run_id }}

      # One run: the channel post and the direct messages are one delivery,
      # the post keyed by the deployed head so a re-run does not post it
      # twice either. `NOTIFY_DMS` turns the direct messages off without
      # touching the post.
      - name: Find what this deploy carried and tell it
        id: changes
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_WORKSPACE_URL: ${{ vars.SLACK_WORKSPACE_URL }}
          TCS_SHEET_URL: ${{ vars.TCS_SHEET_URL }}
          CHANNEL: ${{ vars.SLACK_PLANNING_CHANNEL_ID || vars.SLACK_CHANNEL_ID }}
          BEFORE: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          touch "$SENT_KEYS"
          node scripts/openspec/changed-changes.mjs \
            --stages \
            --send \
            --dms "${{ vars.NOTIFY_DMS }}" \
            --base "$BEFORE" \
            --head "$HEAD_SHA" \
            --channel "$CHANNEL" \
            --sent-keys "$SENT_KEYS" \
            --manual-url "$MANUAL_URL" \
            --openspec-url "$OPENSPEC_VIEWER_URL" \
            --commit-url "${{ github.server_url }}/${{ github.repository }}/commit/$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"

      # Whatever happened above: what went out is what went out, and the next
      # push's run should not send it again.
      - name: Save the keys this run has sent
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SENT_KEYS }}
          key: notify-sent-${{ github.run_id }}

  # The read again: one wake per change this push put behind, on the matrix
  # `notify` already computed from the same reading its own messages are —
  # never a second diff of the same push. A change touched only by the
  # round's own record lines never entered that matrix, which is what makes
  # the cascade a run wakes finite.
  #
  # The relay serialises wakes per change, runs the session, and posts the
  # failure line itself if the wake's budget runs out with no `done` — so
  # this job holds no session and no write permission. `AGENT_WAKE_TOKEN` is
  # the only credential the wake step reads; the bot token lives in the plain
  # step below it, which says in the channel that a wake never arrived, and
  # reaches no session either way (Q62).
  #
  # Two steps, and the preflight is not one of them: what Operations has not
  # set is said once by `notify`, above the matrix, rather than once per
  # change inside it. So the only step here that can fail is the wake, which
  # is exactly what the failure line reports.
  reread:
    needs: notify
    # Two gates: the variable is how Operations turns the cascade on, and the
    # matrix gate keeps a push that moved no change from starting a job whose
    # `include` is empty.
    if: vars.AGENT_REREAD == 'true' && needs.notify.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.notify.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The change's id reaches the body through the environment and `jq
      # --arg`, off a quoted heredoc: an id is a string a push computed, and
      # a string spliced into a shell word is a shell word.
      - name: Wake the relay
        env:
          AGENT_WAKE_URL: ${{ vars.AGENT_WAKE_URL }}
          AGENT_WAKE_TOKEN: ${{ secrets.AGENT_WAKE_TOKEN }}
          CHANGE: ${{ matrix.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          filter="$(cat <<'JQ'
          { change: $change, reason: "landing", head: $head }
          JQ
          )"
          body="$(jq -nc \
            --arg change "$CHANGE" \
            --arg head "$HEAD_SHA" \
            "$filter")"
          curl -fsS -X POST "$AGENT_WAKE_URL/wake" \
            -H "Authorization: Bearer $AGENT_WAKE_TOKEN" \
            -H 'content-type: application/json' \
            -d "$body"

      # A wake that never arrived is a re-read nobody is waiting for and a
      # thread nobody told: the relay cannot post its own failure line for a
      # wake it never took. So this plain step says it in the channel the
      # notify job posts to, naming the change and the head, and it is the
      # only step here that reads the bot token. Slack answers 200 with
      # `ok: false` on a channel it will not post to, so the answer is read
      # rather than the status: a failure line nobody received is a failure
      # nobody knows about.
      - name: Say the wake did not reach the relay
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CHANNEL: ${{ vars.SLACK_PLANNING_CHANNEL_ID || vars.SLACK_CHANNEL_ID }}
          CHANGE: ${{ matrix.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          filter="$(cat <<'JQ'
          {
            channel: $channel,
            text: ("The wake for `" + $change + "` at " + $head
              + " did not reach the relay: nothing is reading it again.")
          }
          JQ
          )"
          body="$(jq -nc \
            --arg channel "$CHANNEL" \
            --arg change "$CHANGE" \
            --arg head "${HEAD_SHA:0:8}" \
            "$filter")"
          said="$(curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H 'content-type: application/json; charset=utf-8' \
            -d "$body")"
          if [ "$(printf '%s' "$said" | jq -r '.ok')" != "true" ]; then
            echo "::error::Slack refused the line: $(printf '%s' "$said" | jq -r '.error // "no reason given"')"
            exit 1
          fi
