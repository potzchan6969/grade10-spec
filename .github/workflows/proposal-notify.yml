name: OpenSpec changes

# Reports changes to the OpenSpec store after they land on main.

on:
  push:
    branches: [main]
    paths:
      - "openspec/changes/**"
      - "openspec/specs/**"
      - ".github/workflows/proposal-notify.yml"

permissions:
  contents: read

concurrency:
  group: openspec-notify-${{ github.sha }}

env:
  MANUAL_URL: https://spec.grade10-stg.com/planning
  OPENSPEC_VIEWER_URL: https://spec.grade10-stg.com/openspec/

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: a push can carry more than one commit, so the diff starts
      # at the branch's previous commit rather than HEAD's parent.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find OpenSpec changes in this push
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          base="$BEFORE"
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="${HEAD_SHA}^"
          fi
          node scripts/openspec/changed-changes.mjs \
            --base "$base" \
            --head "$HEAD_SHA" \
            --manual-url "$MANUAL_URL" \
            --openspec-url "$OPENSPEC_VIEWER_URL" \
            --commit-url "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Notify Slack about OpenSpec changes
        if: steps.changes.outputs.has-changes == 'true'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: ${{ vars.SLACK_CHANNEL_ID }}
          payload: ${{ steps.changes.outputs.payload }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
