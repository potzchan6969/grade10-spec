name: Lint

# Nothing here is filtered out: the jobs below read a change's plan, and the
# push that ticks a task group carries that file alone.
# `scripts/openspec/workflows.test.mjs` holds every gate to it.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

# Pull requests cancel their own superseded runs; every push to main runs to
# the end, so a red main names the commit that broke it.
concurrency:
  group: ci-lint-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.14.1
  # Must match the `openspec` script in package.json;
  # scripts/openspec/openspec-version.test.mjs holds the three together.
  OPENSPEC_VERSION: 1.8.0
  SLACK_NOTI_CHANNEL: C045K1QJVQT # web3-github
  SLACK_NOTI_FOOTER: ${{ github.repository }} | ${{ github.head_ref || github.ref_name }} | <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|view logs>
  SLACK_NOTI_FOOTER_ICON: https://slack-imgs.com/?c=1&o1=wi32.he32.si&url=https%3A%2F%2Fslack.github.com%2Fstatic%2Fimg%2Ffavicon-neutral.png

jobs:
  biome:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check lint
        id: lint
        continue-on-error: true
        run: pnpm run lint

      - name: Apply lint fixes
        if: steps.lint.outcome == 'failure'
        continue-on-error: true
        run: pnpm run lint:fix

      - name: Verify lint after fixes
        if: steps.lint.outcome == 'failure'
        run: pnpm run lint

      - name: Commit lint fixes
        id: commit-lint-fixes
        if: >-
          steps.lint.outcome == 'failure' &&
          github.event_name == 'push' &&
          github.actor != 'github-actions[bot]'
        env:
          COMMIT_MESSAGE: "chore(ci): apply Biome lint fixes"
        run: |
          if git diff --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Every push to main runs to the end, so a newer run may be racing
          # this one; it fixes what its own head still holds.
          git fetch --quiet origin "$GITHUB_REF_NAME"
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "::notice title=Lint fixes not committed::main moved past ${GITHUB_SHA}; the run on its new head applies its own."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "$COMMIT_MESSAGE"
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "commit-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Notify Slack about lint-fix commit
        if: steps.commit-lint-fixes.outputs.committed == 'true'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: ${{ env.SLACK_NOTI_CHANNEL }}
          payload: |
            {
              "attachments": [
                {
                  "mrkdwn_in": ["text"],
                  "color": "#28a745",
                  "fallback": "CI committed Biome lint fixes.",
                  "pretext": ":white_check_mark: CI committed Biome lint fixes",
                  "text": "Branch: *`${{ github.ref_name }}`*\nCommit: *`${{ steps.commit-lint-fixes.outputs.commit-sha }}`*",
                  "footer": "${{ env.SLACK_NOTI_FOOTER }}",
                  "footer_icon": "${{ env.SLACK_NOTI_FOOTER_ICON }}"
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      # Last, so a manual page that has drifted never stops Biome from
      # committing its own fixes first — but never skipped when Biome fails.
      # These two are the only gate the store families have now that the
      # deploy runs page rules alone, and a job that stops at an unrelated
      # `noUselessFragments` would leave them enforced nowhere at all.
      - name: Check manual
        if: ${{ !cancelled() }}
        run: pnpm run check:manual

      - name: Check diagrams
        if: ${{ !cancelled() }}
        run: pnpm run diagrams:check

  # Its own job: the CLI is the only thing it needs, and a Biome failure must
  # never be what lets a malformed change through. Read-only — it writes
  # nothing back to the branch.
  openspec:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # The validator reads each change's manifest to tell a change waiting on
      # an input from one nobody finished, with the same yaml reader the store
      # itself uses — two readings of one key must not disagree.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the OpenSpec CLI
        run: npm install -g @fission-ai/openspec@${{ env.OPENSPEC_VERSION }}

      - name: Validate changes
        run: node scripts/openspec/validate-changes.mjs --strict

      - name: Validate durable specs
        if: ${{ !cancelled() }}
        run: openspec validate --specs

  # Main takes direct pushes and its ruleset requires no checks, so a red gate
  # here stops nothing: this says so in the channel the lint-fix post uses.
  notify-main-red:
    needs: [biome, openspec]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Notify Slack that Lint failed on main
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: ${{ env.SLACK_NOTI_CHANNEL }}
          payload: |
            {
              "attachments": [
                {
                  "mrkdwn_in": ["text"],
                  "color": "#d73a49",
                  "fallback": "Lint failed on main.",
                  "pretext": ":x: Lint failed on main",
                  "text": "Head: *`${{ github.sha }}`*\nbiome: ${{ needs.biome.result }}, openspec: ${{ needs.openspec.result }}",
                  "footer": "${{ env.SLACK_NOTI_FOOTER }}",
                  "footer_icon": "${{ env.SLACK_NOTI_FOOTER_ICON }}"
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
