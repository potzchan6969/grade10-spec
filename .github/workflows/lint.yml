name: Lint

# Nothing here is filtered out: the jobs below read a change's plan, and the
# push that ticks a task group carries that file alone.
# `scripts/openspec/workflows.test.mjs` holds every gate to it.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

# Pull requests cancel their own superseded runs; a push to main is cancelled by the next
# one only while still in setup (cancel-superseded.yml), so a red main names
# the commit that broke it.
concurrency:
  group: ci-lint-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.14.1
  # Must match the `openspec` script in package.json;
  # scripts/openspec/openspec-version.test.mjs holds the three together.
  OPENSPEC_VERSION: 1.8.0

jobs:
  biome:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # One pass that fixes what it can and fails on what it cannot. Errors
      # alone are printed, so the block plugins' warnings never hide them.
      - name: Lint and apply fixes
        id: lint
        continue-on-error: true
        run: pnpm run lint:fix --diagnostic-level=error

      - name: Commit lint fixes
        id: commit-lint-fixes
        # Committed even while errors remain, so what Biome can fix never piles
        # up on main behind what it cannot.
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        env:
          COMMIT_MESSAGE: "chore(ci): apply Biome lint fixes"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            exit 0
          fi

          # Every push to main runs to the end, so a newer run may be racing
          # this one; it fixes what its own head still holds.
          git fetch --quiet origin "$GITHUB_REF_NAME"
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "::notice title=Lint fixes not committed::main moved past ${GITHUB_SHA}; the run on its new head applies its own."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "$COMMIT_MESSAGE"
          git push
          # A push with the default token starts no workflow, so the manual
          # is rebuilt from the fixed head by hand.
          gh workflow run manual.yml --ref "$GITHUB_REF_NAME"

      - name: Fail on what Biome could not fix
        if: steps.lint.outcome == 'failure'
        run: exit 1

      # Last, so a manual page that has drifted never stops Biome from
      # committing its own fixes first — but never skipped when Biome fails.
      # These two are the only gate the store families have now that the
      # deploy runs page rules alone, and a job that stops at an unrelated
      # `noUselessFragments` would leave them enforced nowhere at all.
      - name: Check manual
        if: ${{ !cancelled() }}
        run: |
          # The cited rule compares rounds rows with main; checkout's shallow
          # pull-request ref does not carry origin/main.
          git fetch --quiet --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          pnpm run check:manual

      - name: Check stories
        if: ${{ !cancelled() }}
        run: pnpm run storybook:check

      - name: Check diagrams
        if: ${{ !cancelled() }}
        run: pnpm run diagrams:check

      # One package turns an instant into text; a formatter anywhere else is a
      # second answer to what a date reads. Not skipped when Biome fails.
      - name: Check dates
        if: ${{ !cancelled() }}
        run: pnpm run check:dates

  # Its own job: the CLI is the only thing it needs, and a Biome failure must
  # never be what lets a malformed change through. Read-only — it writes
  # nothing back to the branch.
  openspec:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # The validator reads each change's manifest to tell a change waiting on
      # an input from one nobody finished, with the same yaml reader the store
      # itself uses — two readings of one key must not disagree.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the OpenSpec CLI
        run: npm install -g @fission-ai/openspec@${{ env.OPENSPEC_VERSION }}

      - name: Validate changes
        run: node scripts/openspec/validate-changes.mjs --strict

      - name: Validate durable specs
        if: ${{ !cancelled() }}
        run: openspec validate --specs
