name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-lint-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.14.1
  SLACK_NOTI_CHANNEL: C045K1QJVQT # web3-github
  SLACK_NOTI_FOOTER: ${{ github.repository }} | ${{ github.head_ref || github.ref_name }} | <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|view logs>
  SLACK_NOTI_FOOTER_ICON: https://slack-imgs.com/?c=1&o1=wi32.he32.si&url=https%3A%2F%2Fslack.github.com%2Fstatic%2Fimg%2Ffavicon-neutral.png

jobs:
  biome:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check lint
        id: lint
        continue-on-error: true
        run: pnpm run lint

      - name: Apply lint fixes
        if: steps.lint.outcome == 'failure'
        continue-on-error: true
        run: pnpm run lint:fix

      - name: Verify lint after fixes
        if: steps.lint.outcome == 'failure'
        run: pnpm run lint

      - name: Commit lint fixes
        id: commit-lint-fixes
        if: >-
          steps.lint.outcome == 'failure' &&
          github.event_name == 'push' &&
          github.actor != 'github-actions[bot]'
        env:
          COMMIT_MESSAGE: "chore(ci): apply Biome lint fixes"
        run: |
          if git diff --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "$COMMIT_MESSAGE"
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "commit-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Notify Slack about lint-fix commit
        if: steps.commit-lint-fixes.outputs.committed == 'true'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: ${{ env.SLACK_NOTI_CHANNEL }}
          payload: |
            {
              "attachments": [
                {
                  "mrkdwn_in": ["text"],
                  "color": "#28a745",
                  "fallback": "CI committed Biome lint fixes.",
                  "pretext": ":white_check_mark: CI committed Biome lint fixes",
                  "text": "Branch: *`${{ github.ref_name }}`*\nCommit: *`${{ steps.commit-lint-fixes.outputs.commit-sha }}`*",
                  "footer": "${{ env.SLACK_NOTI_FOOTER }}",
                  "footer_icon": "${{ env.SLACK_NOTI_FOOTER_ICON }}"
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      # Last, so a manual page that has drifted never stops Biome from
      # committing its own fixes first.
      - name: Check manual
        run: pnpm run check:manual

      - name: Check diagrams
        run: pnpm run diagrams:check
