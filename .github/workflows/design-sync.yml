name: Design sync

on:
  push:
  pull_request:
  # A Figma edit produces no event in this repository, so the push and
  # pull_request triggers only ever catch drift that a code change happens to
  # walk into. The schedule is what makes a designer-side rename or a changed
  # fill surface on its own; 01:00 UTC is 09:00 in Hong Kong, so a failure is
  # waiting at the start of the working day rather than mid-afternoon.
  schedule:
    - cron: "0 1 * * *"
  # For re-checking on demand the moment a designer says they have published a
  # change, instead of waiting for the next scheduled run.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keyed by event as well as ref: a scheduled run and a push to the default
  # branch share a ref, so without this one would cancel the other and the
  # nightly Figma check would silently stop running on busy days.
  group: ci-design-sync-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.14.1

jobs:
  components:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A design-sync check that quietly passes without reaching Figma is worse
      # than no check, because a green tick then means nothing. Forks and
      # Dependabot genuinely cannot read secrets, so those warn and carry on;
      # anywhere else a missing token is a misconfiguration and fails the job.
      - name: Check for Figma token
        id: token
        env:
          SECRETS_UNAVAILABLE: ${{ github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]' }}
        run: |
          if [ -n "${{ secrets.FIGMA_TOKEN }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "$SECRETS_UNAVAILABLE" = "true" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Design sync skipped::FIGMA_TOKEN is unavailable to forked-PR and Dependabot runs, so Figma-vs-code drift was NOT checked."
          else
            echo "::error title=Design sync misconfigured::FIGMA_TOKEN is not set for this repository, so Figma-vs-code drift was NOT checked. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Check components against Figma
        if: steps.token.outputs.available == 'true'
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: pnpm run check:design-system

      # A component with no variant axes has no component-set diff — its one
      # durable Figma-side check is the per-directory audit.json written at
      # conversion time. Sweeping them all here is what makes a designer-side
      # edit to a source node surface as a failed nightly, the same way a
      # variant rename does above. The sweep covers packages/ui blocks and the
      # design-system components alike: the site chrome has no variant axes and
      # lives in the design system, so a sweep of one package would leave it
      # checked by neither rail. A directory without an audit.json is listed as
      # uncovered, never as passing.
      - name: Audit component classnames against Figma
        if: steps.token.outputs.available == 'true'
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: pnpm run figma:audit --all-blocks

      # Annotation drift is a separate rail from component structure and
      # rendered-value checks. Capture the scanner's exit state so the final
      # step can distinguish a real edit (1) from missing evidence (2), while
      # the scanner writes the same human summary to GITHUB_STEP_SUMMARY.
      - name: Monitor Figma annotations
        id: annotations
        if: steps.token.outputs.available == 'true'
        continue-on-error: true
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          set +e
          node scripts/design-sync/annotation-monitor.mjs --json | tee annotation-monitor.json
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Fail on annotation drift or blocked evidence
        if: steps.annotations.outputs.exit_code != '' && steps.annotations.outputs.exit_code != '0'
        run: |
          if [ "${{ steps.annotations.outputs.exit_code }}" = "1" ]; then
            echo "::error title=Figma annotation drift::Review annotation-monitor.json and the step summary."
          else
            echo "::error title=Figma annotation evidence blocked::The annotation scan could not verify every registered surface."
          fi
          exit 1
