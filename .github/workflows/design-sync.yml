name: Design sync

on:
  push:
    branches: [main]
  pull_request:
  # A Figma edit produces no event in this repository, so the push and
  # pull_request triggers only ever catch drift that a code change happens to
  # walk into. The schedule is what makes a designer-side rename or a changed
  # fill surface on its own; 01:00 UTC is 09:00 in Hong Kong, so a failure is
  # waiting at the start of the working day rather than mid-afternoon.
  schedule:
    - cron: "0 1 * * *"
  # For re-checking on demand the moment a designer says they have published a
  # change, instead of waiting for the next scheduled run.
  workflow_dispatch:

# The manual badges a card whose component set is drifting, and it reads that
# from a committed report — so this workflow writes. `actions: write` is for the
# dispatch that follows the commit: a push made with GITHUB_TOKEN starts no
# other workflow, so without it the report lands on main and rebuilds nothing.
permissions:
  contents: write
  actions: write

concurrency:
  # Keyed by event as well as ref: a scheduled run and a push to the default
  # branch share a ref, so without this one would cancel the other and the
  # nightly Figma check would silently stop running on busy days.
  group: ci-design-sync-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.14.1
  # Generated, never authored, so it sits outside the manual's pages — the
  # manual's build only reads it. tools/manual/src/store/design-sync.mts names the same path.
  REPORT: .design-sync/report.json

jobs:
  components:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A design-sync check that quietly passes without reaching Figma is worse
      # than no check, because a green tick then means nothing. Forks and
      # Dependabot genuinely cannot read secrets, so those warn and carry on;
      # anywhere else a missing token is a misconfiguration and fails the job.
      - name: Check for Figma token
        id: token
        env:
          SECRETS_UNAVAILABLE: ${{ github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]' }}
        run: |
          if [ -n "${{ secrets.FIGMA_TOKEN }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "$SECRETS_UNAVAILABLE" = "true" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Design sync skipped::FIGMA_TOKEN is unavailable to forked-PR and Dependabot runs, so Figma-vs-code drift was NOT checked."
          else
            echo "::error title=Design sync misconfigured::FIGMA_TOKEN is not set for this repository, so Figma-vs-code drift was NOT checked. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      # `continue-on-error` so a drifting run still commits its report below —
      # a failing check is the one the manual most needs to badge. The job still
      # fails, in the step after the commit.
      - name: Check components against Figma
        id: components
        if: steps.token.outputs.available == 'true'
        continue-on-error: true
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: pnpm run design-sync:check --report "$REPORT"

      # A component with no variant axes has no component-set diff — its one
      # durable Figma-side check is the per-directory audit.json written at
      # conversion time. Sweeping them all here is what makes a designer-side
      # edit to a source node surface as a failed nightly, the same way a
      # variant rename does above. The sweep covers packages/ui blocks and the
      # design-system components alike: the site chrome has no variant axes and
      # lives in the design system, so a sweep of one package would leave it
      # checked by neither rail. A directory without an audit.json is listed as
      # uncovered, never as passing.
      #
      # Before the commit, and merging into the same report, so this rail
      # reaches the manual at all: its half used to go to a job summary and
      # nowhere else, which left the site chrome badging nothing on every page
      # that shows it. `continue-on-error` for the same reason as above — the
      # job goes red below, after the verdict is safely committed.
      - name: Audit component classnames against Figma
        id: audit
        if: steps.token.outputs.available == 'true'
        continue-on-error: true
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: pnpm run design-sync:audit --all-blocks --report "$REPORT"

      # Only from the default branch: a PR's report would be a verdict on a tree
      # nobody deploys, and the manual reads one committed file. Keys are sorted
      # set names, so a nightly that found nothing new commits nothing.
      - name: Commit the design-sync report
        id: commit
        if: >-
          steps.components.outcome != 'skipped' &&
          github.ref_name == github.event.repository.default_branch &&
          github.actor != 'github-actions[bot]'
        env:
          COMMIT_MESSAGE: "chore(ci): record the design-sync verdict per component set"
        run: |
          if [ -z "$(git status --porcelain --untracked-files=all -- "$REPORT")" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$REPORT"
          git commit -m "$COMMIT_MESSAGE"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # The hop the verdict never used to make. A push made with the default
      # GITHUB_TOKEN triggers no workflow, so the commit above lands on main and
      # rebuilds nothing — badges appeared only on the next unrelated engineer
      # push, which for a designer-only rename is whenever, or never. Only on a
      # report that actually changed: dispatching on every nightly would rebuild
      # and redeploy the site once a day to publish the same bytes.
      - name: Rebuild the manual with the new verdict
        if: steps.commit.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh workflow run manual.yml --ref "${{ github.event.repository.default_branch }}"

      # Last, so the report is committed and the manual is already rebuilding
      # before the job goes red on what either rail found.
      - name: Fail on component drift
        if: steps.components.outcome == 'failure'
        run: |
          echo "::error title=Design sync::Figma and the code disagree — see 'Check components against Figma' above."
          exit 1

      - name: Fail on audited-element drift
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::error title=Design sync::An audited element renders a value Figma does not draw — see 'Audit component classnames against Figma' above."
          exit 1
