name: Cancel superseded

# A push to main cancels the CI runs of older pushes that are still in setup.
# A run that has finished checkout, tool install and `Install dependencies`
# in any job runs to the end, so a red main still names the commit that broke
# it. Each CI workflow keys its main runs by run id, so none cancels another
# by itself; this one does it by hand.
on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

concurrency:
  group: cancel-superseded
  cancel-in-progress: false

jobs:
  cancel:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.sha }}
      WORKFLOWS: lint.yml test.yml typecheck.yml test-cases.yml design-sync.yml
      # The last setup step of a job. A job that has started it, or any step
      # after it, is past setup.
      SETUP_STEP: Install dependencies

    steps:
      - name: Cancel runs of older pushes that are still in setup
        run: |
          for workflow in $WORKFLOWS; do
            runs=$(gh api "repos/$REPO/actions/workflows/$workflow/runs?branch=main&event=push&per_page=50" \
              --jq ".workflow_runs[] | select(.head_sha != \"$HEAD_SHA\" and (.status == \"in_progress\" or .status == \"queued\")) | .id")
            for run in $runs; do
              # A job that is queued, or has no `$SETUP_STEP` step yet, is in
              # setup. One that runs or has run that step, or a later one, is not.
              past=$(gh api "repos/$REPO/actions/runs/$run/jobs?per_page=100" \
                --jq "[.jobs[] | select(any(.steps[]?; .name == \"$SETUP_STEP\" and .status != \"queued\" and .status != \"pending\"))] | length")
              if [ "${past:-1}" != "0" ]; then
                echo "Keeping $workflow run $run: past setup."
                continue
              fi
              echo "Cancelling $workflow run $run: still in setup."
              gh api -X POST "repos/$REPO/actions/runs/$run/cancel" || echo "::warning title=Cancel::Could not cancel run $run."
            done
          done
