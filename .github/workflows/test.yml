name: Test

# No workflow path filter: a required check whose workflow never runs stays
# pending. Each job skips on its own what it does not read - the Playwright
# jobs an event that changes only `openspec/changes/**` and `docs/**`, the
# manual's tools a pull request that moves none of them, every job a tick's
# plan - and a skipped job reads green. `scripts/openspec/workflows.test.mjs` holds the filter.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Pull requests cancel their own superseded runs; every push to main runs to
# the end, so a red main names the commit that broke it.
concurrency:
  group: ci-test-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.14.1

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      plan: ${{ steps.diff.outputs.plan }}
      tooling: ${{ steps.diff.outputs.tooling }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A pull request's merge commit and its base: the diff the pull
          # request makes.
          fetch-depth: 2

      # Anything it cannot read counts as code, and so does a failed run of
      # this job: the jobs below skip on `code=false`, `plan=true` or
      # `tooling=false` alone. `--no-renames`, so a file moved into `docs/`
      # still names where it left. TOOLING is what the manual, its walk and
      # the store's scripts read besides the store itself: they import one
      # another, so they share one set. A push to main runs them all - the
      # store's own words are checked there, and by Lint on every pull request.
      - name: Read whether the event reaches code
        id: diff
        env:
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
          DOCS_ONLY: ^(openspec/changes|docs)/
          PLAN_ONLY: ^openspec/changes/.+/tasks\.md$
          TOOLING: ^(tools/manual/|tools/openspec-viewer(/|$)|scripts/(openspec|storybook|design-sync)/|packages/(design-system|ui|date)/|openspec/(schemas/|config\.yaml$)|\.design-sync/|\.github/workflows/|package\.json$|pnpm-(lock|workspace)\.yaml$)
          EVENT: ${{ github.event_name }}
        run: |
          base=HEAD^1
          if [ -n "$BEFORE" ]; then
            base=$BEFORE
            git fetch --quiet --depth=1 origin "$BEFORE" || base=
          fi
          if [ -n "$base" ] && changed=$(git diff --no-renames --name-only "$base" HEAD); then
            if grep -qvE "$DOCS_ONLY" <<< "$changed"; then
              echo "code=true" >> "$GITHUB_OUTPUT"
            else
              echo "code=false" >> "$GITHUB_OUTPUT"
            fi
            if grep -qvE "$PLAN_ONLY" <<< "$changed"; then
              echo "plan=false" >> "$GITHUB_OUTPUT"
            else
              echo "plan=true" >> "$GITHUB_OUTPUT"
            fi
            if [ "$EVENT" != pull_request ] || grep -qE "$TOOLING" <<< "$changed"; then
              echo "tooling=true" >> "$GITHUB_OUTPUT"
            else
              echo "tooling=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::warning title=Test filter::Could not diff against ${base:-its base}, so every job runs."
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "plan=false" >> "$GITHUB_OUTPUT"
            echo "tooling=true" >> "$GITHUB_OUTPUT"
          fi

  # One job per package: ui alone is most of the time, and the three share
  # nothing but their setup.
  stories:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [design-system, ui, app]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test the UI verification archive package
        run: pnpm --dir packages/ui-verification test

      - name: Install Playwright Chromium
        run: pnpm run setup:browsers

      - name: Run tests
        run: pnpm run test:stories:${{ matrix.part }}

      - name: Build the verification workbench
        run: pnpm run storybook:build:workbench

      - name: Verify historical comparisons in the workbench
        run: pnpm --dir apps/preview run test:verification

  # The manual's own pages in a browser: a pull request that moves none of
  # what they read has nothing to walk.
  walk:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.changes.outputs.tooling != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm run setup:browsers

      - name: Run the walk
        run: pnpm run test:walk

  # Skips the push that ticks a task group, which carries a change's plan
  # alone, and a pull request that moves none of the manual's tools: its few
  # tests over the real store repeat what Lint checks on every one.
  manual:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.plan != 'true' && needs.changes.outputs.tooling != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The manual's tests cover the claim ages it reads out of the
          # viewer's published entry in tools/openspec-viewer. They skip
          # themselves without it, so leaving it out would pass by not asking.
          submodules: true
          # They read the real store's claims at its main, and a pull
          # request's shallow checkout has no origin/main to read.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test:manual

  # The store's scripts against their fixtures: a pull request that moves
  # none of them, nor the schemas they copy, has nothing for them.
  openspec:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.plan != 'true' && needs.changes.outputs.tooling != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test:openspec

  catalogs:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.plan != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test:catalogs
