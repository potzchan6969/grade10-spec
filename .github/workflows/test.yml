name: Test

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/tasks.md"
  pull_request:
    paths-ignore:
      - "**/tasks.md"

permissions:
  contents: read

concurrency:
  group: ci-test-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.14.1

jobs:
  stories:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm run setup:browsers

      - name: Run tests
        run: pnpm run test:stories

  walk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm run setup:browsers

      - name: Run the walk
        run: pnpm run test:walk

  catalogs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The manual's tests cover the claim ages it reads out of the
          # viewer's published entry in tools/openspec-viewer. They skip
          # themselves without it, so leaving it out would pass by not asking.
          submodules: true
          # They read the real store's claims at its main, and a pull
          # request's shallow checkout has no origin/main to read.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test
