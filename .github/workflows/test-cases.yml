name: Test cases

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Pull requests cancel their own superseded runs; a push to main is cancelled by the next
# one only while still in setup (cancel-superseded.yml), so a red main names
# the commit that broke it.
concurrency:
  group: ci-test-cases-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.14.1

jobs:
  suites:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The validator is zero-dependency on purpose, so this job needs no install
      # step and stays fast enough to run on every push.
      - name: Validate test-case suites
        run: node scripts/openspec/validate-test-cases.mjs --require-suites

  # The test-case rules change only by their owner's hand: docs/prds/team.yaml's
  # handle that owns `tcs-rules`. Reads the authors of the commits a push or a
  # pull request brings, so it needs the history and the team map's reader.
  rules-owner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Hold the test-case rules to their owner
        run: >-
          node scripts/openspec/tcs-rules-owner.mjs
          "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
