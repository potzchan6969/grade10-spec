name: Test cases

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Pull requests cancel their own superseded runs; every push to main runs to
# the end, so a red main names the commit that broke it.
concurrency:
  group: ci-test-cases-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.14.1

jobs:
  suites:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The validator is zero-dependency on purpose, so this job needs no install
      # step and stays fast enough to run on every push.
      - name: Validate test-case suites
        run: node scripts/openspec/validate-test-cases.mjs --require-suites
