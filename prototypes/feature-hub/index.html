<title>Feature Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column; a feature's outline opens in place, and each node carries its own picture. */
:root {
  --bg: #f6f7f5; --panel: #ffffff; --sunk: #eef0ec; --fg: #1b211e; --muted: #5c665f; --line: #d9ddd6;
  --accent: #1f6b57; --accent-soft: #dcefe7;
  --inv: #9a5b00; --inv-soft: #fbedd5;
  --ok: #217a3c; --ok-soft: #dff2e3; --warn: #a15c00; --warn-soft: #fcefd9; --bad: #b3261e; --bad-soft: #fbe3e1;
  --later: #7b8480; --later-soft: #eceeeb;
  --display: "Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121614; --panel: #1a201d; --sunk: #232a26; --fg: #e6ebe7; --muted: #9aa59e; --line: #2f3833;
  --accent: #6cc7a8; --accent-soft: #1d3a31;
  --inv: #f0b45c; --inv-soft: #3a2c15;
  --ok: #6fcf87; --ok-soft: #1c3424; --warn: #f0b45c; --warn-soft: #3a2c15; --bad: #ff8a80; --bad-soft: #3d1f1d;
  --later: #8c9590; --later-soft: #262c29; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121614; --panel: #1a201d; --sunk: #232a26; --fg: #e6ebe7; --muted: #9aa59e; --line: #2f3833;
  --accent: #6cc7a8; --accent-soft: #1d3a31;
  --inv: #f0b45c; --inv-soft: #3a2c15;
  --ok: #6fcf87; --ok-soft: #1c3424; --warn: #f0b45c; --warn-soft: #3a2c15; --bad: #ff8a80; --bad-soft: #3d1f1d;
  --later: #8c9590; --later-soft: #262c29; color-scheme: dark }

body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--body); }
.wrap { max-width: 1060px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }
h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 19px; font-weight: 700; }
h3 { font-size: 15px; font-weight: 600; font-family: var(--body); }
.mono, code { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--muted); }
.eyebrow { font: 500 11.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
button, select, input { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { display: grid; gap: 10px; margin-bottom: 18px; }
.crumb { font: 500 12.5px var(--mono); color: var(--muted); }
.crumb b { color: var(--fg); font-weight: 500; }
.job { font-size: 17px; max-width: 68ch; }
.bar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 10px 0; border-block: 1px solid var(--line); margin-bottom: 22px;
  position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: none; padding: 6px 12px; cursor: pointer; font-size: 13.5px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--panel); }
.ctl { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.ctl select { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; color: var(--fg); }

section.block { margin-bottom: 30px; display: grid; gap: 12px; }
.sec-head { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
.sec-head p { margin: 0; color: var(--muted); font-size: 13.5px; }

.pm { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.pm .cell { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.pm .cell ul { margin: 6px 0 0; padding-left: 18px; }
.pm .cell p { margin: 6px 0 0; }

.chip { display: inline-flex; align-items: center; gap: 4px; font: 500 11.5px var(--mono); padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
.chip.v1 { background: var(--accent-soft); color: var(--accent); }
.chip.later { background: var(--later-soft); color: var(--later); }
.chip.inv { background: var(--inv-soft); color: var(--inv); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.plain { background: var(--sunk); color: var(--muted); }
.chip.link { cursor: pointer; border: 0; }

table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 500 11.5px var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.scroll { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.vals input { width: 70px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--sunk); font: 13px var(--mono); }
.vals tr.changed td:first-child { box-shadow: inset 3px 0 0 var(--warn); }

details.node { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
details.node > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 34px 1fr auto; gap: 4px 12px; align-items: center; padding: 12px 14px; }
details.node > summary::-webkit-details-marker { display: none; }
details.node[open] > summary { border-bottom: 1px solid var(--line); }
details.node.is-later { opacity: .72; }
.num { font: 700 15px var(--display); color: var(--muted); }
.node-title { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; min-width: 0; }
.node-title h3 { font-size: 16px; }
.node-sub { grid-column: 2 / 4; font-size: 13.5px; color: var(--muted); }
.node-meta { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.dots { display: inline-flex; gap: 3px; align-items: center; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.dot.has { background: var(--accent); }
.dot.miss { background: var(--bad); }
.body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 18px; padding: 14px; }
@media (max-width: 820px) { .body { grid-template-columns: minmax(0, 1fr); } details.node > summary { grid-template-columns: 26px 1fr; } .node-meta { grid-column: 2; justify-content: flex-start; } .node-sub { grid-column: 2; } }

.crit { display: grid; gap: 4px; padding: 9px 0; border-bottom: 1px dashed var(--line); }
.crit:last-child { border-bottom: 0; }
.crit .rule { font-size: 14px; }
.crit .meta { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.crit .id { font: 12px var(--mono); color: var(--muted); }
.part { font: 600 12px var(--body); color: var(--muted); margin: 10px 0 0; }
.part:first-child { margin-top: 0; }
.kw { font: 600 12px var(--mono); color: var(--accent); }
.val { font: 500 12.5px var(--mono); background: var(--warn-soft); color: var(--warn); padding: 0 4px; border-radius: 4px; }
.copy { font: 12px var(--mono); background: var(--sunk); padding: 0 4px; border-radius: 4px; }
.mark { font-size: 13px; }

.lens-tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.lens-tabs button { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 3px 9px; font-size: 12.5px; cursor: pointer; display: inline-flex; gap: 5px; align-items: center; }
.lens-tabs button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.lens { background: var(--sunk); border-radius: 10px; padding: 12px; font-size: 13.5px; min-width: 0; }
.lens ul { margin: 0; padding-left: 18px; }
.lens .empty { color: var(--muted); }
.lens .req { color: var(--bad); }
.rep { display: grid; gap: 6px; min-width: 0; }
.rep-label { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.fig { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.fig svg { display: block; }
svg text { fill: var(--fg); font-family: var(--body); }
svg .sm { font-size: 11px; fill: var(--muted); }
svg .mono { font-family: var(--mono); font-size: 10.5px; }
svg .box { fill: var(--panel); stroke: var(--line); }
svg .box.start { stroke: var(--accent); stroke-width: 1.5; }
svg .box.good { fill: var(--ok-soft); stroke: var(--ok); }
svg .box.refuse { fill: var(--bad-soft); stroke: var(--bad); }
svg .edge { stroke: var(--muted); fill: none; stroke-width: 1.2; }
svg .life { stroke: var(--line); stroke-dasharray: 3 3; }
svg .lane { fill: var(--sunk); }
svg .bar-on { fill: var(--accent); }
svg .bar-off { fill: var(--line); }
svg .bar-dead { fill: none; stroke: var(--muted); stroke-dasharray: 3 3; }
svg .tick { stroke: var(--line); }
svg .mk { stroke: var(--warn); stroke-width: 1.5; }
svg .arrowfill { fill: var(--muted); }

.matrix td.ok { background: var(--ok-soft); color: var(--ok); }
.matrix td.refuse { background: var(--bad-soft); color: var(--bad); }
.matrix td.open { background: var(--warn-soft); color: var(--warn); }
.matrix td { font-size: 13px; }
.matrix th[scope="row"] { text-transform: none; font: 500 13px var(--body); color: var(--fg); letter-spacing: 0; }

.inv-grid { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13.5px; margin-bottom: 12px; }
.inv-grid dt { font: 500 11.5px var(--mono); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding-top: 2px; }
.inv-grid dd { margin: 0; min-width: 0; }

.tabs-demo { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.tab { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); overflow: hidden; }
.tab .chrome { background: var(--sunk); padding: 6px 10px; font: 12px var(--mono); color: var(--muted); display: flex; justify-content: space-between; }
.tab .pane { padding: 12px; display: grid; gap: 8px; min-height: 92px; }
.tab .who { font-weight: 600; }
.tab .acts { display: flex; flex-wrap: wrap; gap: 6px; }
.tab .acts button { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 4px 9px; font-size: 12.5px; cursor: pointer; }
.tab.syncing .pane { background: var(--warn-soft); }
.log { font: 12px var(--mono); color: var(--muted); margin-top: 6px; }

.ready-top { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 2px; }
.stat b { font: 700 28px var(--display); font-variant-numeric: tabular-nums; }
.stat.bad b { color: var(--bad); } .stat.warn b { color: var(--warn); } .stat.ok b { color: var(--ok); }
.verdict { padding: 12px 14px; border-radius: 10px; font-weight: 600; }
.verdict.bad { background: var(--bad-soft); color: var(--bad); }
.verdict.ok { background: var(--ok-soft); color: var(--ok); }

pre.src { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; overflow-x: auto; font: 12.5px/1.6 var(--mono); margin: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12.5px; color: var(--muted); }
.qs { display: grid; gap: 6px; }
.q { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: start; }
[hidden] { display: none !important; }
.pics { grid-column: 1 / -1; display: grid; gap: 14px; }
.pm .cell.wide { grid-column: 1 / -1; }
.pm .cell.wide .qs { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 8px 18px; }
.vals .val { white-space: nowrap; }
.q .who { font: 12px var(--mono); color: var(--muted); }
.note { font-size: 13px; color: var(--muted); max-width: 72ch; }
@media (prefers-reduced-motion: no-preference) { .tab .pane { transition: background .25s ease; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="crumb" id="crumb"></div>
    <h1 id="title"></h1>
    <div class="job" id="job"></div>
  </header>

  <div class="bar" role="toolbar" aria-label="View controls">
    <div class="seg" id="views" role="group" aria-label="View"></div>
    <label class="ctl">Reading as
      <select id="role"></select>
    </label>
    <label class="ctl">Release
      <select id="release">
        <option value="v1">V1 only</option>
        <option value="all">V1 and later</option>
      </select>
    </label>
    <button class="chip plain link" id="reset" type="button" hidden>Reset edited values</button>
  </div>

  <main id="main"></main>
</div>

<script>
/* ------------------------------------------------------------------
   The one source. Everything on the page is a view of this object.
   Status, readiness, lens dots, the timeline and the guard labels are
   computed from it; nothing below the data restates a fact.
------------------------------------------------------------------- */
const HUB = {
  path: "account/authentication-and-sessions",
  title: "Authentication & Sessions",
  job: "Get a returning collector into their account in one step, with no password to remember or leak.",
  who: "Collectors on the site, and operators on the admin console",
  measure: "Share of sign-in attempts that end in a session, from first action to session",
  never: [
    { title: "Passwords", why: "One email path and Google cover every collector; a password is a credential to leak and reset." },
    { title: "SMS codes", why: "Cost and SIM-swap risk for no gain over the emailed link." },
    { title: "One session across brands", why: "Grade10 and ZZZ are separate populations; a session covers the brand it was made on." }
  ],
  policy: { required: { flow: ["ux"], invariant: ["eng", "security"] }, note: "Auth domain: every flow owes UX; every invariant owes Engineering and Security." },

  values: {
    resend_wait: { value: 60, unit: "s", why: "Long enough for a normal delivery; a lost email costs one minute." },
    send_window: { value: 60, unit: "s", why: "One email per address per surface per window, so nobody floods an inbox." },
    link_ttl:    { value: 300, unit: "s", why: "Sixty seconds was shorter than delivery: a collector reading mail on another device met a dead link." },
    tab_sync:    { value: 2, unit: "s", why: "Every open tab reflects a sign-in or sign-out within this.", question: "Q4" }
  },

  dimensions: { surface: ["site", "console"], provider: ["email", "google"] },

  questions: [
    { id: "Q1", ask: "Does each language write the link lifetime as a digit or as its own word?", owner: "Product", blocks: ["email/template"] },
    { id: "Q2", ask: "How long are link tokens and send logs kept, and are they erased with the account?", owner: "Legal", blocks: ["lens:email/legal"] },
    { id: "Q3", ask: "Is an operator-sent site link written to the audit trail, with the operator named?", owner: "Security", blocks: ["admin-isolation"] },
    { id: "Q4", ask: "Is two seconds the right ceiling for every tab to agree?", owner: "Engineering", blocks: ["cross-tab-sync"] },
    { id: "Q5", ask: "If a Google account's email changes after first sign-in, which account does it reach?", owner: "Product", blocks: ["account-uniqueness"] }
  ],

  flows: [
    {
      id: "google", title: "Google Sign-In", release: "v1",
      summary: "Button and One Tap; Google proves the email, the server makes the session.",
      picture: "sequence",
      sequence: {
        actors: ["Browser", "Google", "Server"],
        steps: [
          { from: "Browser", to: "Google", text: "Continue with Google, or One Tap" },
          { from: "Google", to: "Browser", text: "Signed credential (ID token)" },
          { from: "Browser", to: "Server", text: "Credential only, never an email" },
          { from: "Server", to: "Google", text: "Verify signature and audience" },
          { from: "Server", to: "Server", text: "email_verified? → match account", cites: "account-uniqueness" },
          { from: "Server", to: "Browser", text: "New session id", cites: "session-conflict" },
          { from: "Browser", to: "Browser", text: "Tell other tabs", cites: "cross-tab-sync" }
        ]
      },
      criteria: {
        "button/pending":  { part: "Button", in: "spec", rule: "WHEN the person presses Continue with Google, the surface SHALL open Google's window and show the button as pending until it settles.", cases: [["TC-G01", "pass"]] },
        "button/cancel":   { part: "Button", in: "spec", rule: "IF the person closes Google's window without choosing an account, THEN the surface SHALL return to idle and show no error.", cases: [] },
        "button/brand":    { part: "Button", in: "spec", rule: "WHERE a brand has not enabled Google, the surface SHALL NOT show any Google control.", cases: [["TC-G03", "pass"]] },
        "onetap/prompt":   { part: "One Tap", in: "spec", rule: "WHILE a visitor is signed out on a brand that offers Google, any page SHALL offer Google's One Tap prompt.", cases: [["TC-G04", "pass"]] },
        "onetap/yield":    { part: "One Tap", in: "spec", rule: "WHILE the sign-in dialog is open, the One Tap prompt SHALL NOT show.", cases: [["TC-G05", "pass"]] },
        "onetap/decline":  { part: "One Tap", in: "spec", rule: "IF the visitor declines One Tap, THEN it SHALL NOT appear again for the rest of the visit.", cases: [["TC-G06", "pass"]] },
        "exchange":        { part: "Token exchange", in: "spec", rule: "WHEN Google returns a credential, the server SHALL verify it before making a session.", upholds: ["account-uniqueness", "session-conflict"], cases: [["TC-G07", "pass"]] }
      },
      lenses: {
        ux: ["Idle → pending while Google's window is open", "Window closed by the person → idle, no toast", "Unverified Google email → toast «auth.google.unverified»", "One Tap yields to the dialog; a decline holds for the visit"],
        ui: ["Story: auth-google-button--pending (example id)", "One Tap is Google's own prompt; no custom drawing"],
        eng: ["Google Identity Services on the client; the server verifies the ID token against Google's keys and its audience", "The client never posts an email address of its own"],
        analytics: ["sign_in_started { method: google, entry: button | one_tap }", "sign_in_completed { method: google, surface }"],
        security: ["Signal: google_unverified_refused (security log, not product analytics)"],
        legal: ["Request only the email and profile scopes"]
      }
    },
    {
      id: "email", title: "Email Magic Link", release: "v1",
      summary: "Ask for a link, wait, follow it once. The newest email is always the one that works.",
      picture: "machine",
      machine: {
        states: {
          idle: { at: [0, 1], start: true }, sending: { at: [1, 1] }, failed: { at: [1, 2.3], tone: "refuse", label: "send failed" },
          sent: { at: [2, 0.4], label: "sent, Resend off" }, ready: { at: [2, 2.3], label: "Resend on" },
          signed_in: { at: [3, 0], tone: "good", label: "signed in" }, expired: { at: [3, 1], tone: "refuse" },
          dead: { at: [3, 2], tone: "refuse", label: "used / replaced" }, mismatch: { at: [3, 3], label: "Switch or Stay" }
        },
        transitions: [
          { from: "idle", to: "sending", on: "submit" },
          { from: "sending", to: "sent", on: "ok" },
          { from: "sending", to: "failed", on: "error" },
          { from: "sent", to: "ready", on: "after {resend_wait}" },
          { from: "ready", to: "sending", on: "resend" },
          { from: "sent", to: "signed_in", on: "follow, age < {link_ttl}" },
          { from: "sent", to: "expired", on: "age ≥ {link_ttl}" },
          { from: "sent", to: "dead", on: "used or replaced" },
          { from: "sent", to: "mismatch", on: "other account" }
        ]
      },
      criteria: {
        "request/single":  { part: "Request & resend", in: "spec", rule: "WHILE a send is in flight, pressing «auth.email.cta» again SHALL NOT start a second request.", cases: [["TC-E01", "pass"]] },
        "request/confirm": { part: "Request & resend", in: "spec", rule: "WHEN the email goes out, the dialog SHALL read «auth.link.sent.title» and show the address on its own line.", cases: [["TC-E02", "pass"]] },
        "request/resend":  { part: "Request & resend", in: "spec", rule: "WHEN a send succeeds, Resend SHALL stay off for {resend_wait}, counting down on the button.", cases: [["TC-E03", "pass"]] },
        "request/cap":     { part: "Request & resend", in: "spec", rule: "IF the same address asks again on the same surface within {send_window}, THEN the server SHALL answer with a wait and send nothing.", cases: [["TC-E04", "pass"]] },
        "template":        { part: "Request & resend", in: "change", rule: "The email SHALL carry one sign-in button and say the link lasts {link_ttl}.", cases: [] },
        "follow/valid":    { part: "Follow", in: "spec", rule: "WHEN a person follows an unused link younger than {link_ttl}, the server SHALL make a session, and the tab that asked SHALL carry on with what it was stopped from doing.", upholds: ["session-conflict"], cases: [["TC-E06", "pass"]] },
        "follow/expired":  { part: "Follow", in: "spec", rule: "IF a link is followed {link_ttl} or more after it was sent, THEN no session is made and the person sees «auth.link.expired».", upholds: ["server-clock"], cases: [["TC-E07", "pass", "stale"]] },
        "follow/dead":     { part: "Follow", in: "spec", rule: "IF a link was already used or replaced, THEN no session is made and the person sees «auth.link.dead».", upholds: ["single-use"], cases: [["TC-E08", "pass"]] },
        "follow/mismatch": { part: "Follow", in: "change", rule: "IF the person is signed in as someone else, THEN the link SHALL NOT switch them; a toast offers Switch or Stay.", cases: [] },
        "follow/elsewhere":{ part: "Follow", in: "change", rule: "WHEN the address signs in on another device, a surface still waiting SHALL end its wait with a message and gain no session.", cases: [["TC-E11", "pass"]] }
      },

/* ---------- derivations ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function fmt(v) { if (v.unit === "s" && v.value >= 60 && v.value % 60 === 0) return (v.value / 60) + " min"; return v.value + " " + v.unit; }
function resolve(text) { return text.replace(/\{(\w+)\}/g, (_, k) => HUB.values[k] ? fmt(HUB.values[k]) : "{" + k + "}"); }
function hash(s) { let h = 5381; for (const c of s) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return h.toString(36); }
function rev(text) { return hash(resolve(text)); }
function richRule(text) {
  let t = esc(text);
  t = t.replace(/\{(\w+)\}/g, (_, k) => HUB.values[k] ? `<span class="val" title="${k}">${esc(fmt(HUB.values[k]))}</span>` : `{${k}}`);
  t = t.replace(/«([^»]+)»/g, (_, k) => `<span class="copy" title="Message key">${esc(k)}</span>`);
  t = t.replace(/\b(WHEN|WHILE|IF|THEN|WHERE|SHALL NOT|SHALL NEVER|SHALL|MAY)\b/g, '<span class="kw">$1</span>');
  return t;
}
// Cases record the rev they were run against. "stale" means run against an older wording or value.
const BASE = {};
function baseline() {
  for (const f of HUB.flows) for (const [id, c] of Object.entries(f.criteria)) BASE[f.id + "/" + id] = rev(c.rule);
  for (const [id, v] of Object.entries(HUB.invariants)) BASE[id] = rev(v.forbids);
}
function openQs(key) { return HUB.questions.filter(q => q.blocks.includes(key)); }
function judge(key, text, inWhere, cases, release) {
  const now = rev(text);
  const qs = openQs(key);
  const runs = cases.map(([id, result, at]) => ({ id, result, suspect: at === "stale" || BASE[key] !== now }));
  const passed = runs.filter(r => r.result === "pass" && !r.suspect);
  const failed = runs.filter(r => r.result === "fail");
  const suspect = runs.filter(r => r.suspect);
  const mark = qs.length ? "❓" : inWhere === "change" ? "🚧" : inWhere === "idea" ? "" : "";
  const status = qs.length ? "open" : inWhere === "change" ? "building" : inWhere === "idea" ? "idea" : "live";
  const proved = passed.length > 0 && !failed.length && !suspect.length;
  return { key, qs, runs, passed, failed, suspect, mark, status, proved, release, none: cases.length === 0 };
}
function allItems() {
  const out = [];
  for (const f of HUB.flows) for (const [id, c] of Object.entries(f.criteria))
    out.push({ ...judge(f.id + "/" + id, c.rule, c.in, c.cases, c.release || f.release), group: f.id, kind: "criterion", local: id, c });
  for (const [id, v] of Object.entries(HUB.invariants))
    out.push({ ...judge(id, v.forbids, v.in, v.cases, "v1"), group: id, kind: "invariant", local: id, c: v });
  return out;
}
function lensState(kind, owner, key, lenses) {
  const req = HUB.policy.required[kind] || [];
  const blockedBy = HUB.questions.filter(q => q.blocks.includes("lens:" + owner + "/" + key));
  const has = (lenses && lenses[key] && lenses[key].length > 0);
  return { has, required: req.includes(key), open: blockedBy };
}
function usedBy(valueKey) {
  const out = [];
  for (const f of HUB.flows) for (const [id, c] of Object.entries(f.criteria)) if (c.rule.includes("{" + valueKey + "}")) out.push(f.id + "/" + id);
  for (const [id, v] of Object.entries(HUB.invariants)) if (v.forbids.includes("{" + valueKey + "}")) out.push(id);
  if (HUB.flows.some(f => f.machine && f.machine.transitions.some(t => t.on.includes("{" + valueKey + "}")))) out.push("statechart");
  return out;
}

/* ---------- pictures ---------- */
function svgArrowDefs(id) { return `<defs><marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowfill" d="M0,0 L10,5 L0,10 z"/></marker></defs>`; }

function drawMachine(m) {
  const W = 150, H = 34, CX = 190, CY = 64, PAD = 14;
  const pos = {};
  for (const [k, s] of Object.entries(m.states)) pos[k] = { x: PAD + s.at[0] * CX, y: PAD + s.at[1] * CY };
  const width = PAD * 2 + 3 * CX + W, height = PAD * 2 + 3 * CY + H;
  let edges = "", nodes = "", labels = "";
  for (const t of m.transitions) {
    const a = pos[t.from], b = pos[t.to];
    let x1, y1, x2, y2;
    if (Math.abs(a.x - b.x) < 1) { x1 = a.x + W / 2; x2 = b.x + W / 2; y1 = a.y < b.y ? a.y + H : a.y; y2 = a.y < b.y ? b.y : b.y + H; }
    else if (a.x < b.x) { x1 = a.x + W; y1 = a.y + H / 2; x2 = b.x; y2 = b.y + H / 2; }
    else { x1 = a.x; y1 = a.y + H / 2; x2 = b.x + W; y2 = b.y + H / 2; }
    const back = a.x > b.x;
    if (back) { const my = Math.max(y1, y2) + 26; edges += `<path class="edge" d="M${x1},${y1} C${x1 - 30},${my} ${x2 + 30},${my} ${x2},${y2}" marker-end="url(#mA)"/>`; }
    else edges += `<line class="edge" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" marker-end="url(#mA)"/>`;
    const lt = Math.abs(a.x - b.x) < 1 ? 0.5 : 0.62;
    let lx = x1 + (x2 - x1) * lt, ly = y1 + (y2 - y1) * lt - 5;
    if (Math.abs(a.x - b.x) < 1) lx += 6;
    if (back) { lx = (x1 + x2) / 2; ly = Math.max(y1, y2) + 30; }
    const anchor = Math.abs(a.x - b.x) < 1 ? "start" : "middle";
    labels += `<text class="sm mono" x="${lx}" y="${ly}" text-anchor="${anchor}" paint-order="stroke" style="stroke:var(--panel);stroke-width:4px">${esc(resolve(t.on))}</text>`;
  }
  for (const [k, s] of Object.entries(m.states)) {
    const p = pos[k], cls = s.start ? "start" : (s.tone || "");
    nodes += `<rect class="box ${cls}" x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="17"/><text x="${p.x + W / 2}" y="${p.y + H / 2 + 4}" text-anchor="middle" font-size="12.5">${esc(s.label || k.replace("_", " "))}</text>`;
  }
  return `<svg viewBox="0 0 ${width} ${height + 20}" width="${width}" height="${height + 20}" role="img" aria-label="Statechart">${svgArrowDefs("mA")}${edges}${nodes}${labels}</svg>`;
}

function drawSequence(seq, idp) {
  const colW = 200, top = 34, rowH = 34, left = 80;
  const xs = {}; seq.actors.forEach((a, i) => xs[a] = left + i * colW);
  const width = left * 2 + (seq.actors.length - 1) * colW, height = top + seq.steps.length * rowH + 18;
  let s = svgArrowDefs(idp);
  seq.actors.forEach(a => { s += `<text x="${xs[a]}" y="18" text-anchor="middle" font-weight="600" font-size="13">${esc(a)}</text><line class="life" x1="${xs[a]}" y1="26" x2="${xs[a]}" y2="${height - 6}"/>`; });
  seq.steps.forEach((st, i) => {
    const y = top + i * rowH + 18;
    const cite = st.cites ? ` <tspan class="mono" style="fill:var(--inv)">◆ ${esc(HUB.invariants[st.cites].title)}</tspan>` : "";
    if (st.from === st.to) {
      const x = xs[st.from];
      s += `<path class="edge" d="M${x},${y - 8} h26 v12 h-24" marker-end="url(#${idp})"/><text x="${x + 32}" y="${y + 2}" font-size="12">${esc(st.text)}${cite}</text>`;
    } else {
      const x1 = xs[st.from], x2 = xs[st.to], dir = x2 > x1 ? 1 : -1;
      s += `<line class="edge" x1="${x1}" y1="${y}" x2="${x2 - dir * 2}" y2="${y}" marker-end="url(#${idp})"/><text x="${(x1 + x2) / 2}" y="${y - 6}" text-anchor="middle" font-size="12">${esc(st.text)}${cite}</text>`;
    }
  });
  return `<svg viewBox="0 0 ${width + 120} ${height}" width="${width + 120}" height="${height}" role="img" aria-label="Sequence diagram">${s}</svg>`;
}

function drawTimeline() {
  const V = HUB.values, wait = V.resend_wait.value, win = V.send_window.value, ttl = V.link_ttl.value;

  const lanes = [["Link 1", 34], ["Link 2", 64], ["Resend", 94], ["Next send", 124]];
  let s = "";
  lanes.forEach(([n, y]) => { s += `<rect class="lane" x="${L}" y="${y - 9}" width="${Wd}" height="18" rx="4"/><text class="sm" x="${L - 10}" y="${y + 4}" text-anchor="end">${n}</text>`; });
  s += `<rect class="bar-on" x="${x(0)}" y="27" width="${x(Math.min(r, ttl)) - x(0)}" height="14" rx="3"/>`;
  if (r < ttl) s += `<rect class="bar-dead" x="${x(r)}" y="27" width="${x(ttl) - x(r)}" height="14" rx="3"/>`;
  s += `<rect class="bar-on" x="${x(r)}" y="57" width="${x(r + ttl) - x(r)}" height="14" rx="3"/>`;
  s += `<rect class="bar-off" x="${x(0)}" y="87" width="${x(wait) - x(0)}" height="14" rx="3"/><rect class="bar-on" x="${x(wait)}" y="87" width="${x(r) - x(wait)}" height="14" rx="3"/><rect class="bar-off" x="${x(r)}" y="87" width="${x(r + wait) - x(r)}" height="14" rx="3"/><rect class="bar-on" x="${x(r + wait)}" y="87" width="${Math.max(0, x(end) - x(r + wait))}" height="14" rx="3"/>`;
  s += `<rect class="bar-off" x="${x(0)}" y="117" width="${x(win) - x(0)}" height="14" rx="3"/><rect class="bar-off" x="${x(r)}" y="117" width="${x(r + win) - x(r)}" height="14" rx="3"/>`;
  const marks = [[0, "send"], [wait, "Resend on · " + fmt(V.resend_wait)], [r, "resend → link 1 replaced"], [r + ttl, "link 2 expires · " + fmt(V.link_ttl)]];
  marks.forEach(([t, lab], i) => { s += `<line class="mk" x1="${x(t)}" y1="140" x2="${x(t)}" y2="20"/><text class="sm" x="${x(t) + (i === 3 ? -4 : 4)}" y="${156 + (i % 2) * 14}" text-anchor="${i === 3 ? "end" : "start"}">${esc(lab)}</text>`; });
  return `<svg viewBox="0 0 ${L + Wd + 20} 190" width="${L + Wd + 20}" height="190" role="img" aria-label="Timeline of one send and one resend">${s}</svg>
    <div class="legend"><span><span class="chip ok">solid</span> works</span><span><span class="chip plain">dashed</span> replaced, would have lived to ${esc(fmt(V.link_ttl))}</span><span>Resend example at ${esc(fmt({ value: r, unit: "s" }))}</span></div>`;
}

/* Two-tab demo: one server session, two tabs that learn of it after {tab_sync}. */
const demo = { server: null, tabs: { A: null, B: null }, pending: { A: false, B: false }, log: [] };
function demoAct(tab, act) {
  const who = act === "out" ? null : act;
  const prev = demo.server;
  demo.server = who;
  demo.tabs[tab] = who;
  demo.log.unshift(`${tab}: ${act === "out" ? "sign out" : "sign in as " + who}${prev && who && prev !== who ? " → session for " + prev + " ended (Session Conflict)" : ""}`);
  demo.log = demo.log.slice(0, 4);
  const other = tab === "A" ? "B" : "A";
  demo.pending[other] = true;
  renderDemo();
  const ms = Math.min(HUB.values.tab_sync.value, 5) * 1000;
  setTimeout(() => { demo.tabs[other] = demo.server; demo.pending[other] = false; renderDemo(); }, ms);
}
function drawTabs() { return `<div id="demo-tabs"></div>`; }
function renderDemo() {
  const el = document.getElementById("demo-tabs"); if (!el) return;
  const tab = k => `<div class="tab ${demo.pending[k] ? "syncing" : ""}"><div class="chrome"><span>Tab ${k} · grade10.com</span><span>${demo.pending[k] ? "syncing…" : "in step"}</span></div>
    <div class="pane"><div>${demo.tabs[k] ? `Signed in as <span class="who">${demo.tabs[k]}</span>` : `<span class="muted">Signed out</span>`}</div>
    <div class="acts"><button type="button" data-demo="${k}:Mei">Sign in as Mei</button><button type="button" data-demo="${k}:Sam">Sign in as Sam</button><button type="button" data-demo="${k}:out">Sign out</button></div></div></div>`;
  el.innerHTML = `<div class="tabs-demo">${tab("A")}${tab("B")}</div><div class="log">${demo.log.length ? demo.log.map(esc).join("<br>") : "Act in one tab; the other follows within " + esc(fmt(HUB.values.tab_sync)) + "."}</div>`;
}

const PICTURES = {
  machine: f => ({ label: "Statechart", note: "States, events and timers", html: drawMachine(f.machine) }),
  sequence: f => ({ label: "Sequence diagram", note: "Messages between parties", html: drawSequence(f.sequence, "m" + f.id.replace(/\W/g, "")) }),
  timeline: () => ({ label: "Timeline", note: "Durations on one clock, drawn from the values", html: drawTimeline() }),
  identity: () => ({ label: "Decision matrix", note: "First sign-in × later sign-in", html: drawIdentity() }),
  surfaces: () => ({ label: "Decision matrix", note: "Where a link came from × what it may sign in", html: drawSurfaces() }),
  tabs: () => ({ label: "Interactive demo", note: "Concurrent tabs; try it", html: drawTabs() })
};

/* ---------- views ---------- */
function chipStatus(it) {
  if (it.status === "open") return `<span class="chip warn">❓ ${it.qs.map(q => q.id).join(" ")}</span>`;
  if (it.status === "building") return `<span class="chip plain">🚧 in a change</span>`;
  if (it.status === "idea") return `<span class="chip later">idea</span>`;
  return "";
}
function chipProof(it) {
  if (it.failed.length) return `<span class="chip bad">✗ ${it.failed.map(r => r.id).join(" ")}</span>`;
  if (it.suspect.length) return `<span class="chip warn" title="The rule or a value it reads changed after this case ran">⟳ suspect ${it.suspect.map(r => r.id).join(" ")}</span>`;
  if (it.passed.length) return `<span class="chip ok">✓ ${it.passed.map(r => r.id).join(" ")}</span>`;
  return `<span class="chip plain">no case</span>`;
}
function lensDots(kind, owner, lenses) {
  return `<span class="dots" aria-label="Lens coverage">${LENSES.filter(([k]) => k !== "qa").map(([k, n]) => {
    const s = lensState(kind, owner, k, lenses);
    const cls = s.has ? "has" : (s.required || s.open.length) ? "miss" : "";
    return `<span class="dot ${cls}" title="${n}: ${s.has ? "written" : s.required ? "required, missing" : s.open.length ? "open question" : "nothing yet"}"></span>`;
  }).join("")}</span>`;
}
function lensPanel(kind, owner, lenses, items) {
  const key = ui.lens[owner] || ROLES[ui.role].lens;
  const tabs = LENSES.map(([k, n]) => `<button type="button" data-lens="${owner}:${k}" aria-pressed="${k === key}">${n}</button>`).join("");
  let body;
  if (key === "qa") {
    body = `<p class="muted" style="margin:0 0 6px">Worked out from the cases, never written by hand.</p><ul>${items.map(it => `<li><span class="mono">${esc(it.local)}</span> ${chipProof(it)}</li>`).join("")}</ul>`;
  } else {
    const s = lensState(kind, owner, key, lenses);
    const list = (lenses && lenses[key]) || [];
    body = list.length ? `<ul>${list.map(t => `<li>${richRule(t)}</li>`).join("")}</ul>`
      : s.open.length ? `<p class="req" style="margin:0">❓ ${s.open.map(q => esc(q.id + " · " + q.ask + " (" + q.owner + ")")).join("<br>")}</p>`
      : s.required ? `<p class="req" style="margin:0">Required by the ${esc(HUB.path.split("/")[0])} policy, and missing.</p>`
      : `<p class="empty" style="margin:0">Nothing yet. Optional here.</p>`;
    if (key === "security" && kind === "flow") {
      const invs = Object.entries(HUB.invariants).filter(([, v]) => v.constrains.includes(owner));
      body += `<p class="muted" style="margin:10px 0 4px">Invariants this flow must hold</p><div style="display:flex;flex-wrap:wrap;gap:5px">${invs.map(([id, v]) => `<button type="button" class="chip inv link" data-goto="${id}">◆ ${esc(v.title)}</button>`).join("")}</div>`;
    }
  }
  return `<div><div class="lens-tabs" role="group" aria-label="Lenses">${tabs}</div><div class="lens">${body}</div></div>`;
}
function picture(kind, thing) {
  if (!thing.picture) return "";
  const p = PICTURES[thing.picture](thing);
  return `<div class="rep"><div class="rep-label"><span class="eyebrow">${p.label}</span><span class="muted" style="font-size:12.5px">${p.note}</span></div><div class="fig">${p.html}</div></div>`;
}

function renderOutline(items) {
  const showLater = ui.release === "all";
  const flows = HUB.flows.filter(f => showLater || f.release === "v1");
  const qOpen = HUB.questions;
  let h = "";

  // PM block
  h += `<section class="block"><div class="pm">
    <div class="cell"><div class="eyebrow">Who</div><p>${esc(HUB.who)}</p></div>
    <div class="cell"><div class="eyebrow">Measured by</div><p>${esc(HUB.measure)}</p></div>
    <div class="cell"><div class="eyebrow">Never</div><ul>${HUB.never.map(n => `<li><b>${esc(n.title)}</b> <span class="muted">— ${esc(n.why)}</span></li>`).join("")}</ul></div>
    <div class="cell wide"><div class="eyebrow">Open questions · ${qOpen.length}</div><div class="qs" style="margin-top:6px">${qOpen.map(q => `<div class="q"><span class="chip warn">❓ ${q.id}</span><span>${esc(q.ask)} <span class="who">${esc(q.owner)}</span></span></div>`).join("")}</div></div>
  </div></section>`;

  // Values
  h += `<section class="block"><div class="sec-head"><h2>Values</h2><p>Each number lives here once. Edit one and watch the rules, the pictures and the proof follow.</p></div>
    <div class="scroll"><table class="vals"><thead><tr><th>Name</th><th>Value</th><th>Why</th><th>Read by</th></tr></thead><tbody>
    ${Object.entries(HUB.values).map(([k, v]) => `<tr class="${ORIGINAL[k].value !== v.value ? "changed" : ""}"><td class="mono">${k}${v.question ? ` <span class="chip warn">❓ ${v.question}</span>` : ""}</td>
      <td><input type="number" min="1" id="val-${k}" data-val="${k}" value="${v.value}" aria-label="${k} in seconds"> <span class="muted">${v.unit}</span> <span class="val">${esc(fmt(v))}</span></td>
      <td>${esc(v.why)}</td><td class="mono" style="font-size:11.5px">${usedBy(k).map(esc).join("<br>")}</td></tr>`).join("")}
    </tbody></table></div></section>`;

  // Flows
  h += `<section class="block"><div class="sec-head"><h2>User Flows</h2><p>In the order a person meets them.</p></div>`;
  flows.forEach((f, i) => {
    const its = items.filter(it => it.kind === "criterion" && it.group === f.id);
    const v1 = its.filter(it => it.release === "v1");
    const proved = v1.filter(it => it.proved).length;
    const opens = its.filter(it => it.status === "open").length, building = its.filter(it => it.status === "building").length;
    const parts = [...new Set(its.map(it => it.c.part))];
    h += `<details class="node ${f.release === "later" ? "is-later" : ""}" id="node-${f.id}" ${ui.open.has(f.id) ? "open" : ""} data-node="${f.id}">
      <summary><span class="num">${i + 1}</span>
        <span class="node-title"><h3>${esc(f.title)}</h3><span class="chip ${f.release === "v1" ? "v1" : "later"}">${f.release === "v1" ? "V1" : "Later"}</span></span>
        <span class="node-meta">${f.release === "v1" ? `<span class="chip ${proved === v1.length ? "ok" : "plain"}">${proved}/${v1.length} proved</span>` : ""}${opens ? `<span class="chip warn">❓ ${opens}</span>` : ""}${building ? `<span class="chip plain">🚧 ${building}</span>` : ""}${lensDots("flow", f.id, f.lenses)}</span>
        <span class="node-sub">${esc(f.summary)}${f.whyLater ? ` <b>Why later:</b> ${esc(f.whyLater)}` : ""}</span>
      </summary>
      <div class="body">${f.picture ? `<div class="pics">${picture("flow", f)}${f.id === "email" ? picture("flow", { picture: "timeline" }) : ""}</div>` : ""}<div>${parts.map(p => `<div class="part">${esc(p)}</div>${its.filter(it => it.c.part === p).map(it => `
        <div class="crit"><div class="rule">${it.mark ? `<span class="mark">${it.mark}</span> ` : ""}${richRule(it.c.rule)}</div>
        <div class="meta"><span class="id">${esc(f.id + "/" + it.local)}</span>${chipStatus(it)}${chipProof(it)}${(it.c.upholds || []).map(u => `<button type="button" class="chip inv link" data-goto="${u}">◆ ${esc(HUB.invariants[u].title)}</button>`).join("")}</div></div>`).join("")}`).join("")}</div>
      <div>${lensPanel("flow", f.id, f.lenses, its)}</div></div>
    </details>`;
  });
  h += `</section>`;

  // Invariants
  const invs = items.filter(it => it.kind === "invariant");
  h += `<section class="block"><div class="sec-head"><h2>Invariants</h2><p>Hold across every flow, from the first release. Each names what must never happen, and to whom.</p></div>`;
  invs.forEach(it => {
    const v = it.c;
    h += `<details class="node" id="node-${it.local}" ${ui.open.has(it.local) ? "open" : ""} data-node="${it.local}">
      <summary><span class="num" style="color:var(--inv)">◆</span>
        <span class="node-title"><h3>${esc(v.title)}</h3><span class="chip inv">${v.kind}</span>${chipStatus(it)}</span>
        <span class="node-meta">${chipProof(it)}${lensDots("invariant", it.local, v.lenses)}</span>
        <span class="node-sub">${it.mark ? it.mark + " " : ""}${richRule(v.forbids)}</span>
      </summary>
      <div class="body"><div><dl class="inv-grid">
        <dt>Protects</dt><dd>${esc(v.asset)}</dd>
        <dt>Against</dt><dd>${esc(v.attacker)}</dd>
        <dt>Abuse cases</dt><dd><ul style="margin:0;padding-left:18px">${v.abuse.map(a => `<li>${richRule(a)}</li>`).join("")}</ul></dd>
        <dt>Holds in</dt><dd style="display:flex;flex-wrap:wrap;gap:5px">${v.constrains.map(c => `<button type="button" class="chip v1 link" data-goto="${c}">${esc(HUB.flows.find(f => f.id === c).title)}</button>`).join("")}</dd>
      </dl></div>
      <div>${lensPanel("invariant", it.local, v.lenses, [it])}</div>${v.picture ? `<div class="pics">${picture("invariant", v)}</div>` : ""}</div>
    </details>`;
  });
  h += `</section>`;

  h += `<section class="block"><div class="sec-head"><h2>How a Fact Picks Its Picture</h2><p>A fixed rule, so nobody draws by hand and nothing drifts.</p></div>
    <div class="scroll"><table><thead><tr><th>When the data is</th><th>It renders as</th></tr></thead><tbody>${SHAPES.map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join("")}</tbody></table></div></section>`;
  return h;
}

function renderReady(items) {
  const v1 = items.filter(it => it.release === "v1");
  const blockingQ = HUB.questions.filter(q => q.blocks.some(b => v1.some(it => it.key === b)));
  const unproved = v1.filter(it => !it.proved);
  const failed = v1.filter(it => it.failed.length);
  const suspect = v1.filter(it => it.suspect.length);
  const noCase = v1.filter(it => it.none);
  const invNot = v1.filter(it => it.kind === "invariant" && !it.proved);
  const go = !blockingQ.length && !unproved.length;
  let h = `<section class="block"><div class="verdict ${go ? "ok" : "bad"}">${go ? "V1 can launch: every rule and invariant is proved at its current wording." : `V1 cannot launch yet: ${unproved.length} of ${v1.length} items are not proved, and ${blockingQ.length} open question${blockingQ.length === 1 ? "" : "s"} block V1.`}</div>
    <div class="ready-top">
      <div class="stat ${blockingQ.length ? "bad" : "ok"}"><b>${blockingQ.length}</b><span>open ❓ on V1, blocking</span></div>
      <div class="stat ${invNot.length ? "bad" : "ok"}"><b>${invNot.length}</b><span>invariants not proved</span></div>
      <div class="stat ${failed.length ? "bad" : "ok"}"><b>${failed.length}</b><span>failing cases</span></div>
      <div class="stat ${suspect.length ? "warn" : "ok"}"><b>${suspect.length}</b><span>suspect: rule or value changed since the run</span></div>
      <div class="stat ${noCase.length ? "warn" : "ok"}"><b>${noCase.length}</b><span>V1 rules with no case</span></div>
    </div>
    <p class="note">An item is proved when it has a passing case run against its current wording and values, no failing case, and no open question. Nobody signs anything off; editing a value on the Outline turns its cases suspect here. ${esc(HUB.policy.note)}</p></section>`;

  const rowsFor = (label, list, kind, owner, lenses) => {
    const p = list.filter(it => it.proved).length;
    const lensCells = LENSES.filter(([k]) => k !== "qa").map(([k]) => {
      const s = lensState(kind, owner, k, lenses);
      return `<td>${s.has ? `<span class="chip ok">✓</span>` : s.open.length ? `<span class="chip warn">❓</span>` : s.required ? `<span class="chip bad">missing</span>` : `<span class="muted">—</span>`}</td>`;
    }).join("");
    const issues = list.filter(it => !it.proved).map(it => `<button type="button" class="chip ${it.failed.length ? "bad" : it.status === "open" || it.suspect.length ? "warn" : "plain"} link" data-goto="${it.group}">${esc(it.local)}${it.failed.length ? " ✗" : it.suspect.length ? " ⟳" : it.status === "open" ? " ❓" : it.none ? " · no case" : ""}</button>`).join(" ");
    return `<tr><th scope="row" style="text-transform:none;font:600 13.5px var(--body);color:var(--fg);letter-spacing:0">${label}</th><td><span class="chip ${p === list.length ? "ok" : "plain"}">${p}/${list.length}</span></td>${lensCells}<td style="min-width:220px">${issues || `<span class="chip ok">ready</span>`}</td></tr>`;
  };
  h += `<section class="block"><div class="sec-head"><h2>By Flow and Invariant</h2><p>Lens cells: ✓ written · missing = owed by policy · ❓ waiting on a question · — optional and empty.</p></div>
    <div class="scroll"><table><thead><tr><th></th><th>Proved</th>${LENSES.filter(([k]) => k !== "qa").map(([, n]) => `<th>${n}</th>`).join("")}<th>Not yet proved</th></tr></thead><tbody>
    ${HUB.flows.filter(f => f.release === "v1").map(f => rowsFor(esc(f.title), v1.filter(it => it.kind === "criterion" && it.group === f.id), "flow", f.id, f.lenses)).join("")}
    ${Object.entries(HUB.invariants).map(([id, v]) => rowsFor("◆ " + esc(v.title), v1.filter(it => it.key === id), "invariant", id, v.lenses)).join("")}
    </tbody></table></div></section>`;

  h += `<section class="block"><div class="sec-head"><h2>Questions Blocking V1</h2><p>Each has one owner and names what it holds up.</p></div>
    <div class="scroll"><table><thead><tr><th>Id</th><th>Question</th><th>Owner</th><th>Holds up</th></tr></thead><tbody>
    ${HUB.questions.map(q => `<tr><td><span class="chip warn">❓ ${q.id}</span></td><td>${esc(q.ask)}</td><td>${esc(q.owner)}</td><td class="mono">${q.blocks.map(esc).join("<br>")}</td></tr>`).join("")}
    </tbody></table></div></section>`;
  return h;
}

function toYAML(v, ind = "") {
  const pad = ind + "  ";
  const scalar = x => {
    if (typeof x === "number" || typeof x === "boolean") return String(x);
    const s = String(x);
    return /^[\w./+ -]+$/.test(s) && !/^(true|false|null|\d)/.test(s) && !s.includes(": ") ? s : JSON.stringify(s);
  };
  if (Array.isArray(v)) {
    if (!v.length) return " []";
    if (v.every(x => typeof x !== "object") || v.every(x => Array.isArray(x) && x.every(y => typeof y !== "object"))) {
      const flat = "[" + v.map(x => Array.isArray(x) ? "[" + x.map(scalar).join(", ") + "]" : scalar(x)).join(", ") + "]";
      if (flat.length < 70) return " " + flat;
    }
    return "\n" + v.map(x => typeof x === "object" && x !== null ? pad + "- " + toYAML(x, pad + "  ").trimStart() : pad + "- " + scalar(x)).join("\n");
  }
  if (v && typeof v === "object") {
    const e = Object.entries(v);
    if (!e.length) return " {}";
    return "\n" + e.map(([k, x]) => {
      const key = /^[\w-]+$/.test(k) ? k : JSON.stringify(k);
      if (x && typeof x === "object") return pad + key + ":" + toYAML(x, pad);
      return pad + key + ": " + scalar(x);
    }).join("\n");
  }
  return " " + scalar(v);
}
function renderSource() {
  const src = { ...HUB };
  const y = toYAML(src, "").split("\n").map(l => l.slice(2)).join("\n").trim();
  return `<section class="block"><div class="sec-head"><h2>Source</h2><p>The only thing anyone writes, person or agent. Every view on this page is computed from it. Domain and feature come from the file path.</p></div>
    <p class="note mono">openspec/hub/${esc(HUB.path)}.yaml</p>
    <pre class="src">${esc(y)}</pre>
    <p class="note">Not stored here, because each is worked out: status (spec, change, open question), proof and suspect marks (cases against the rule's current revision), lens dots (policy plus what is written), the timeline and the guard labels (values).</p></section>`;
}

/* ---------- shell ---------- */
function render() {
  const items = allItems();
  document.getElementById("crumb").innerHTML = HUB.path.split("/").map((p, i, a) => i === a.length - 1 ? `<b>${esc(p)}</b>` : esc(p)).join(" / ");
  document.getElementById("title").textContent = HUB.title;
  document.getElementById("job").innerHTML = `<span class="eyebrow">Job</span><br>${esc(HUB.job)}`;
  const views = [["outline", "Outline"], ["ready", "Launch readiness"], ["source", "Source"]];
  document.getElementById("views").innerHTML = views.map(([k, n]) => `<button type="button" data-view="${k}" aria-pressed="${ui.view === k}">${n}</button>`).join("");
  document.getElementById("role").innerHTML = Object.entries(ROLES).map(([k, r]) => `<option value="${k}" ${ui.role === k ? "selected" : ""}>${r.label}</option>`).join("");
  document.getElementById("release").value = ui.release;
  document.getElementById("reset").hidden = !Object.keys(HUB.values).some(k => HUB.values[k].value !== ORIGINAL[k].value);
  const main = document.getElementById("main");
  main.innerHTML = ui.view === "outline" ? renderOutline(items) : ui.view === "ready" ? renderReady(items) : renderSource();
  renderDemo();
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-view],[data-lens],[data-goto],[data-demo]");
  if (!t) return;
  if (t.dataset.view) { ui.view = t.dataset.view; render(); window.scrollTo({ top: 0 }); }
  else if (t.dataset.lens) { e.preventDefault(); const [o, k] = t.dataset.lens.split(":"); ui.lens[o] = k; render(); }
  else if (t.dataset.demo) { e.preventDefault(); const [tab, act] = t.dataset.demo.split(":"); demoAct(tab, act); }
  else if (t.dataset.goto) {
    e.preventDefault(); const id = t.dataset.goto;
    ui.view = "outline"; ui.open.add(id);
    if (HUB.flows.some(f => f.id === id && f.release === "later")) ui.release = "all";
    render();
    const el = document.getElementById("node-" + id); if (el) el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  }
});
document.addEventListener("toggle", e => {
  const d = e.target; if (!d.dataset || !d.dataset.node) return;
  if (d.open) ui.open.add(d.dataset.node); else ui.open.delete(d.dataset.node);
  if (d.open && d.querySelector("#demo-tabs")) renderDemo();
}, true);
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.val) { const n = Number(t.value); if (n > 0) { HUB.values[t.dataset.val].value = n; render(); } }
  else if (t.id === "role") { ui.role = t.value; ui.lens = {}; save(); render(); }
  else if (t.id === "release") { ui.release = t.value; save(); render(); }
});
document.getElementById("reset").addEventListener("click", () => { for (const k in ORIGINAL) HUB.values[k].value = ORIGINAL[k].value; render(); });

baseline();
render();
</script>
